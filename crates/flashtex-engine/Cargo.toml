[package]
name = "flashtex-engine"
version = "0.1.0"
edition = "2021"
# GPL-2.0-or-later, because src/generated/ is a translation of pdfTeX's
# pdftex.web (third_party/pdftex/pdftex.web, GPL-2.0-or-later). See LICENSE in
# this directory and docs/design/engine-v2/DESIGN.md §3: nothing MIT may link
# this crate.
license = "GPL-2.0-or-later"
description = "pdfLaTeX-compatible engine core, translated from pdftex.web by tools/web2rust."
publish = false

[lib]
name = "flashtex_engine"
path = "src/lib.rs"

[[bin]]
name = "flashtex-initex"
path = "src/main.rs"

# The resident engine (DESIGN.md §5.1): S0, restore, persistence.
[[bin]]
name = "flashtex-host"
path = "src/host_main.rs"

[dependencies]

[features]
# Link TeX Live's kpathsea (vendored, LGPL-2.1-or-later) as the file resolver.
# Without it only the working-directory resolver is available, which is what
# the trip test uses.
default = ["kpathsea", "regex"]
kpathsea = []
# \pdfmatch through the C library's POSIX regcomp/regexec, as pdfTeX's
# utils.c does (csrc/flashtex_regex.c). Without it \pdfmatch reports that
# regular expressions are unavailable (the trip tests' scratch packages).
regex = []
# Build against a translation of Knuth's tex.web instead of pdftex.web: only
# scripts/flashtex-trip.sh's scratch package does, and it leaves out
# src/pdftex/ (pdfTeX's C parts), which tex.web does not call.
tex82 = []

[build-dependencies]
# Builds TeX Live's zlib (third_party/zlib; always), kpathsea (feature
# `kpathsea`) and the regular-expression shim (feature `regex`).
cc = "1"
