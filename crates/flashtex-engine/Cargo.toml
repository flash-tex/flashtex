[package]
name = "flashtex-engine"
version = "0.1.0"
edition = "2021"
# GPL-2.0-or-later, because src/generated/ is a translation of pdfTeX's
# pdftex.web (third_party/pdftex/pdftex.web, GPL-2.0-or-later). See LICENSE in
# this directory and docs/design/engine-v2/DESIGN.md §3: nothing MIT may link
# this crate.
license = "GPL-2.0-or-later"
description = "pdfLaTeX-compatible engine core, translated from pdftex.web by tools/web2rust."
publish = false

[lib]
name = "flashtex_engine"
path = "src/lib.rs"

[[bin]]
name = "flashtex-initex"
path = "src/main.rs"

# The engine host (DESIGN.md §3, §5): the resident incremental engine
# (S0, checkpoints, restart and converge, viewport first) serving
# display-list-v3 over a Unix socket (docs/protocol/display-list-v3.md §6),
# plus the measuring subcommands (serve, iserve, bench, open, selftest).
[[bin]]
name = "flashtex-host"
path = "src/host/main.rs"

# The distribution tool (DESIGN.md 4.4): TeX Live report, format cache,
# bundles. See src/bin/flashtex-dist.rs.
[[bin]]
name = "flashtex-dist"
path = "src/bin/flashtex-dist.rs"
required-features = ["distribution"]

[dependencies]
# MIT (DESIGN.md §3): the display-list-v3 wire format, shared with the app's
# side so both encode and decode one definition. The dependency points from
# the GPL engine to the MIT crate, never the other way.
flashtex-display-list = { path = "../display-list-v3" }
# SHA-256 for the format cache's read-set keys and the bundle's pinned
# content hashes (feature `distribution`). MIT OR Apache-2.0.
sha2 = { version = "0.10", optional = true }
# The engine build id the format cache keys formats by (build-id/: a SHA-256
# of every source of this crate, computed without rerunning build.rs).
flashtex-engine-build-id = { path = "build-id", optional = true }

[features]
# Link TeX Live's kpathsea (vendored, LGPL-2.1-or-later) as the file resolver.
# Without it only the working-directory resolver is available, which is what
# the trip test uses.
default = ["kpathsea", "regex", "distribution"]
kpathsea = []
# DESIGN.md 4.4: the format cache (src/formats.rs) and the bundle fallback
# (src/bundle/). Off in the trip tests' scratch packages, which copy src/*.rs
# without dependencies.
distribution = ["kpathsea", "dep:sha2", "dep:flashtex-engine-build-id"]
# \pdfmatch through the C library's POSIX regcomp/regexec, as pdfTeX's
# utils.c does (csrc/flashtex_regex.c). Without it \pdfmatch reports that
# regular expressions are unavailable (the trip tests' scratch packages).
regex = []
# Build against a translation of Knuth's tex.web instead of pdftex.web: only
# scripts/flashtex-trip.sh's scratch package does, and it leaves out
# src/pdftex/ (pdfTeX's C parts), which tex.web does not call.
tex82 = []
# Measurement only: the word space without its write barrier, to price the
# barrier alone (docs/evidence/p4-l1-2026-09-29/). Checkpoints are wrong
# with it; never ship it.
bench-no-barrier = []
# Measurement only: the generated code's array reads without bounds checks
# (src/ix.rs), to price the checks (docs/evidence/l6-optimizations-2026-09-29/).
# Every build that ships or is tested checks them; never ship this.
unchecked-reads = []
# Measurement only: count element writes per array (printed at exit).
bench-count-writes = []

[build-dependencies]
# Builds TeX Live's zlib (third_party/zlib; always), kpathsea (feature
# `kpathsea`) and the regular-expression shim (feature `regex`).
cc = "1"
