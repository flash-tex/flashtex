[package]
name = "flashtex-xetex-fontlibs"
version = "0.1.0"
edition = "2021"
# TeX Live 2026's HarfBuzz 12.3.2 (MIT, "Old MIT" licence) and FreeType
# 2.14.1, which FlashTeX uses under FreeType's GPL-2.0-or-later option
# (third_party/freetype/README.md: LICENSE.TXT offers the FTL or "the GNU
# General Public License version 2 ... (any later version can be used
# also)"). This crate's own code is GPL-2.0-or-later, like the XeTeX port
# that links it. No Apache-2.0-only code is vendored (both READMEs).
license = "GPL-2.0-or-later AND MIT"
description = "TeX Live 2026's HarfBuzz and FreeType, vendored unmodified (third_party/harfbuzz, third_party/freetype), built as TeX Live builds them, with raw FFI for the XeTeX port."
publish = false
build = "build.rs"
links = "flashtex_xetex_fontlibs"

[lib]
name = "flashtex_xetex_fontlibs"
path = "src/lib.rs"

[build-dependencies]
cc = "1"
