[package]
name = "flashtex-xetex-pplib"
version = "0.1.0"
edition = "2021"
# TeX Live 2026's pplib (Paweł Jackowski's PDF reader, written for LuaTeX),
# vendored unmodified (third_party/pplib). Its tree carries no licence text;
# it is distributed as part of LuaTeX and TeX Live, and Debian's texlive-bin
# copyright file gives `libs/pplib/*` as GPL-2+ (third_party/pplib/README.md).
# FlashTeX uses it under GPL-2.0-or-later and links it only into the GPL
# XeTeX port. csrc/flashtex_pdfimage.c is XeTeX's pdfimage.cpp (MIT). This
# crate's own code is GPL-2.0-or-later, like the port that links it.
license = "GPL-2.0-or-later AND MIT"
description = "TeX Live 2026's pplib, vendored unmodified (third_party/pplib), built as TeX Live builds it, with XeTeX's pdfimage.cpp over it: the page count and page boxes of a PDF picture for the XeTeX port."
publish = false
build = "build.rs"
links = "flashtex_xetex_pplib"

[lib]
name = "flashtex_xetex_pplib"
path = "src/lib.rs"

[dependencies]
# pplib's flate filter calls zlib (`inflate`, `deflate`). TeX Live links its
# own zlib 1.3.2 (`ZLIB_INCLUDES`, `ZLIB_LIBS`); the TECkit crate already
# builds exactly that (third_party/zlib, `Z_PREFIX`) for the same binary, so
# this crate compiles against the same headers and links that archive.
flashtex-xetex-teckit = { path = "../teckit" }

[build-dependencies]
cc = "1"
