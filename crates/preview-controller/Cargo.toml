[package]
name = "flashtex-preview-controller"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
flashtex-document-runtime = { path = "../document-runtime" }
flashtex-project-index = { path = "../project-index" }
flashtex-edit-ledger = { path = "../edit-ledger" }
flashtex-project-files = { path = "../project-files" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
getrandom = "0.4"

[dev-dependencies]
tempfile = "3"
