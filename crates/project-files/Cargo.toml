[package]
name = "flashtex-project-files"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Original FlashTeX project file layer: normalized project graph, content identity, atomic saves, external-change detection, crash recovery."

[lib]
name = "flashtex_project_files"
path = "src/lib.rs"

[dependencies]
libc = "0.2.189"
unicode-normalization = "0.1.25"

[features]
# Deterministic race-test hooks (`save::race_hook`). Test-only and never on by
# default: a normal or release build contains no hook code. This crate's own
# integration tests turn it on through the self dev-dependency below.
race-hook = []

[dev-dependencies]
flashtex-project-files = { path = ".", features = ["race-hook"] }
