[package]
name = "flashtex-bridge"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Capture receipt, Grok conversion, and revision-aware reviewed edits for FlashTeX"

[dependencies]
base64 = "0.22"
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
