[package]
name = "flashtex-tex-text-encoding"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Original FlashTeX model of pdfLaTeX text input/font encodings (UTF-8 input, OT1/T1/TS1), text accents and symbols, TeX's \\accent positioning, ligature/kern main loop and space factor. No TeX at runtime."

[lib]
name = "flashtex_tex_text_encoding"
path = "src/lib.rs"

[dependencies]

[dev-dependencies]
serde_json = "1"
