[package]
name = "flashtex-paragraph-layout"
version = "0.1.0"
edition = "2024"
description = "Original FlashTeX paragraph line breaking (Knuth-Plass total-fit and first-fit), horizontal/vertical metrics, and deterministic page breaking behind an integration API. No external crates."
publish = false

[lib]
name = "flashtex_paragraph_layout"
path = "src/lib.rs"

[dependencies]
flashtex-document-style = { path = "../document-style" }
# pdfTeX protrusion/expansion rules and arithmetic (`src/microtype.rs`).
flashtex-microtype = { path = "../microtype" }

# No old-engine dev-dependencies (retirement S1, #1236). The FT-030 rev 3 tests
# that consumed font-engine's `FaceMetrics` and the compiler's greedy layout now
# live in crates/compiler/tests/paragraph_layout_*.rs and retire with it.
