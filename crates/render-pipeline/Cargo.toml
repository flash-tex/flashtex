[package]
name = "flashtex-render-pipeline"
version = "0.1.0"
edition = "2021"
description = "Original FlashTeX rendering pipeline: compiler parse tree -> styled blocks -> font-engine shaping -> Knuth-Plass line breaking (paragraph-layout) -> Appendix G math boxes (math-layout) -> pages -> display list v2 + runtime-v1 fallback."
publish = false

[lib]
name = "flashtex_render_pipeline"
path = "src/lib.rs"

[[bin]]
name = "flashtex-render"
path = "src/bin/flashtex-render.rs"

# Every sibling dependency is the LIVE crate next door (`../<name>`), like any
# other workspace member's. There are no pinned mirrors and nothing is ever
# re-pinned: `crates/render-pipeline/vendor/` was retired under engine-v2
# DESIGN.md §9.4, so a sibling change reaches this crate the moment it merges.
# The only registry crates are font-resources' serde/serde_json/sha2.
#
# The features below were the "pin-survival" flags: each guarded an arm that
# could not compile against the frozen mirror, so it stayed off until the next
# re-pin. Their preconditions are now permanently met wherever the live sibling
# carries the API. The ones still off are off because turning one on CHANGES
# OUTPUT, so each needs its own parity and perf-digest evidence; promoting one
# is a one-line edit to `default`, and
# `docs/proposals/generated-data-and-maintainability.md` §3.2 slice 2 tracks
# folding them away entirely.
[features]
# Everything in `default` is required against the live siblings: without it the
# pipeline's exhaustive matches over the compiler's `Nucleus`, `Block` and
# `Inline` enums
# (`hash_math`/`shift_math`/`math_grids`/`math_glue_em`/`convert_math_classed`,
# the adapter's block and inline arms) do not compile at all.
# `--no-default-features` is therefore no longer a supported configuration; it
# existed to build against an older frozen mirror.
default = ["amsmath-inline", "request-date", "compiler-package-gating", "par-leading", "math-class-override", "compiler-node-surface", "linebreak-skip"]
# The compiler's `Nucleus::Text` (`\text{...}` in math) is an isolated
# candidate (crates/preview-controller/docs/handoffs/hw1-text-candidate/
# candidate.patch on compiler base 1c02a2bc, not on main). This feature
# enables the pipeline's conversion arm for it; it builds only against a
# compiler that carries the variant, which `crates/compiler` does not yet, so
# it is off by default.
compiler-text-nucleus = []
# The request's date reaches `\today` (`RenderOptions::today`,
# `protocol/proposals/runtime-v1-request-date.md`). Builds only against a
# compiler carrying `parser::parse_project_with`/`date::TodayDate`
# (crates/compiler of branch engine/today-date-compiler, PR #220), which
# landed in #225 -- `crates/compiler/src/date.rs` is present and `TODAY_TEXT`
# is gone -- so this is a default feature. Without it the shipped `flashtex-render`
# validates, carries and cache-keys the request's date and then renders the
# epoch anyway, which is the bug the whole chain exists to fix. With the feature off the
# request's date is still validated, carried and cache-keyed -- only the
# substitution is missing, so `\today` renders the epoch as it always has.
request-date = []
# FT-061 amsmath inline constructs: the compiler's `GenFraction`
# (`\dfrac`/`\tfrac`/`\binom`/`\genfrac`), `Phantom`, `Operator`
# (`\operatorname`, `\DeclareMathOperator`) and `SubArray` (`\substack`)
# nuclei, set with math-layout's delimited `Fraction`, `BigDelimiter`
# (`\big`..`\Bigg`), `Phantom`, `SubArray` and `Glue` (nested `\,`/`\quad`).
# `crates/compiler` and `crates/math-layout` carry all of them, so this is a
# default feature.
amsmath-inline = []
# The compiler gates package-provided math commands on the packages the
# document loaded, which gave `text_builtins::text_kern` a required `amsmath`
# parameter (amsmath renews `\thinspace`/`\negthinspace` to `.1667em`). Only
# `kern_command_text`'s reverse lookup here reads that function. A default
# feature: `crates/compiler` carries the gating.
compiler-package-gating = []
# Per-glyph source spans inside math (math-layout `SourceTag`, PR #161):
# math clusters and rules get the provenance of the atom that produced them
# (sub/superscripts, fraction parts, `\left`/`\right` delimiters, ...) instead
# of the whole formula, and glyphs can be painted per source range
# (`MathRec::span_paints`). Builds only against a `crates/math-layout` that
# carries `SourceTag` (PR #161), which it does not yet; off.
math-glyph-spans = []
# The compiler exposes `MathAtom::class_override` and `math::AtomClass`
# publicly, so the forced atom class is read from the atom instead of being
# re-derived by matching the control word at its span
# (`typeset::class_override_of`). Needed for `\colon`, whose class depends on
# whether amsmath is loaded and so cannot be recovered from the source text at
# all; the re-derivation stays as the fallback. `crates/compiler`'s `math.rs`
# declares `pub class_override: Option<AtomClass>` and `pub enum AtomClass`,
# so this is a default feature. Without it #472's mathtools colon relations are merged but inert
# here: every `\colon` is re-derived from the same five source characters and
# so takes one class whether or not amsmath is loaded.
math-class-override = []
# A paragraph's `\baselineskip` follows the size declaration in force when its
# `\par` ran (`\begin{quote}\small ...\end{quote}`, `{\small ...\par}`),
# which is what TeX reads in `append_to_vlist` (§679). Needs the compiler's
# `Parsed::block_par_leading`, which it carries, so this is a default feature;
# with it off every paragraph keeps the body leading as it used to.
par-leading = []
# `\\[<dimen>]`'s skip is read off the compiler's own `Inline::LineBreak`
# (`skip_pt`) instead of being re-scanned out of the source bytes after the
# node's span. The byte scan cannot see the argument of a `\\` that came from a
# macro body -- there the span is the invocation, so the bytes after it are the
# call's arguments -- which silently drops every `\\[-6pt]` inside a
# `\newcommand` (`fixtures/real-world/cv`: +5.98bp per `\cvsection`,
# `tests/line_break_skip_macro.rs`). Needs the compiler's
# `parser::Inline::LineBreak::skip_pt`, which it carries, so this is a default
# feature; with it off the byte scan behaves as it used to.
linebreak-skip = []
# TeX's math font kerns (`make_ord`, tex.web §752): `TexMathMetrics` and
# `TextRunMetrics` answer math-layout's `MathFontMetrics::ord_pair`, so an Ord
# character followed by a character of the same family gets the font's kern
# (cmmi `r` `,` = -0.0556 em: HW1's `$r,a,b$`, #66) and a roman character loses
# its italic correction before the next one. The same step forms the roman
# ligatures (`\mathrm{f}\mathrm{i}` is one fi glyph, a one-character `\mathrm`
# being a family-0 math character) and kerns one-character math alphabets
# (`\mathbf{T}\mathbf{o}`). Needs math-layout's `ord_pair`
# (`crates/math-layout`, GH-MATH-FONT-KERNS), which it does not carry yet; off,
# and with it off no math kern is inserted. Promoting it changes every math
# formula's metrics, so it needs its own parity and perf-digest evidence.
math-font-kerns = []
# Emit the optional `path_fill.pattern` display-list-v2 extension consumed by
# the TikZ-pattern-aware pdf sibling. Off keeps the existing wire bytes.
tikz-patterns = []
# The pipeline's exhaustive matches and node constructors cover the full node
# surface of `crates/compiler`: `parser::Block::Penalty`/`Tabbing`, `parser::Inline::ThePage`/
# `PageNumbering`/`TabStop`/`TabJump`/`Marginpar`/`PagePenalty`/`Discretionary`
# and the parameter nodes, `math::Nucleus::TextRun`/`SideSet`/`Lap`,
# `math::Accent::Mathring`, and `VSpace`/`HSpace`'s glue components
# (compiler #568, #581, #583, #587, #606, #616). It carries **no behaviour of
# its own**: every arm it adds is the inert one the pipeline already had for a
# node the frozen mirror could not produce, so it changes no output. It existed
# so the vendor re-pin was one mechanical step; a default feature now, and
# without it the crate does not compile against the live compiler at all. The
# stacked pipeline PRs (#569, #582, #584, #585, #599, #607, #617) replace the
# inert arms with real layout.
compiler-node-surface = []

[dependencies]
flashtex-compiler = { path = "../compiler" }
flashtex-font-engine = { path = "../font-engine" }
flashtex-paragraph-layout = { path = "../paragraph-layout" }
# pdfTeX character protrusion/font expansion (the `microtype` package):
# config resolution per font; `../paragraph-layout` depends on the same crate.
flashtex-microtype = { path = "../microtype" }
flashtex-math-layout = { path = "../math-layout" }
flashtex-document-style = { path = "../document-style" }
flashtex-pdf = { path = "../pdf" }
flashtex-font-resources = { path = "../font-resources" }
flashtex-project-files = { path = "../project-files" }
flashtex-vector-graphics = { path = "../vector-graphics" }
# utf8.def / *.dfu declarations and the NFSS text-command tables, for literal
# UTF-8 input (`src/inputenc.rs`). Already a dependency of `../compiler`.
flashtex-tex-text-encoding = { path = "../tex-text-encoding" }
# The standard-class + geometry page frame (exact sp). Zero dependencies.
flashtex-class-geometry = { path = "../class-geometry" }
# The installed-font index behind named families (`\setmainfont`,
# `[fonts]` in the manifest). Zero dependencies, like class-geometry.
flashtex-font-discovery = { path = "../font-discovery" }
