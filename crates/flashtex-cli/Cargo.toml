[package]
name = "flashtex-cli"
version = "0.1.0"
edition = "2021"
description = "flashtex: the FlashTeX engine on the command line — build, check, watch, supported, worker, fonts."
publish = false
build = "build.rs"

[[bin]]
name = "flashtex"
path = "src/main.rs"

# The engine is linked, never spawned: `flashtex build` is the render
# pipeline in-process plus the pdf sibling's exact route. The pdf,
# project-files and compiler paths point at the pipeline's pinned vendor
# mirrors on purpose: they must be the very package instances
# `flashtex-render-pipeline` links (Cargo refuses two path packages with
# the same name and version in one lockfile), and `vendor/pdf` is pinned to
# main's `crates/pdf` (see crates/render-pipeline/vendor/VENDORING.md).
[dependencies]
flashtex-render-pipeline = { path = "../render-pipeline" }
flashtex-pdf = { path = "../render-pipeline/vendor/pdf" }
flashtex-project-files = { path = "../render-pipeline/vendor/project-files" }
flashtex-compiler = { path = "../render-pipeline/vendor/compiler" }
# The optional `flashtex.toml` (docs/user/project-manifest.md): entry,
# texinputs, output. Platform-free and network-free, so it links here like
# the engine does; the reads it implies go through the vendored rooted
# primitives above.
flashtex-project-manifest = { path = "../project-manifest" }
# Package resolution (docs/user/project-manifest.md `[packages]`): local
# libraries, the per-user cache and consent-gated fetches. The one place
# the CLI may touch the network, and only under `--fetch`/the manifest.
flashtex-package-resolver = { path = "../package-resolver" }
