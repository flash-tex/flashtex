[package]
name = "flashtex-compiler"
version = "0.1.0"
edition = "2021"
description = "Original FlashTeX compiler foundation: lexing, a finite LaTeX subset, layout, and the runtime-v1 JSON Lines transport."
publish = false

[lib]
name = "flashtex_compiler"
path = "src/lib.rs"

[[bin]]
name = "flashtex-compiler"
path = "src/main.rs"

[dependencies]
flashtex-bibliography = { path = "../bibliography" }
flashtex-font-engine = { path = "../font-engine" }
flashtex-tex-text-encoding = { path = "../tex-text-encoding" }
flashtex-tex-boxes = { path = "../tex-boxes" }
flashtex-tex-expansion = { path = "../tex-expansion" }
