[package]
name = "flashtex-perf-bench"
version = "0.1.0"
edition = "2021"
description = "Original FlashTeX engine performance harness (FT-070): cold and warm per-phase timings, peak RSS, byte-identity digests and a regression gate over the real-world and synthetic corpus."
publish = false

[lib]
name = "flashtex_perf_bench"
path = "src/lib.rs"

# The FT-070 memory profile. Its own binary because it installs a counting
# global allocator, which the timing binary must not have.
[[bin]]
name = "memprofile"
path = "src/bin/memprofile.rs"

[[bin]]
name = "flashtex-perf-bench"
path = "src/main.rs"

# The product path, so the harness measures exactly what the app runs. The
# pipeline links the live `crates/compiler` (vendor/ is retired), so a change
# under `crates/compiler` is measured here the moment it merges -- no
# `--worker` detour and no re-pin (see README.md, "Which compiler am I
# measuring?").
[dependencies]
flashtex-render-pipeline = { path = "../render-pipeline" }
flashtex-compiler = { path = "../compiler" }
flashtex-font-engine = { path = "../font-engine" }

# `[profile.release]` and `[profile.perf]`, which the committed baselines
# depend on, live in the workspace root Cargo.toml: cargo ignores `[profile]`
# in a non-root member, and this crate became one when vendor/ was retired.
