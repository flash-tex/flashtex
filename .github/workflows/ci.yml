# FlashTeX CI, tiered (docs/design/engine-v2/DESIGN.md §9, owner-approved
# 2026-09-29; the merge queue slimmed to a gate on 2026-10-05). See
# docs/ci-cd.md.
#
# WHY. On 2026-09-27 a run on main took 225-275 minutes, almost all of it macOS
# jobs queueing. Tiering fixed pull requests, but by 2026-10-04 a merge_group
# run still took 45-130 minutes wall: the Mac app (19-24 min on hosted
# macos-26), the Rust workspace (16-22, on the PC) and engine parity (13-19,
# on the PC) ran in every group, and up to 8 groups at a time queued for the
# PC's three runners. Owner, 2026-10-05: "30-60 mins per merge is absolutely
# unacceptable ... can't we merge more stuff in and test later as needed?"
#
#   pr (pull_request, and push to any branch but main)       for reviewers
#     build, the crates the branch touches (fmt/clippy/tests), the licence
#     boundary, the bundled inventory and the generated-table gates; trip,
#     etrip, pdfTeX's regression tests (Linux); the NEW engine's parity
#     (GitHub-hosted, sharded) when the branch touches the engine or its
#     harnesses (`engine` below). Hosted macOS jobs only when the branch
#     touches apps/ (`apple` below): the Mac app and the iPad companion, and
#     the OLD engine's parity fixtures when it also touches their paths.
#
#   gate (merge_group; manual with gate_only)       target <= 12 min engine,
#                                                    <= 5 min otherwise
#     plan, licence boundary, inventory, generated tables, build, quick, trip,
#     etrip, pdfTeX regression (all GitHub-hosted Linux), and the new engine's
#     parity when the GROUP touches engine-affecting paths, sharded across the
#     PC's runners: lockstep, the P-T1/P-T2 fixtures and the engine's tests,
#     one job each, each with a warm per-runner target directory. Nothing
#     else: no Mac, no iPad, no full workspace. Parity stays gated before
#     merge (parity > speed).
#
#   post (push to main; manual without gate_only; and nightly.yml)
#     the Mac app, the iPad companion, the Rust workspace on Linux and macOS,
#     render-pipeline, flashtex-cli, flashtex-xetex, the macOS legs of trip,
#     etrip and pdfTeX's regression tests, the old engine's parity fixtures,
#     and the new engine's parity (GitHub-hosted, which also keeps the caches
#     warm for pull requests). Fixed forward: a failure opens or updates the
#     `main-red` issue, naming the pull requests the push merged
#     (scripts/ci/main-red.sh). Policy: the PR's owner fixes forward within
#     2 hours, or the Commander reverts.
#
# WHERE. The three NixOS runners on the owner's PC (label flashtex-linux) take
# only the gate's engine-parity shards (and nightly.yml's engine jobs), and
# only on merge_group and manual runs (`engine_nixos` in plan) -- never a
# pull request or a branch push (DESIGN §9.3), and no longer the workspace
# build or the Rust workspace, which queued the gate's parity behind them.
# The PC and the self-hosted Macs have separate switches,
# FLASHTEX_SELFHOSTED_LINUX and FLASHTEX_SELFHOSTED_MAC (see plan), so one
# being offline does not take the other out of service; with the PC switched
# off the gate's parity runs on GitHub-hosted Ubuntu instead. Every other
# Linux job is on ubuntu-latest (the repository is public: free).
#
# Nightly and weekly suites live in nightly.yml.
#
# scripts/gate.sh runs exactly these steps locally: `scripts/gate.sh pr` before
# pushing means this workflow only confirms a result you already have.
name: CI

on:
  push:
    # Every in-repo branch, not just main: an agent gets the fast set from a
    # push, without needing a pull request, and self-hosted runners only ever
    # see in-repo code (§9.3). Not the merge queue's own gh-readonly-queue/*
    # branches: their merge_group run already tests that exact tree, and the
    # extra push run only queued a second copy of the macOS jobs.
    branches-ignore: ['gh-readonly-queue/**']
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      engine_parity_hosted:
        description: also run the GitHub-hosted engine parity job (it is otherwise the fallback)
        type: boolean
        default: false
      gate_only:
        description: run only the merge-queue gate (what a merge_group run runs, with engine parity), to measure it
        type: boolean
        default: false

concurrency:
  # On main and in the merge queue, every run gets a group of its own
  # (`-<run_id>`), so a push can never supersede the run that is testing the
  # previous commit. Everywhere else the key is the ref, so a branch's runs
  # still collapse onto its newest push.
  #
  # `cancel-in-progress` is NOT what was cancelling main: it already
  # evaluates to false for a push. The cancellations came from the group key
  # itself -- a shared key holds at most one in-progress and one pending run,
  # and every new push cancelled the pending one. With a mac job that queues
  # for hours behind a merge cadence measured in minutes, that meant main's
  # runs were cancelled before they could report. 37 of the last 40 runs on
  # main ended `cancelled`; exactly one completed.
  group: ci-${{ github.workflow }}-${{ github.ref }}${{ (github.ref == 'refs/heads/main' || github.event_name == 'merge_group') && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Which tier, whether this run is a duplicate, and which Mac runners to use.
  # One cheap job so the answer is computed once and visible in the summary,
  # instead of the same three expressions copied onto a dozen `if:` lines.
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # The tier: `pr`, `gate` (merge_group, or a manual run with gate_only)
      # or `all` (push to main, manual): see the header.
      tier: ${{ steps.p.outputs.tier }}
      # 'true' when this run must run the post-merge set (Mac app, iPad, Rust
      # workspace, standalone crates, macOS legs): push to main, manual runs.
      post: ${{ steps.p.outputs.post }}
      # 'false' when this run is a duplicate of one already covering this SHA.
      run: ${{ steps.p.outputs.run }}
      # 'true' when the repository has self-hosted Macs (labels flashtex)
      # switched on AND this run is allowed to use them. See the
      # FLASHTEX_SELFHOSTED_MAC note below.
      selfhosted_mac: ${{ steps.p.outputs.selfhosted_mac }}
      # The same for the NixOS runners (labels flashtex-linux), switched by
      # FLASHTEX_SELFHOSTED_LINUX (falling back to FLASHTEX_SELFHOSTED_MAC
      # while it is unset).
      selfhosted_linux: ${{ steps.p.outputs.selfhosted_linux }}
      # A JSON array for `runs-on` on the Xcode jobs.
      mac_runner: ${{ steps.p.outputs.mac_runner }}
      # The same choice for the Rust/trip jobs' macOS matrix leg (hosted: macos-15).
      mac_rust_runner: ${{ steps.p.outputs.mac_rust_runner }}
      # 'true' when this run must run the new engine's parity gates.
      engine: ${{ steps.p.outputs.engine }}
      # Where they run: the gate's shards on the NixOS PC (engine_nixos), or
      # GitHub-hosted Ubuntu (engine_hosted); both on a manual run that asks.
      engine_nixos: ${{ steps.p.outputs.engine_nixos }}
      engine_hosted: ${{ steps.p.outputs.engine_hosted }}
      # 'true' when this run must run the OLD engine's parity fixtures (a
      # macOS job): after the merge always; on a pull request or branch push
      # only when the change touches both their paths (`old_engine` in the
      # script) and apps/ (`apple`); never in the gate.
      old_engine: ${{ steps.p.outputs.old_engine }}
      # 'true' when the Xcode jobs (Mac app, iPad) run: after the merge, and
      # on a pull request or branch push that touches apps/.
      apple: ${{ steps.p.outputs.apple }}
      # JSON `os` lists for the Rust workspace/standalone jobs and for
      # trip/etrip/pdftex-regression: the gate and pull requests run trip and
      # co. on Linux only and the Rust jobs not at all; after the merge, both
      # systems.
      rust_os: ${{ steps.p.outputs.rust_os }}
      trip_os: ${{ steps.p.outputs.trip_os }}
    steps:
      - name: Decide
        id: p
        env:
          GH_TOKEN: ${{ github.token }}
          # Two repository variables, NOT secrets, and not something a
          # workflow can discover for itself: GITHUB_TOKEN has no
          # `administration` scope, so no job can list the repository's
          # runners. The Commander sets
          #   gh variable set FLASHTEX_SELFHOSTED_MAC --body 1
          # after installing a Mac runner (scripts/ci/install-selfhosted-runner.sh),
          #   gh variable set FLASHTEX_SELFHOSTED_LINUX --body 1
          # after installing the NixOS runners
          # (scripts/ci/install-selfhosted-runner-nixos.sh), and either back
          # to 0 to send that side's jobs to GitHub-hosted runners again. Until
          # a switch is 1, its jobs use GitHub-hosted runners, so the fallback
          # is the default rather than an emergency path. While
          # FLASHTEX_SELFHOSTED_LINUX is unset, the NixOS side follows
          # FLASHTEX_SELFHOSTED_MAC (the single switch both used to share).
          SELFHOSTED_MAC_VAR: ${{ vars.FLASHTEX_SELFHOSTED_MAC }}
          SELFHOSTED_LINUX_VAR: ${{ vars.FLASHTEX_SELFHOSTED_LINUX }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
          GATE_ONLY: ${{ inputs.gate_only }}
          ENGINE_PARITY_HOSTED: ${{ inputs.engine_parity_hosted }}
        run: |
          set -euo pipefail

          # The tier (see the header):
          #   gate  merge_group, or a manual run with gate_only
          #   all   push to main, or a manual run without it: the post-merge
          #         set (and, on a manual run, the gate too)
          #   pr    pull_request, and push to any other branch
          case "$EVENT" in
            merge_group) tier='gate' ;;
            workflow_dispatch) if [ "$GATE_ONLY" = "true" ]; then tier='gate'; else tier='all'; fi ;;
            push) if [ "$REF" = "refs/heads/main" ]; then tier='all'; else tier='pr'; fi ;;
            *) tier='pr' ;;
          esac
          post=false
          [ "$tier" = "all" ] && post=true

          # A fork pull request may never reach a self-hosted runner (§9.3).
          # Self-hosted runners (the Macs run the owner's working account, the
          # NixOS PC is on the owner's network) take only code the Commander
          # has queued or pushed to main: merge_group, push to main and manual
          # runs. Never pull_request or branch pushes. Each side then needs its
          # own switch to be 1.
          trusted_event=false
          case "$EVENT" in
            merge_group|workflow_dispatch) trusted_event=true ;;
            push) [ "$REF" = "refs/heads/main" ] && trusted_event=true ;;
          esac
          mac_switch="${SELFHOSTED_MAC_VAR:-0}"
          # Unset FLASHTEX_SELFHOSTED_LINUX: follow the Mac switch, as before
          # the two were split.
          linux_switch="${SELFHOSTED_LINUX_VAR:-$mac_switch}"
          selfhosted_mac=false
          selfhosted_linux=false
          if [ "$trusted_event" = "true" ]; then
            [ "$mac_switch" = "1" ] && selfhosted_mac=true
            [ "$linux_switch" = "1" ] && selfhosted_linux=true
          fi

          # Deduplication. An in-repo branch with an open pull request gets two
          # events for the same commit (`push` and `pull_request`). The
          # pull_request run is the one that carries the required checks, so the
          # push run stands down. A branch with no pull request still gets the
          # full pr set from its push.
          run=true
          if [ "$EVENT" = "push" ] && [ "$REF" != "refs/heads/main" ]; then
            branch="${REF#refs/heads/}"
            # The `head` filter is OWNER:branch, not owner/repo:branch. With the
            # repository name in there it silently matches nothing, and the
            # deduplication never fires -- every in-repo pull request would run
            # the whole fast set twice. Verified against a branch that has an
            # open pull request (1) and one that does not (0).
            open=$(gh api "repos/$THIS_REPO/pulls?state=open&head=$OWNER:$branch&per_page=1" \
                     --jq 'length' 2>/dev/null || echo 0)
            if [ "${open:-0}" != "0" ]; then
              run=false
            fi
          fi

          # The files this run changes, fetched at most once, and only when a
          # path filter below needs them. UNKNOWN (the API failed or hit its
          # cap) means "assume everything is touched".
          files_fetched=false
          files=
          changed_files() {
            [ "$files_fetched" = true ] && return 0
            files_fetched=true
            case "$EVENT" in
              pull_request)
                # This endpoint lists at most 3000 files; at the cap, UNKNOWN.
                files=$(gh api --paginate "repos/$THIS_REPO/pulls/$PR_NUMBER/files?per_page=100" \
                          --jq '.[].filename') || files=UNKNOWN
                if [ "$files" != UNKNOWN ] && [ "$(grep -c . <<<"$files")" -ge 3000 ]; then
                  files=UNKNOWN
                fi ;;
              merge_group)
                # The merge group's own diff: base_sha (main) to head_sha
                # (main plus every pull request up to and including this one).
                # The compare API lists at most 300 files; at the cap, UNKNOWN.
                files=$(gh api "repos/$THIS_REPO/compare/$MG_BASE...$MG_HEAD" \
                          --jq 'if (.files | length) >= 300 then "UNKNOWN" else .files[].filename end') \
                  || files=UNKNOWN ;;
              *)
                files=$(gh api "repos/$THIS_REPO/compare/main...$SHA" \
                          --jq 'if (.files | length) >= 300 then "UNKNOWN" else .files[].filename end') \
                  || files=UNKNOWN ;;
            esac
          }
          # touches <ERE>: does this run change a path matching it? A here-
          # string, not `printf | grep -q`: grep -q exits at the first match,
          # and under pipefail the writer's SIGPIPE would turn a hit into a miss.
          touches() {
            changed_files
            [ "$files" = UNKNOWN ] || grep -qE "$1" <<<"$files"
          }

          # The new engine's parity gates (DESIGN §8 T1, §1.1 P-T1/P-T2): on
          # every push to main and manual run; in the merge queue, on a pull
          # request and on a branch push only when the change touches what
          # they build, run or compare against:
          #   - the engine and its path dependencies (display-list-v3), the
          #     root Cargo.toml and Cargo.lock (it builds --locked in the root
          #     workspace);
          #   - its translator (tools/web2rust), its harnesses (tools/lockstep,
          #     tools/parity and the two directories parity.py imports), the
          #     pinned sources (third_party/), the fixtures;
          #   - the gate's own definition: scripts/engine-parity.sh, the TeX
          #     Live action, this file.
          # A merge group's diff is cumulative (main to the group's head), so
          # once an engine change is in the queue, every group behind it runs
          # parity too -- which is what testing that exact tree requires.
          engine_paths='^(crates/(flashtex-engine|display-list-v3)/|Cargo\.(toml|lock)$|tools/(web2rust|lockstep|parity|visual-oracle|real-world-corpus)/|third_party/|fixtures/|scripts/engine-parity\.sh$|\.github/actions/texlive-2026/|\.github/workflows/ci\.yml$)'
          engine=false
          [ "$tier" = "all" ] && engine=true
          [ "$EVENT" = "workflow_dispatch" ] && engine=true
          if [ "$engine" != "true" ] && [ "$run" = "true" ] && touches "$engine_paths"; then
            engine=true
          fi
          # The gate's shards go to the PC (merge_group and manual runs, with
          # its switch on). Everything else -- pull requests, the push to main
          # (which also keeps the Actions caches warm for pull requests), and
          # the gate when the PC is switched off -- runs the hosted twin.
          engine_nixos=false
          engine_hosted=false
          if [ "$engine" = "true" ]; then
            if [ "$selfhosted_linux" = "true" ] && [ "$EVENT" != "push" ]; then
              engine_nixos=true
            fi
            if [ "$engine_nixos" != "true" ] || [ "$ENGINE_PARITY_HOSTED" = "true" ]; then
              engine_hosted=true
            fi
          fi

          # The Xcode jobs and every other hosted macOS job: after the merge
          # (post); on a pull request or branch push only when it touches
          # apps/ (the Mac app, the iPad companion and their fonts); never in
          # the gate.
          apple=false
          case "$tier" in
            all) apple=true ;;
            pr) [ "$run" = "true" ] && touches '^apps/' && apple=true ;;
          esac

          # The OLD engine's parity fixtures (parity-fixtures and its hosted
          # twin). That engine is frozen (D13, fixes only), and the job needs a
          # Mac. It runs after the merge (every push to main, where a failure
          # files `main-red`), never in the gate, and on a pull request or a
          # branch push only when the change touches apps/ (`apple`, the
          # hosted-macOS rule) AND something the fixtures tier depends on:
          #   - flashtex-cli and every path crate it links, transitively, with
          #     dev-dependencies (`cargo metadata` of crates/flashtex-cli). The
          #     parity-fixtures action checks this list against cargo metadata
          #     (scripts/ci/check-old-engine-paths.sh); a new path dependency
          #     can only arrive through a Cargo.toml already on the list, so
          #     the check runs exactly when the list can go stale;
          #   - the root Cargo.toml and Cargo.lock (it builds in the root
          #     workspace, --locked);
          #   - tools/parity and the two tool directories it imports
          #     (tools/visual-oracle, tools/real-world-corpus);
          #   - fixtures/ (the documents and their pdflatex references) and
          #     apps/mac/Fonts (the font directory parity.py hands the CLI);
          #   - the action itself and this workflow.
          old_engine_crates='bibliography|class-geometry|compiler|docstrip|document-style|flashtex-cli|font-discovery|font-engine|font-resources|math-layout|microtype|package-resolver|paragraph-layout|pdf|project-files|project-manifest|render-pipeline|tex-boxes|tex-expansion|tex-text-encoding|vector-graphics'
          old_engine=false
          case "$tier" in
            all) old_engine=true ;;
            pr)
              if [ "$apple" = "true" ] && touches "^(crates/($old_engine_crates)/|Cargo\.(toml|lock)$|tools/(parity|visual-oracle|real-world-corpus)/|fixtures/|apps/mac/Fonts/|\.github/actions/parity-fixtures/|\.github/workflows/ci\.yml$)"; then
                old_engine=true
              fi ;;
          esac

          # Where the Rust workspace/standalone jobs and trip/etrip/pdftex-
          # regression run: the gate and pull requests run trip and co. on
          # Linux and the Rust jobs not at all (quick covers the touched
          # crates, build the whole workspace); after the merge, both on Linux
          # and macOS.
          case "$tier" in
            all) rust_os='["ubuntu-latest","macos-15"]'; trip_os="$rust_os" ;;
            *) rust_os='[]'; trip_os='["ubuntu-latest"]' ;;
          esac

          # The Xcode jobs (mac app, iPad simulator) always use the hosted
          # macos-26 image: their snapshot baselines and simulator device names
          # are tied to that image's Xcode, and a self-hosted Mac on another
          # Xcode fails them (DesignSnapshots; exit 70 on a missing simulator).
          # Only the Rust/trip/etrip/parity legs move to self-hosted Macs.
          mac_runner='["macos-26"]'
          if [ "$selfhosted_mac" = "true" ]; then
            mac_rust_runner='["self-hosted","macOS","ARM64","flashtex"]'
          else
            mac_rust_runner='["macos-15"]'
          fi

          {
            echo "tier=$tier"
            echo "post=$post"
            echo "run=$run"
            echo "selfhosted_mac=$selfhosted_mac"
            echo "selfhosted_linux=$selfhosted_linux"
            echo "mac_runner=$mac_runner"
            echo "mac_rust_runner=$mac_rust_runner"
            echo "engine=$engine"
            echo "engine_nixos=$engine_nixos"
            echo "engine_hosted=$engine_hosted"
            echo "old_engine=$old_engine"
            echo "apple=$apple"
            echo "rust_os=$rust_os"
            echo "trip_os=$trip_os"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### CI plan"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| event | \`$EVENT\` |"
            echo "| ref | \`$REF\` |"
            echo "| tier | **$tier** |"
            echo "| runs | $run |"
            echo "| self-hosted Macs | $selfhosted_mac |"
            echo "| self-hosted NixOS | $selfhosted_linux |"
            echo "| Mac runner | \`$mac_runner\` |"
            echo "| new engine parity | $engine (NixOS shards: $engine_nixos, hosted: $engine_hosted) |"
            echo "| Mac app / iPad | $apple |"
            echo "| old engine parity fixtures | $old_engine |"
            echo "| Rust workspace / standalone | \`$rust_os\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$run" != "true" ]; then
            echo "This branch has an open pull request; its pull_request run carries the checks." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

  # ===========================================================================
  # The gate: every event, including the merge queue. Target: <= 5 minutes,
  # plus engine parity (<= 12) when the change touches the engine.
  # ===========================================================================

  # §9.2 "build": the whole root workspace must compile, all targets, before
  # anything else is believed. Debug, not release: the release profile is two to
  # three times slower. It is also what catches a change that breaks a crate
  # it did not touch: `quick` builds and tests only the touched crates.
  build:
    name: build (workspace, all targets)
    needs: [plan]
    if: needs.plan.outputs.run == 'true'
    # GitHub-hosted on every event since 2026-10-05: on the PC it queued
    # behind the gate's engine-parity shards (30 minutes, measured), and the
    # PC is kept for those.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: workspace-debug
      - run: cargo build --workspace --all-targets --locked

  # fmt, clippy and tests, scoped to the crates this branch touches. The steps
  # ARE scripts/gate.sh quick -- the same script an agent runs before pushing,
  # so the two cannot drift.
  quick:
    name: quick (touched crates)
    needs: [plan]
    if: needs.plan.outputs.run == 'true'
    # Always GitHub-hosted (owner, 2026-09-30): light, and the repository is
    # public, so it costs nothing. The PC keeps the heavy jobs only.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # gate.sh scopes itself with `git diff <base>...HEAD`, which needs the
          # merge base. A shallow clone has no merge base.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: workspace-debug
      - name: Resolve the base revision
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # On a pull request the base is the PR's base commit. On a push or in
          # the merge queue it is main -- which for a push to main itself is
          # HEAD~1, so the diff is that push's own commits.
          if [ -n "${BASE_SHA:-}" ]; then
            base="$BASE_SHA"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            base="$(git rev-parse HEAD~1)"
          else
            git fetch --no-tags origin main
            base="$(git rev-parse origin/main)"
          fi
          echo "FLASHTEX_GATE_BASE=$base" >> "$GITHUB_ENV"
          echo "base revision: $base"
      - name: scripts/gate.sh quick
        run: scripts/gate.sh quick --committed-only

  # DESIGN §3 / §9.6. Cheap, and the whole licensing argument depends on it.
  boundary:
    name: licence boundary
    needs: [plan]
    if: needs.plan.outputs.run == 'true'
    # Always GitHub-hosted (owner, 2026-09-30): light, and the repository is
    # public, so it costs nothing. The PC keeps the heavy jobs only.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: No MIT crate or iPad target may reach the GPL engine
        run: scripts/check-license-boundary.sh

  # The Mac app's bundled command inventory must stay byte-identical to the
  # compiler's. That gate lived only in `mac-app` below, on a macOS runner --
  # and macOS runners queue for hours behind ~90 branches, so in practice a
  # compiler PR could drift the inventory and nothing would say so until
  # someone ran the Mac suite by hand. It is a sha256 comparison of two files;
  # it does not need a Mac.
  inventory:
    name: bundled inventory matches the compiler
    needs: [plan]
    if: needs.plan.outputs.run == 'true'
    # Always GitHub-hosted (owner, 2026-09-30): light, and the repository is
    # public, so it costs nothing. The PC keeps the heavy jobs only.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Completion vocabulary is the compiler's inventory
        run: apps/mac/scripts/sync-supported-latex.sh --check

  # Cheap source-level gates that need no build and no TeX: no generated table
  # or generator changed without the other (scripts/check-generated.py). The
  # Core 14 AFM tables are the one generator whose inputs CI can fetch, so they
  # are fully re-derived. There is no pin gate any more: every crate depends on
  # its live siblings (engine-v2 DESIGN.md §9.4).
  gates:
    name: generated tables
    needs: [plan]
    if: needs.plan.outputs.run == 'true'
    # Always GitHub-hosted (owner, 2026-09-30): light, and the repository is
    # public, so it costs nothing. The PC keeps the heavy jobs only.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generated tables match the manifest
        run: python3 scripts/check-generated.py
      - uses: actions/setup-python@v5
        with:
          # crates/font-engine/src/generated.rs records Python unicodedata
          # 15.0.0, which is Python 3.12's. Another version is "cannot check".
          python-version: "3.12"
      - name: Core 14 AFM tables re-derive byte-identically (gen_tables.py --check)
        # Inputs are never committed (crates/font-engine/README.md,
        # "Reproducibility"): matplotlib ships Adobe's AFMs unmodified and
        # TeX Live ships glyphlist.txt (fetch-glyphlist.sh: Adobe's pinned
        # commit first, CTAN mirrors as fallback, digest-checked; #1101).
        # gen_tables.py --check refuses (exit 2) unless every input's SHA-256
        # matches the committed header, and --strict makes that refusal fail
        # the job.
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/core14"; mkdir -p "$work"
          python -m pip download --quiet --no-deps --only-binary=:all: matplotlib==3.9.2 -d "$work"
          python -m zipfile -e "$work"/matplotlib-*.whl "$work/mpl"
          export FLASHTEX_CORE14_AFM_DIR="$work/mpl/matplotlib/mpl-data/fonts/pdfcorefonts"
          FLASHTEX_GLYPHLIST="$(scripts/ci/fetch-glyphlist.sh "$work/glyphlist")"
          export FLASHTEX_GLYPHLIST
          python scripts/check-generated.py --run --strict --only "font-engine core14"

  # THE OLD ENGINE's parity fixtures tier (the frozen flashtex-cli path, D13).
  # It stays until P5 retires that path; the new engine's gates are
  # `engine-parity` below. It needs a Mac: baseline-fixtures.json was recorded on
  # macOS, because unicode-accents paints CJK from system fonts
  # (tools/parity/README.md). Two jobs, one body (.github/actions/parity-fixtures):
  #
  #   parity-fixtures            self-hosted Apple Silicon, in-repo code only
  #   parity-fixtures-hosted     GitHub-hosted, and the fallback for everything
  #
  # When it runs, exactly one of the two runs. They carry different check names
  # on purpose -- branch protection requires only "CI required" below, and two
  # check runs with one name on the same commit would be ambiguous.
  #
  # They never run in the merge queue (a macOS job; the gate has none). After
  # the merge (push to main, manual runs) they always run, and on main a
  # failure opens or updates the `main-red` issue (the `main-red` job below).
  # On a pull request or branch push they run only when the change touches
  # apps/ (the hosted-macOS rule) and something the fixtures depend on
  # (`old_engine` in plan: the CLI's crates, the workspace manifests,
  # tools/parity and what it imports, fixtures/, apps/mac/Fonts, the action,
  # this file). `CI required` fails a run where old_engine is 'true' and
  # neither passed.
  parity-fixtures:
    name: "old engine: parity fixtures (self-hosted macOS)"
    needs: [plan]
    # DESIGN §9.3: a job on `runs-on: [self-hosted, ...]` must never run for a
    # pull_request from a fork. A fork PR runs arbitrary code, and a self-hosted
    # runner is a machine on the team's network with the team's caches on it.
    if: >-
      needs.plan.outputs.run == 'true' && needs.plan.outputs.selfhosted_mac == 'true' &&
      needs.plan.outputs.old_engine == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64, flashtex]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/parity-fixtures
        with:
          jobs: "6"

  parity-fixtures-hosted:
    name: "old engine: parity fixtures (GitHub-hosted macOS)"
    needs: [plan]
    if: >-
      needs.plan.outputs.run == 'true' && needs.plan.outputs.selfhosted_mac != 'true' &&
      needs.plan.outputs.old_engine == 'true'
    # macos-14 and later GitHub runners are Apple Silicon (arm64).
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/parity-fixtures
        with:
          jobs: "3"

  # THE NEW ENGINE's parity gates (DESIGN §8 T1, §1.1 P-T1/P-T2): build
  # flashtex-initex (release) and its formats, run lockstep on every case and
  # the parity fixtures tier at P-T1 and P-T2 against TeX Live 2026's pdfTeX
  # 1.40.29, and the engine's tests with FLASHTEX_REQUIRE_TEXLIVE=1 (a test
  # that would skip for want of TeX Live fails). The body is
  # scripts/engine-parity.sh, which runs the same steps on any machine with
  # TeX Live.
  #
  # SHARDED (2026-10-05). As one job it took 10-21 minutes on a busy PC
  # (build 212 s, lockstep 499 s -- 1,466 cases, one after another --
  # parity 192 s, tests 348 s, measured on main). Now three jobs on three
  # runners, each running only its own steps; the lockstep shard also runs
  # its cases in parallel (engine-parity.sh --jobs, run.py --shard):
  #
  #   lockstep      build, lockstep
  #   P-T fixtures  build, parity (P-T1 and P-T2 on the fixtures tier)
  #   engine tests  tests
  #
  # The gate's critical path is the slowest shard, not their sum.
  #
  #   engine-parity         the NixOS PC (TeX Live 2026 first on its runners'
  #                         PATH): the merge queue and manual runs (§9.3)
  #   engine-parity-hosted  GitHub-hosted Ubuntu with a digest-pinned TeX Live
  #                         2026: pull requests that touch the engine, every
  #                         push to main (post-merge, and the caches), and the
  #                         fallback when the NixOS runners are switched off
  #                         (FLASHTEX_SELFHOSTED_LINUX, plan's selfhosted_linux)
  #
  # `CI required` fails a gate run (merge_group) in which plan's `engine` is
  # 'true' and neither job passed in full (a matrix job passes only when every
  # shard does).
  engine-parity:
    name: engine parity (NixOS, ${{ matrix.shard }})
    needs: [plan]
    if: >-
      needs.plan.outputs.run == 'true' && needs.plan.outputs.engine_nixos == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, flashtex-linux]
    timeout-minutes: 30
    strategy:
      # A red shard frees the other two runners at once for the next group.
      fail-fast: true
      matrix:
        include:
          # Lockstep cases are ~one core each and small: 8 at a time.
          - {shard: lockstep, id: lockstep, steps: build lockstep, jobs: 8}
          # -j 4, not 8: each parity worker holds up to ~2 GB while it
          # compares a \tracingall log, and each runner instance is a systemd
          # service with MemoryHigh=9G. At -j 8 the cgroup sat at its limit
          # and the fixtures tier crawled (over 14 minutes instead of about 2).
          - {shard: P-T fixtures, id: fixtures, steps: build parity, jobs: 4}
          - {shard: engine tests, id: tests, steps: tests, jobs: 4}
    env:
      FLASHTEX_REQUIRE_TEXLIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: this runner's build directory; a fresh oracle cache
        # A per-runner target directory outside the checkout, so a run
        # rebuilds only what changed (the checkout is cleaned every job): the
        # warm cache. Per runner, not shared: cargo locks a target directory
        # for a whole build, so shards sharing one would build in turn.
        # The oracle's P-T references are NOT kept between runs here: an
        # oracle run that a cancelled or starved job cut short was once
        # cached as complete (its traced log truncated), and every later run
        # then failed P-T1 on that fixture. Kept, they save ~15 s.
        run: |
          set -euo pipefail
          echo "CARGO_TARGET_DIR=$HOME/.cache/flashtex-ci/$RUNNER_NAME/target-engine-parity" >> "$GITHUB_ENV"
          echo "FLASHTEX_PARITY_CACHE=$RUNNER_TEMP/parity-oracle" >> "$GITHUB_ENV"
      - name: scripts/engine-parity.sh ${{ matrix.steps }}
        run: scripts/engine-parity.sh --jobs ${{ matrix.jobs }} ${{ matrix.steps }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-parity-nixos-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/engine-parity/lockstep.txt
            ${{ runner.temp }}/engine-parity/parity/report.md
            ${{ runner.temp }}/engine-parity/parity/documents.json
          if-no-files-found: ignore
          retention-days: 14

  engine-parity-hosted:
    name: engine parity (GitHub-hosted, ${{ matrix.shard }})
    needs: [plan]
    # Also on every push to main: that is the post-merge parity check, and
    # the Actions cache is scoped by ref -- a pull request can restore only
    # its own caches and main's. Without this run nothing would save the TeX
    # Live tree and the oracle's references on main, and every pull request
    # would start cold (measured unsharded: 9 min 23 s to 10 min 2 s cold, 5
    # to 7.5 min warm).
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.engine_hosted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {shard: lockstep, id: lockstep, steps: build lockstep, jobs: 4}
          - {shard: P-T fixtures, id: fixtures, steps: build parity, jobs: 4}
          - {shard: engine tests, id: tests, steps: tests, jobs: 4}
    env:
      FLASHTEX_REQUIRE_TEXLIVE: "1"
      # texlive/texlive:latest-medium as of 2026-09-27 (TeX Live 2026, pdfTeX
      # 1.40.29). Pinned by digest; see .github/actions/texlive-2026.
      TEXLIVE_IMAGE: texlive/texlive@sha256:961215b30a17099ee677cedbb9163fe755ebca1d7e8b0b9fa73248a2f53bd198
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/texlive-2026
        with:
          image: ${{ env.TEXLIVE_IMAGE }}
          # What the fixtures read (pdflatex -recorder on every fixture,
          # mapped through texlive.tlpdb) that scheme-medium lacks: beamer
          # loads both. TeX Live 2026 revision 77682 of each.
          extra: |
            sansmathaccent 62cf97334eb2c1d4056cb7f72ef2e59d99edaef151c3f4870116cc23056394b9
            translations a7766687fd777e7077a68d6d908cb43da0673616e58ebc31741b22108d4af591
      - name: qpdf (P-T2 normalises with it; engine-parity.sh checks for it)
        run: command -v qpdf || { sudo apt-get update -qq && sudo apt-get install -y -qq qpdf; }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: engine-parity-${{ matrix.id }}
      - name: the oracle's P-T references, cached per TeX Live image
        # Saved only by a job that passed, so a cut-short oracle run (which
        # fails P-T1) is never kept. Only the fixtures shard runs the oracle.
        if: matrix.id == 'fixtures'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/parity-oracle
          key: parity-oracle-${{ env.TEXLIVE_IMAGE }}-${{ hashFiles('fixtures/**', 'tools/parity/capture.py', 'tools/parity/tiers.py') }}
          restore-keys: parity-oracle-${{ env.TEXLIVE_IMAGE }}-
      - name: scripts/engine-parity.sh ${{ matrix.steps }}
        env:
          FLASHTEX_PARITY_CACHE: ${{ runner.temp }}/parity-oracle
        run: scripts/engine-parity.sh --jobs ${{ matrix.jobs }} ${{ matrix.steps }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-parity-hosted-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/engine-parity/lockstep.txt
            ${{ runner.temp }}/engine-parity/parity/report.md
            ${{ runner.temp }}/engine-parity/parity/documents.json
          if-no-files-found: ignore
          retention-days: 14

  # ===========================================================================
  # The post-merge set: push to main and manual runs (plan's `post`; plus
  # nightly.yml). Not in the merge queue since 2026-10-05; fixed forward
  # through the `main-red` issue (the `main-red` job below).
  #
  # The Rust jobs cannot be reached from a `pull_request` event (`rust_os` is
  # empty), so their macOS leg can take a possibly self-hosted runner from
  # plan.outputs.mac_rust_runner without repeating the fork guard. The Xcode
  # jobs do run on a pull request that touches apps/ (`apple`), always on
  # GitHub-hosted macos-26 (`mac_runner` is never self-hosted).
  # ===========================================================================

  # Every crate of the root Cargo workspace (Cargo.toml), built and tested
  # together: one resolve, one target directory, one cache. This replaced a
  # 12-crate matrix that never ran the other 26 crates.
  rust-workspace:
    name: rust workspace (${{ matrix.os }})
    needs: [plan]
    # Both legs after the merge (push to main) and on manual runs.
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.rust_os != '[]'
    # The Linux leg is GitHub-hosted since 2026-10-05: nobody waits on it
    # after the merge, and on the PC it held a runner for 12 minutes that the
    # gate's engine-parity shards needed. (It also works on the PC: the
    # engine's build records the C++ runtime's directory as an rpath when it
    # is outside /usr and /lib, crates/flashtex-engine/build.rs.)
    runs-on: ${{ matrix.os == 'macos-15' && fromJSON(needs.plan.outputs.mac_rust_runner) || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      # The pinned Latin Modern faces and rooted TFM metrics vendored for the
      # app bundle, so the render-pipeline/pdf tests that need them run
      # instead of skipping (no TeX installation on the runners).
      FLASHTEX_FONT_DIRS: ${{ github.workspace }}/apps/mac/Fonts
      # Latin Modern, EC (T1 without lmodern) and AMS symbol metrics — the same three trees the app bundles.
      FLASHTEX_TFM_DIRS: ${{ github.workspace }}/apps/mac/Fonts/texmf/fonts/tfm/public/lm:${{ github.workspace }}/apps/mac/Fonts/texmf/fonts/tfm/jknappen/ec:${{ github.workspace }}/apps/mac/Fonts/texmf/fonts/tfm/public/amsfonts/symbols
      FLASHTEX_LM_DIR: ${{ github.workspace }}/apps/mac/Fonts
    strategy:
      fail-fast: false
      matrix:
        # macos-14 and later GitHub runners are Apple Silicon (arm64).
        os: ${{ fromJSON(needs.plan.outputs.rust_os) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: workspace
      # TEMPORARY TEST EXCLUSIONS live in scripts/rust-test-exclude.txt, which
      # scripts/gate.sh reads too, so the local gate and CI cannot disagree
      # about which crates are gating. Every crate there still has to BUILD
      # (all targets, below); only its tests are skipped, each with an open
      # issue, and the list may only shrink.
      - name: Read the test-exclusion list
        run: |
          set -euo pipefail
          list="$(sed -e 's/#.*//' scripts/rust-test-exclude.txt | tr '[:space:]' ' ' | tr -s ' ')"
          echo "RUST_TEST_EXCLUDE=$list" >> "$GITHUB_ENV"
          echo "excluded: ${list:-none}"
      - name: cargo build --workspace --all-targets --release
        run: cargo build --workspace --all-targets --release --locked
      - name: cargo test --workspace --release
        # --no-fail-fast: without it cargo aborts at the first failing test
        # binary, so the rest of the workspace's targets never execute and the
        # job reports only the first casualty. render-pipeline was once
        # reporting "92 passed" while a local --no-fail-fast run at the same
        # commit executed 177.
        run: |
          set -euo pipefail
          excludes=()
          for p in $RUST_TEST_EXCLUDE; do excludes+=(--exclude "$p"); done
          {
            echo "### cargo test --workspace (${{ matrix.os }})"
            echo "Temporarily excluded (built, not gated): \`${RUST_TEST_EXCLUDE:-none}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          cargo test --workspace --release --locked --no-fail-fast ${excludes[@]+"${excludes[@]}"}
      - name: excluded crates (not gating; warns once they pass)
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          for p in $RUST_TEST_EXCLUDE; do
            if cargo test --release --locked --no-fail-fast -p "$p"; then
              echo "::warning::$p passes now; remove it from scripts/rust-test-exclude.txt and close its issue"
              echo "- \`$p\`: **passes**; remove it from the exclusion list" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- \`$p\`: still failing (expected while its issue is open)" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

  # render-pipeline and flashtex-cli built and tested on their own. They are
  # ordinary workspace members since vendor/ was retired, so `rust-workspace`
  # already covers them; this job stays because the parity scoreboard below
  # needs a CLI of its own, and because a per-crate failure is easier to read
  # than one inside the 38-crate run. perf-bench is tested by perf.yml on
  # every pull request that touches crates/.
  #
  # flashtex-xetex (the XeTeX port, docs/design/xetex/PLAN.md) is a real
  # standalone crate: its own Cargo.lock and target/, excluded from the root
  # workspace. It links the pdfTeX engine's runtime and is web2rust's output,
  # so it runs here after the merge, whatever the change; before the merge, a
  # pull request or merge group that touches crates/flashtex-engine/** or
  # tools/web2rust/** builds and tests it in `scripts/gate.sh quick` (the
  # gate), so an engine API change cannot break it silently. Its tests need
  # no TeX.
  rust-standalone:
    name: rust ${{ matrix.crate }} (${{ matrix.os }})
    needs: [plan]
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.rust_os != '[]'
    # Linux leg always GitHub-hosted (owner, 2026-09-30); the macOS leg's
    # runner comes from plan.
    runs-on: ${{ matrix.os == 'macos-15' && fromJSON(needs.plan.outputs.mac_rust_runner) || 'ubuntu-latest' }}
    timeout-minutes: 40
    env:
      FLASHTEX_FONT_DIRS: ${{ github.workspace }}/apps/mac/Fonts
      FLASHTEX_TFM_DIRS: ${{ github.workspace }}/apps/mac/Fonts/texmf/fonts/tfm/public/lm:${{ github.workspace }}/apps/mac/Fonts/texmf/fonts/tfm/jknappen/ec:${{ github.workspace }}/apps/mac/Fonts/texmf/fonts/tfm/public/amsfonts/symbols
      FLASHTEX_LM_DIR: ${{ github.workspace }}/apps/mac/Fonts
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.rust_os) }}
        crate:
          - render-pipeline
          - flashtex-cli
          - flashtex-xetex
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # The root workspace for render-pipeline and flashtex-cli, which have
          # no lockfile or target/ of their own any more; flashtex-xetex has.
          key: ${{ matrix.crate }}
          workspaces: ${{ matrix.crate == 'flashtex-xetex' && 'crates/flashtex-xetex -> target' || '. -> target' }}
      - name: cargo build --release
        working-directory: crates/${{ matrix.crate }}
        run: cargo build --release --locked
      - name: cargo test --release
        working-directory: crates/${{ matrix.crate }}
        run: cargo test --release --locked --no-fail-fast

  # Knuth's trip test for the tex.web translation in crates/flashtex-engine
  # (DESIGN.md §12, P1 exit gate). Self-contained: the fixtures, including
  # trip.tfm, are committed under third_party/knuth/trip/, so no TeX is
  # installed. The script generates the trip configuration into a scratch
  # package, never into the committed src/generated/, and fails unless
  # tripin.log, trip.log and tripos.tex are byte-identical to Knuth's masters
  # and the terminal transcripts differ only in the two accepted ways.
  trip:
    name: trip test (${{ matrix.os }})
    needs: plan
    # Linux on every run; macOS after the merge (push to main) and on manual
    # runs, and never on a push that duplicates a pull request's run.
    if: needs.plan.outputs.run == 'true'
    # Linux leg always GitHub-hosted (owner, 2026-09-30); the macOS leg's
    # runner comes from plan.
    runs-on: ${{ matrix.os == 'macos-15' && fromJSON(needs.plan.outputs.mac_rust_runner) || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.trip_os) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: trip
      - name: third_party/knuth checksums
        working-directory: third_party/knuth
        run: shasum -a 256 -c SHA256SUMS
      # DVItype for the trip.typ gate (tripman.tex step 5). Without it that
      # comparison only ever SKIPped, so CI never checked the trip DVI
      # (#1208). Ubuntu's texlive-binaries ships it; the Linux leg then
      # requires it (TRIP_REQUIRE_DVITYPE=1).
      - name: dvitype (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends texlive-binaries
          echo "TRIP_REQUIRE_DVITYPE=1" >> "$GITHUB_ENV"
      - name: scripts/flashtex-trip.sh
        run: TRIP_WORK="$RUNNER_TEMP/trip" scripts/flashtex-trip.sh
      # The trip/etrip harness's own checks (#1208): byte-exact .fot
      # comparison, and the timeout that kills a hung engine's process group.
      - name: trip harness self-tests
        run: |
          python3 tools/web2rust/tools/test_trip_fot.py
          python3 scripts/tests/test_run_with_timeout.py

  # e-TeX's trip test (etrip) for the pdftex.web translation in
  # crates/flashtex-engine (DESIGN.md sections 8 and 12, P2). Self-contained:
  # the fixtures, etrip.tfm and TeX Live's own pdftex output for them are
  # committed under third_party/pdftex/, so no TeX is installed. The script
  # generates the etrip configuration into a scratch package, never into the
  # committed src/generated/, and fails unless every log, transcript, \write
  # file and DVI file matches pdfTeX's after the normalisations it lists.
  etrip:
    name: etrip test (${{ matrix.os }})
    needs: plan
    # Linux on every run; macOS after the merge (push to main) and on manual
    # runs, and never on a push that duplicates a pull request's run.
    if: needs.plan.outputs.run == 'true'
    # Linux leg always GitHub-hosted (owner, 2026-09-30); the macOS leg's
    # runner comes from plan.
    runs-on: ${{ matrix.os == 'macos-15' && fromJSON(needs.plan.outputs.mac_rust_runner) || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.trip_os) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: etrip
      - name: third_party/pdftex checksums
        working-directory: third_party/pdftex
        run: shasum -a 256 -c SHA256SUMS
      - name: scripts/flashtex-etrip.sh
        run: ETRIP_WORK="$RUNNER_TEMP/etrip" scripts/flashtex-etrip.sh

  # pdfTeX's own regression tests (DESIGN.md section 8, tier T0) for the
  # pdftex.web translation in crates/flashtex-engine: TeX Live 2026's
  # `pdftex_tests`, unmodified, with the files they read, pinned under
  # third_party/pdftex/regression/, so no TeX is installed. The script runs
  # each test as TeX Live's `make check` does and fails on any failure except
  # the expected ones it lists with their owning lane.
  pdftex-regression:
    name: pdfTeX regression tests (${{ matrix.os }})
    # Both legs GitHub-hosted (owner, 2026-09-30). The same OS matrix as
    # trip and etrip (plan's `trip_os`): Linux on every run, including the
    # merge queue; macOS after the merge (push to main, where a failure files
    # `main-red`) and on manual runs, so the queue never waits on a hosted
    # macOS runner.
    needs: [plan]
    if: needs.plan.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.trip_os) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: pdftex-regression
      - name: third_party/pdftex/regression checksums
        working-directory: third_party/pdftex/regression
        run: shasum -a 256 -c SHA256SUMS
      - name: scripts/pdftex-regression.sh
        run: REGRESSION_WORK="$RUNNER_TEMP/pdftex-regression" scripts/pdftex-regression.sh

  mac-app:
    name: mac app (swift build + test)
    needs: [plan]
    # After the merge (push to main, where a failure files `main-red`) and on
    # manual runs; before it, only on a pull request or branch push that
    # touches apps/ (plan's `apple`). Not in the merge queue: at 19-24 minutes
    # it was the gate's slowest job.
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.apple == 'true'
    # Xcode 26 / Swift 6.x on the macos-26 GitHub image (plan's mac_runner;
    # never self-hosted, so a fork pull request that touches apps/ is safe).
    runs-on: ${{ fromJSON(needs.plan.outputs.mac_runner) }}
    timeout-minutes: 90
    env:
      CI: "1"
      FLASHTEX_NO_ACTIVATE: "1"
      FLASHTEX_KEYCHAIN_OFF: "1"
      FLASHTEX_REVIEW_HISTORY_DIR: "off"
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest stable Xcode
        # Only on GitHub images: a self-hosted Mac has one Xcode, chosen by
        # whoever provisioned it, and this action would rewrite its global
        # xcode-select. Keyed on this job's own runner (mac_runner, the hosted
        # macos-26 image today), not on FLASHTEX_SELFHOSTED_MAC, which moves
        # only the Rust/trip/parity legs.
        if: ${{ !contains(needs.plan.outputs.mac_runner, 'self-hosted') }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift --version && xcodebuild -version
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # One workspace holds every helper now that vendor/ is retired.
          key: helpers
      - name: Build every bundled helper (release)
        # Prints FLASHTEX_<NAME>=<path> lines; the app and its tests read them.
        # Without pipefail a failed helper build is hidden by `tee`, and the
        # missing FLASHTEX_* lines then make every integration test XCTSkip --
        # a green run that tested none of the Rust/Swift boundary.
        run: |
          set -o pipefail
          scripts/ci/build-helpers.sh | tee -a "$GITHUB_ENV"
      - name: Completion vocabulary is the compiler's inventory
        # apps/mac/Sources/FlashTeXMac/Resources/supported-latex.json must be
        # byte-identical to crates/compiler/supported/supported-latex.json.
        run: apps/mac/scripts/sync-supported-latex.sh --check
      - name: swift build
        working-directory: apps/mac
        run: swift build
      - name: swift test
        working-directory: apps/mac
        # Serial, as rehearsed locally (877 tests in ~5 min on an M1 Max):
        # the Nearby tests bind loopback ports and share fixtures.
        # `pipefail` is what makes a failing test fail the step: the default
        # shell is `bash -e`, and a pipeline's status is its LAST command's,
        # so without it `tail` returned 0 over any number of test failures.
        env:
          # swift-snapshot-testing writes the image it actually captured next
          # to a failure. It defaults to NSTemporaryDirectory(), which dies
          # with the runner -- so a snapshot mismatch in CI was reported as
          # "does not match reference" with no way to see WHAT it captured.
          # Point it somewhere the upload step below can reach.
          SNAPSHOT_ARTIFACTS: ${{ github.workspace }}/apps/mac/snapshot-artifacts
        run: |
          set -o pipefail
          mkdir -p "$SNAPSHOT_ARTIFACTS"
          swift test 2>&1 | tee swift-test.log | grep -vE '^\s*$' | tail -n 400
      - name: Upload swift test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-swift-test-log
          path: apps/mac/swift-test.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload the snapshots the run actually captured
        # Only on failure: on a green run these are not written at all.
        # Pair each file with its committed reference under
        # apps/mac/Tests/DesignSnapshots/__Snapshots__/ to see the difference.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mac-snapshot-artifacts
          path: apps/mac/snapshot-artifacts
          if-no-files-found: ignore
          retention-days: 7

  ipad:
    name: iPad companion (simulator build + tests)
    needs: [plan]
    # When the Mac app runs (plan's `apple`; see mac-app).
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.apple == 'true'
    runs-on: ${{ fromJSON(needs.plan.outputs.mac_runner) }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest stable Xcode
        if: ${{ !contains(needs.plan.outputs.mac_runner, 'self-hosted') }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Pick an iPad simulator from the runner image
        id: sim
        run: |
          set -euo pipefail
          xcrun simctl list devices available iPad -j > sims.json
          name="$(python3 - <<'PY'
          import json
          data = json.load(open("sims.json"))
          ipads = [d["name"] for devs in data["devices"].values() for d in devs
                   if d.get("isAvailable") and d["name"].startswith("iPad")]
          # Prefer the 11-inch Air (what the README uses), else any iPad.
          pick = next((n for n in ipads if "Air 11-inch" in n), ipads[0] if ipads else "")
          print(pick)
          PY
          )"
          [ -n "$name" ] || { echo "no available iPad simulator on this image"; xcrun simctl list devices available; exit 1; }
          echo "iPad simulator: $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: xcodebuild build
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild -project FlashTeXPad.xcodeproj -scheme FlashTeXPad \
            -destination 'platform=iOS Simulator,name=${{ steps.sim.outputs.name }}' \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO build | tail -n 200
      - name: xcodebuild test (unit tests only; UI tests are skipped)
        working-directory: apps/ios
        timeout-minutes: 25
        run: |
          set -o pipefail
          xcodebuild -project FlashTeXPad.xcodeproj -scheme FlashTeXPad \
            -destination 'platform=iOS Simulator,name=${{ steps.sim.outputs.name }}' \
            -skipPackagePluginValidation -skipMacroValidation \
            -only-testing:FlashTeXPadTests \
            CODE_SIGNING_ALLOWED=NO test > "$RUNNER_TEMP/ipad-test.log" 2>&1 || status=$?
          tail -n 300 "$RUNNER_TEMP/ipad-test.log"
          # The tail alone cut off the first suites' assertion messages, so a
          # failure named its test but not why. Print every failure line.
          echo "--- failure lines ---"
          grep -E "error: -\[|: error: .*XCT|Test Case .* failed" "$RUNNER_TEMP/ipad-test.log" || echo "(none)"
          exit "${status:-0}"

  # The post-merge set is fixed forward: on a push to main, a failed job --
  # any job, not only the macOS legs as before 2026-10-05 -- opens or updates
  # the issue labelled `main-red`, naming the run, the failed jobs and the
  # pull requests the push merged; a fully green run on main's tip closes it
  # (scripts/ci/main-red.sh). Policy (docs/ci-cd.md, "main-red"): the PR's
  # owner fixes forward within 2 hours, or the Commander reverts the merge.
  main-red:
    name: main-red issue
    needs: [plan, build, quick, boundary, inventory, gates, parity-fixtures, parity-fixtures-hosted, engine-parity, engine-parity-hosted, rust-workspace, rust-standalone, trip, etrip, pdftex-regression, mac-app, ipad]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: scripts/ci/main-red.sh "${{ github.run_id }}"

  # ===========================================================================
  # One check to require in branch protection and in the merge queue.
  #
  # Requiring the individual job names would mean editing branch protection
  # every time a job is added, renamed or made conditional -- and a required
  # check that never runs blocks the queue forever. This job runs on every
  # event, so the name always reports, and it fails if anything it needed
  # failed or was cancelled. A `skipped` need is fine: that is how a tier says
  # "not for this event".
  # ===========================================================================
  ci-required:
    name: CI required
    if: always()
    needs:
      - plan
      - build
      - quick
      - boundary
      - inventory
      - gates
      - parity-fixtures
      - parity-fixtures-hosted
      - engine-parity
      - engine-parity-hosted
      - rust-workspace
      - rust-standalone
      # The engine's own tests (DESIGN.md section 8): skipped only when plan
      # says the run is a duplicate (run == 'false'); their macOS legs run
      # post-merge only (plan's `trip_os`).
      - trip
      - etrip
      - pdftex-regression
      - mac-app
      - ipad
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job that ran, passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          if needs["plan"].get("outputs", {}).get("run") == "false":
              print("duplicate run: this branch's pull_request run carries the checks")
          bad = {k: v["result"] for k, v in needs.items()
                 if v["result"] not in ("success", "skipped")}
          plan_out = needs["plan"].get("outputs", {})
          # The new engine's parity is required in the gate whenever plan says
          # the group touches it (`engine`): one of its two jobs -- every
          # shard of it -- must have run and passed, not merely been skipped.
          # A filter must not be able to skip parity by accident, so plan's
          # outputs going missing counts as "required" too.
          if (os.environ["EVENT"] == "merge_group" and plan_out.get("engine") != "false"
                  and "success" not in (needs["engine-parity"]["result"],
                                        needs["engine-parity-hosted"]["result"])):
              bad["engine-parity (either runner, every shard)"] = "did not run"
          # The old engine's parity fixtures: when plan says this run needs
          # them (old_engine), one of their two jobs must have run and passed.
          # Both skipped is a pass only when plan said they were not needed.
          if (plan_out.get("run") != "false" and plan_out.get("old_engine") == "true"
                  and "success" not in (needs["parity-fixtures"]["result"],
                                        needs["parity-fixtures-hosted"]["result"])):
              bad["parity-fixtures (either runner)"] = "did not run"
          rows = "\n".join("| `%s` | %s |" % (k, v["result"]) for k, v in sorted(needs.items()))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("### CI required\n\n| job | result |\n|---|---|\n%s\n" % rows)
          if bad:
              print("these jobs did not pass:")
              for k, v in sorted(bad.items()):
                  print("  %s: %s" % (k, v))
              sys.exit(1)
          print("all jobs that ran, passed")
          PY
