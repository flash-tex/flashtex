# FlashTeX CI, tiered (docs/design/engine-v2/DESIGN.md §9, owner-approved
# 2026-09-29). See docs/ci-cd.md.
#
# WHY TIERS. On 2026-09-27 a run on main took 225-275 minutes, almost all of it
# macOS jobs queueing: every pull request ran the whole matrix -- the Rust
# workspace on Linux AND macOS, the two standalone crates on both, the Mac app
# (90 min timeout) and the iPad simulator (60 min) -- behind ~90 branches all
# competing for GitHub-hosted macOS runners.
#
# So the gate a branch must pass is now proportional to what it changed:
#
#   fast (required, target <= 10 min)  pull_request, and push to any branch
#     build, the crates the branch touches (fmt/clippy/tests), the licence
#     boundary, the old engine's parity fixtures tier, the bundled inventory
#     and the generated-table gates. NO full matrix, no Mac app, no simulator.
#     Plus the NEW engine's parity gates (lockstep, P-T1/P-T2 on the fixtures)
#     when the branch touches the engine or its harnesses (see `engine` below).
#
#   full                               merge_group, manual (push to main runs the
#                                      fast set: the queue already ran full on it)
#     everything above plus the Rust matrix on both OSes, both standalone
#     crates, the Mac app and the iPad companion. The new engine's parity
#     gates ALWAYS run here, and on every push to main.
#
# Nightly and weekly suites live in nightly.yml.
#
# scripts/gate.sh runs exactly these steps locally: `scripts/gate.sh pr` before
# pushing means this workflow only confirms a result you already have.
name: CI

on:
  push:
    # Every in-repo branch, not just main: an agent gets the fast set from a
    # push, without needing a pull request, and self-hosted runners only ever
    # see in-repo code (§9.3). Not the merge queue's own gh-readonly-queue/*
    # branches: their merge_group run already tests that exact tree, and the
    # extra push run only queued a second copy of the macOS jobs.
    branches-ignore: ['gh-readonly-queue/**']
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      engine_parity_hosted:
        description: also run the GitHub-hosted engine parity job (it is otherwise the fallback)
        type: boolean
        default: false

concurrency:
  # On main and in the merge queue, every run gets a group of its own
  # (`-<run_id>`), so a push can never supersede the run that is testing the
  # previous commit. Everywhere else the key is the ref, so a branch's runs
  # still collapse onto its newest push.
  #
  # `cancel-in-progress` is NOT what was cancelling main: it already
  # evaluates to false for a push. The cancellations came from the group key
  # itself -- a shared key holds at most one in-progress and one pending run,
  # and every new push cancelled the pending one. With a mac job that queues
  # for hours behind a merge cadence measured in minutes, that meant main's
  # runs were cancelled before they could report. 37 of the last 40 runs on
  # main ended `cancelled`; exactly one completed.
  group: ci-${{ github.workflow }}-${{ github.ref }}${{ (github.ref == 'refs/heads/main' || github.event_name == 'merge_group') && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Which tier, whether this run is a duplicate, and which Mac runners to use.
  # One cheap job so the answer is computed once and visible in the summary,
  # instead of the same three expressions copied onto a dozen `if:` lines.
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # 'true' when this run must do the full matrix.
      full: ${{ steps.p.outputs.full }}
      # 'false' when this run is a duplicate of one already covering this SHA.
      run: ${{ steps.p.outputs.run }}
      # 'true' when the repository has self-hosted Macs registered AND this run
      # is allowed to use them. See the FLASHTEX_SELFHOSTED_MAC note below.
      selfhosted: ${{ steps.p.outputs.selfhosted }}
      # A JSON array for `runs-on` on the Xcode jobs of the full tier.
      mac_runner: ${{ steps.p.outputs.mac_runner }}
      # The same choice for the Rust/trip jobs' macOS matrix leg (hosted: macos-15).
      mac_rust_runner: ${{ steps.p.outputs.mac_rust_runner }}
      # The Linux legs of the same matrices: the owner's NixOS PC when self-hosted is allowed.
      linux_runner: ${{ steps.p.outputs.linux_runner }}
      # 'true' when this run must run the new engine's parity gates.
      engine: ${{ steps.p.outputs.engine }}
    steps:
      - name: Decide
        id: p
        env:
          GH_TOKEN: ${{ github.token }}
          # A repository variable, NOT a secret, and not something a workflow
          # can discover for itself: GITHUB_TOKEN has no `administration` scope,
          # so no job can list the repository's runners. The Commander sets
          #   gh variable set FLASHTEX_SELFHOSTED_MAC --body 1
          # after installing a runner (scripts/ci/install-selfhosted-runner.sh)
          # and back to 0 to send everything to GitHub-hosted runners again.
          # Until it is 1, every Mac job uses a GitHub-hosted runner, so the
          # fallback is the default rather than an emergency path.
          SELFHOSTED_VAR: ${{ vars.FLASHTEX_SELFHOSTED_MAC }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          full=false
          case "$EVENT" in
            merge_group|workflow_dispatch) full=true ;;
          esac
          # push to main is NOT full: every change reaches main through the
          # merge queue, whose merge_group run already ran the full tier on
          # that exact tree. Repeating it doubled the macOS queue (2026-09-29).

          # A fork pull request may never reach a self-hosted runner (§9.3).
          # The full tier cannot be reached from `pull_request` at all, which is
          # why its Mac jobs can take their runner from here.
          selfhosted=false
          # Self-hosted Macs run the owner's working account, so they take only
          # code the Commander has queued or pushed to main: merge_group, push
          # to main and manual runs. Never pull_request or branch pushes.
          if [ "${SELFHOSTED_VAR:-0}" = "1" ]; then
            case "$EVENT" in
              merge_group|workflow_dispatch) selfhosted=true ;;
              push) [ "$REF" = "refs/heads/main" ] && selfhosted=true ;;
            esac
          fi

          # Deduplication. An in-repo branch with an open pull request gets two
          # events for the same commit (`push` and `pull_request`). The
          # pull_request run is the one that carries the required checks, so the
          # push run stands down. A branch with no pull request still gets the
          # full fast set from its push.
          run=true
          if [ "$EVENT" = "push" ] && [ "$REF" != "refs/heads/main" ]; then
            branch="${REF#refs/heads/}"
            # The `head` filter is OWNER:branch, not owner/repo:branch. With the
            # repository name in there it silently matches nothing, and the
            # deduplication never fires -- every in-repo pull request would run
            # the whole fast set twice. Verified against a branch that has an
            # open pull request (1) and one that does not (0).
            open=$(gh api "repos/$THIS_REPO/pulls?state=open&head=$OWNER:$branch&per_page=1" \
                     --jq 'length' 2>/dev/null || echo 0)
            if [ "${open:-0}" != "0" ]; then
              run=false
            fi
          fi

          # The new engine's parity gates (DESIGN §8 T1, §1.1 P-T1/P-T2). Always
          # in the merge queue, on main and on a manual run. On a pull request
          # (or a branch push without one) only when the change touches the
          # engine, its translator, its harnesses, the pinned sources or the
          # fixtures -- or this gate's own definition.
          engine=false
          case "$EVENT" in
            merge_group|workflow_dispatch) engine=true ;;
            push) [ "$REF" = "refs/heads/main" ] && engine=true ;;
          esac
          if [ "$engine" != "true" ] && [ "$run" = "true" ]; then
            if [ "$EVENT" = "pull_request" ]; then
              files=$(gh api --paginate "repos/$THIS_REPO/pulls/$PR_NUMBER/files?per_page=100" \
                        --jq '.[].filename') || files=UNKNOWN
            else
              # The compare API lists at most 300 files; at the cap, assume
              # the engine is touched rather than miss it.
              files=$(gh api "repos/$THIS_REPO/compare/main...$SHA" \
                        --jq 'if (.files | length) >= 300 then "UNKNOWN" else .files[].filename end') \
                || files=UNKNOWN
            fi
            if [ "$files" = "UNKNOWN" ] || printf '%s\n' "$files" | grep -qE \
                 '^(crates/flashtex-engine/|tools/web2rust/|tools/lockstep/|tools/parity/|third_party/|fixtures/|scripts/engine-parity\.sh$|\.github/actions/texlive-2026/|\.github/workflows/ci\.yml$)'; then
              engine=true
            fi
          fi

          # The Xcode jobs (mac app, iPad simulator) always use the hosted
          # macos-26 image: their snapshot baselines and simulator device names
          # are tied to that image's Xcode, and a self-hosted Mac on another
          # Xcode fails them (DesignSnapshots; exit 70 on a missing simulator).
          # Only the Rust/trip/etrip/parity legs move to self-hosted Macs.
          # macos-26 is the Xcode 26 image the Mac app and the simulator need.
          mac_runner='["macos-26"]'
          if [ "$selfhosted" = "true" ]; then
            mac_rust_runner='["self-hosted","macOS","ARM64","flashtex"]'
            linux_runner='["self-hosted","Linux","X64","flashtex-linux"]'
          else
            mac_rust_runner='["macos-15"]'
            linux_runner='["ubuntu-latest"]'
          fi

          {
            echo "full=$full"
            echo "run=$run"
            echo "selfhosted=$selfhosted"
            echo "mac_runner=$mac_runner"
            echo "mac_rust_runner=$mac_rust_runner"
            echo "linux_runner=$linux_runner"
            echo "engine=$engine"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### CI plan"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| event | \`$EVENT\` |"
            echo "| ref | \`$REF\` |"
            echo "| tier | $([ "$full" = true ] && echo '**full**' || echo 'fast (required set only)') |"
            echo "| runs | $run |"
            echo "| self-hosted Macs | $selfhosted |"
            echo "| Mac runner | \`$mac_runner\` |"
            echo "| new engine parity | $engine |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$run" != "true" ]; then
            echo "This branch has an open pull request; its pull_request run carries the checks." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

  # ===========================================================================
  # The fast, required set. Runs on every event. Target: <= 10 minutes.
  # ===========================================================================

  # §9.2 "build": the whole root workspace must compile, all targets, before
  # anything else is believed. Debug, not release: the release profile is two to
  # three times slower and the merge queue already covers it.
  build:
    name: build (workspace, all targets)
    needs: [plan]
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: workspace-debug
      - run: cargo build --workspace --all-targets --locked

  # fmt, clippy and tests, scoped to the crates this branch touches. The steps
  # ARE scripts/gate.sh quick -- the same script an agent runs before pushing,
  # so the two cannot drift.
  quick:
    name: quick (touched crates)
    needs: [plan]
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # gate.sh scopes itself with `git diff <base>...HEAD`, which needs the
          # merge base. A shallow clone has no merge base.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: workspace-debug
      - name: Resolve the base revision
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # On a pull request the base is the PR's base commit. On a push or in
          # the merge queue it is main -- which for a push to main itself is
          # HEAD~1, so the diff is that push's own commits.
          if [ -n "${BASE_SHA:-}" ]; then
            base="$BASE_SHA"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            base="$(git rev-parse HEAD~1)"
          else
            git fetch --no-tags origin main
            base="$(git rev-parse origin/main)"
          fi
          echo "FLASHTEX_GATE_BASE=$base" >> "$GITHUB_ENV"
          echo "base revision: $base"
      - name: scripts/gate.sh quick
        run: scripts/gate.sh quick --committed-only

  # DESIGN §3 / §9.6. Cheap, and the whole licensing argument depends on it.
  boundary:
    name: licence boundary
    needs: [plan]
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: No MIT crate or iPad target may reach the GPL engine
        run: scripts/check-license-boundary.sh

  # The Mac app's bundled command inventory must stay byte-identical to the
  # compiler's. That gate lived only in `mac-app` below, on a macOS runner --
  # and macOS runners queue for hours behind ~90 branches, so in practice a
  # compiler PR could drift the inventory and nothing would say so until
  # someone ran the Mac suite by hand. It is a sha256 comparison of two files;
  # it does not need a Mac.
  inventory:
    name: bundled inventory matches the compiler
    needs: [plan]
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Completion vocabulary is the compiler's inventory
        run: apps/mac/scripts/sync-supported-latex.sh --check

  # Cheap source-level gates that need no build and no TeX: no generated table
  # or generator changed without the other (scripts/check-generated.py). The
  # Core 14 AFM tables are the one generator whose inputs CI can fetch, so they
  # are fully re-derived. There is no pin gate any more: every crate depends on
  # its live siblings (engine-v2 DESIGN.md §9.4).
  gates:
    name: generated tables
    needs: [plan]
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generated tables match the manifest
        run: python3 scripts/check-generated.py
      - uses: actions/setup-python@v5
        with:
          # crates/font-engine/src/generated.rs records Python unicodedata
          # 15.0.0, which is Python 3.12's. Another version is "cannot check".
          python-version: "3.12"
      - name: Core 14 AFM tables re-derive byte-identically (gen_tables.py --check)
        # Inputs are never committed (crates/font-engine/README.md,
        # "Reproducibility"): matplotlib ships Adobe's AFMs unmodified and
        # TeX Live ships glyphlist.txt (fetch-glyphlist.sh: Adobe's pinned
        # commit first, CTAN mirrors as fallback, digest-checked; #1101).
        # gen_tables.py --check refuses (exit 2) unless every input's SHA-256
        # matches the committed header, and --strict makes that refusal fail
        # the job.
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/core14"; mkdir -p "$work"
          python -m pip download --quiet --no-deps --only-binary=:all: matplotlib==3.9.2 -d "$work"
          python -m zipfile -e "$work"/matplotlib-*.whl "$work/mpl"
          export FLASHTEX_CORE14_AFM_DIR="$work/mpl/matplotlib/mpl-data/fonts/pdfcorefonts"
          FLASHTEX_GLYPHLIST="$(scripts/ci/fetch-glyphlist.sh "$work/glyphlist")"
          export FLASHTEX_GLYPHLIST
          python scripts/check-generated.py --run --strict --only "font-engine core14"

  # THE OLD ENGINE's parity fixtures tier (the frozen flashtex-cli path, D13).
  # It stays until P5 retires that path; the new engine's gates are
  # `engine-parity` below. It needs a Mac: baseline-fixtures.json was recorded on
  # macOS, because unicode-accents paints CJK from system fonts
  # (tools/parity/README.md). Two jobs, one body (.github/actions/parity-fixtures):
  #
  #   parity-fixtures            self-hosted Apple Silicon, in-repo code only
  #   parity-fixtures-hosted     GitHub-hosted, and the fallback for everything
  #
  # Exactly one of the two runs. They carry different check names on purpose --
  # branch protection requires only "CI required" below, and two check runs with
  # one name on the same commit would be ambiguous.
  parity-fixtures:
    name: "old engine: parity fixtures (self-hosted macOS)"
    needs: [plan]
    # DESIGN §9.3: a job on `runs-on: [self-hosted, ...]` must never run for a
    # pull_request from a fork. A fork PR runs arbitrary code, and a self-hosted
    # runner is a machine on the team's network with the team's caches on it.
    if: >-
      needs.plan.outputs.run == 'true' && needs.plan.outputs.selfhosted == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64, flashtex]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/parity-fixtures
        with:
          jobs: "6"

  parity-fixtures-hosted:
    name: "old engine: parity fixtures (GitHub-hosted macOS)"
    needs: [plan]
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.selfhosted != 'true'
    # macos-14 and later GitHub runners are Apple Silicon (arm64).
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/parity-fixtures
        with:
          jobs: "3"

  # THE NEW ENGINE's parity gates (DESIGN §8 T1, §1.1 P-T1/P-T2): build
  # flashtex-initex (release) and its formats, run lockstep on every case and
  # the parity fixtures tier at P-T1 and P-T2 against TeX Live 2026's pdfTeX
  # 1.40.29, and the engine's tests with FLASHTEX_REQUIRE_TEXLIVE=1 (a test
  # that would skip for want of TeX Live fails). The body is
  # scripts/engine-parity.sh, which runs the same steps on any machine with
  # TeX Live. Before this job, CI never checked the new engine's parity.
  #
  #   engine-parity         the NixOS PC (TeX Live 2026 first on its runners'
  #                         PATH): merge queue, main and manual runs (§9.3)
  #   engine-parity-hosted  GitHub-hosted Ubuntu with a digest-pinned TeX Live
  #                         2026: pull requests that touch the engine, and the
  #                         fallback when self-hosted runners are switched off
  #
  # Exactly one of the two runs (the manual input can add the hosted one), and
  # `CI required` fails a merge_group run in which neither passed.
  engine-parity:
    name: engine parity (NixOS)
    needs: [plan]
    if: >-
      needs.plan.outputs.run == 'true' && needs.plan.outputs.engine == 'true' &&
      needs.plan.outputs.selfhosted == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, flashtex-linux]
    timeout-minutes: 30
    env:
      FLASHTEX_REQUIRE_TEXLIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: this runner's build directory and oracle cache
        # A per-runner target directory outside the checkout, so a run
        # rebuilds only what changed (the checkout is cleaned every job). The
        # oracle's P-T references are cached by parity.py under a key of the
        # source tree and the pdfTeX version; the directory adds the TeX Live
        # tree itself (its tlpdb), so a `tlmgr update` starts a fresh cache.
        run: |
          set -euo pipefail
          base="$HOME/.cache/flashtex-ci"
          tl="$(cd "$(dirname "$(command -v pdftex)")/../.." && pwd)"
          key="$(sha256sum "$tl/tlpkg/texlive.tlpdb" | cut -c1-16)"
          echo "CARGO_TARGET_DIR=$base/$RUNNER_NAME/target-engine-parity" >> "$GITHUB_ENV"
          echo "FLASHTEX_PARITY_CACHE=$base/parity-oracle-$key" >> "$GITHUB_ENV"
          echo "TeX Live: $tl (tlpdb $key)"
      - name: scripts/engine-parity.sh
        run: scripts/engine-parity.sh --jobs 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-parity-nixos
          path: |
            ${{ runner.temp }}/engine-parity/lockstep.txt
            ${{ runner.temp }}/engine-parity/parity/report.md
            ${{ runner.temp }}/engine-parity/parity/documents.json
          if-no-files-found: ignore
          retention-days: 14

  engine-parity-hosted:
    name: engine parity (GitHub-hosted)
    needs: [plan]
    if: >-
      needs.plan.outputs.run == 'true' && needs.plan.outputs.engine == 'true' &&
      (needs.plan.outputs.selfhosted != 'true' || inputs.engine_parity_hosted)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FLASHTEX_REQUIRE_TEXLIVE: "1"
      # texlive/texlive:latest-medium as of 2026-09-27 (TeX Live 2026, pdfTeX
      # 1.40.29). Pinned by digest; see .github/actions/texlive-2026.
      TEXLIVE_IMAGE: texlive/texlive@sha256:961215b30a17099ee677cedbb9163fe755ebca1d7e8b0b9fa73248a2f53bd198
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/texlive-2026
        with:
          image: ${{ env.TEXLIVE_IMAGE }}
          # What the fixtures read (pdflatex -recorder on every fixture,
          # mapped through texlive.tlpdb) that scheme-medium lacks: beamer
          # loads both. TeX Live 2026 revision 77682 of each.
          extra: |
            sansmathaccent 62cf97334eb2c1d4056cb7f72ef2e59d99edaef151c3f4870116cc23056394b9
            translations a7766687fd777e7077a68d6d908cb43da0673616e58ebc31741b22108d4af591
      - name: qpdf (P-T2 normalises with it)
        run: command -v qpdf || { sudo apt-get update -qq && sudo apt-get install -y -qq qpdf; }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: engine-parity
      - name: the oracle's P-T references, cached per TeX Live image
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/parity-oracle
          key: parity-oracle-${{ env.TEXLIVE_IMAGE }}-${{ hashFiles('fixtures/**', 'tools/parity/capture.py', 'tools/parity/tiers.py') }}
          restore-keys: parity-oracle-${{ env.TEXLIVE_IMAGE }}-
      - name: scripts/engine-parity.sh
        env:
          FLASHTEX_PARITY_CACHE: ${{ runner.temp }}/parity-oracle
        run: scripts/engine-parity.sh --jobs 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-parity-hosted
          path: |
            ${{ runner.temp }}/engine-parity/lockstep.txt
            ${{ runner.temp }}/engine-parity/parity/report.md
            ${{ runner.temp }}/engine-parity/parity/documents.json
          if-no-files-found: ignore
          retention-days: 14

  # ===========================================================================
  # The full tier: merge_group, push to main, workflow_dispatch.
  #
  # None of these jobs can be reached from a `pull_request` event -- `full` is
  # false for it in `plan` -- which is why the Mac ones can take their runner
  # from plan.outputs.mac_runner without repeating the fork guard.
  # ===========================================================================

  # Every crate of the root Cargo workspace (Cargo.toml), built and tested
  # together: one resolve, one target directory, one cache. This replaced a
  # 12-crate matrix that never ran the other 26 crates.
  rust-workspace:
    name: rust workspace (${{ matrix.os }})
    needs: [plan]
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.full == 'true'
    # The Linux leg stays on GitHub-hosted Ubuntu: on the NixOS runner the
    # engine's INITEX tests assume an FHS layout (tests/initex.rs). The other
    # Linux legs (render-pipeline, flashtex-cli, trip, etrip) pass there.
    runs-on: ${{ matrix.os == 'macos-15' && fromJSON(needs.plan.outputs.mac_rust_runner) || matrix.os }}
    timeout-minutes: 60
    env:
      # The pinned Latin Modern faces and rooted TFM metrics vendored for the
      # app bundle, so the render-pipeline/pdf tests that need them run
      # instead of skipping (no TeX installation on the runners).
      FLASHTEX_FONT_DIRS: ${{ github.workspace }}/apps/mac/Fonts
      # Latin Modern, EC (T1 without lmodern) and AMS symbol metrics — the same three trees the app bundles.
      FLASHTEX_TFM_DIRS: ${{ github.workspace }}/apps/mac/Fonts/texmf/fonts/tfm/public/lm:${{ github.workspace }}/apps/mac/Fonts/texmf/fonts/tfm/jknappen/ec:${{ github.workspace }}/apps/mac/Fonts/texmf/fonts/tfm/public/amsfonts/symbols
      FLASHTEX_LM_DIR: ${{ github.workspace }}/apps/mac/Fonts
    strategy:
      fail-fast: false
      matrix:
        # macos-14 and later GitHub runners are Apple Silicon (arm64).
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: workspace
      # TEMPORARY TEST EXCLUSIONS live in scripts/rust-test-exclude.txt, which
      # scripts/gate.sh reads too, so the local gate and CI cannot disagree
      # about which crates are gating. Every crate there still has to BUILD
      # (all targets, below); only its tests are skipped, each with an open
      # issue, and the list may only shrink.
      - name: Read the test-exclusion list
        run: |
          set -euo pipefail
          list="$(sed -e 's/#.*//' scripts/rust-test-exclude.txt | tr '[:space:]' ' ' | tr -s ' ')"
          echo "RUST_TEST_EXCLUDE=$list" >> "$GITHUB_ENV"
          echo "excluded: ${list:-none}"
      - name: cargo build --workspace --all-targets --release
        run: cargo build --workspace --all-targets --release --locked
      - name: cargo test --workspace --release
        # --no-fail-fast: without it cargo aborts at the first failing test
        # binary, so the rest of the workspace's targets never execute and the
        # job reports only the first casualty. render-pipeline was once
        # reporting "92 passed" while a local --no-fail-fast run at the same
        # commit executed 177.
        run: |
          set -euo pipefail
          excludes=()
          for p in $RUST_TEST_EXCLUDE; do excludes+=(--exclude "$p"); done
          {
            echo "### cargo test --workspace (${{ matrix.os }})"
            echo "Temporarily excluded (built, not gated): \`${RUST_TEST_EXCLUDE:-none}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          cargo test --workspace --release --locked --no-fail-fast ${excludes[@]+"${excludes[@]}"}
      - name: excluded crates (not gating; warns once they pass)
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          for p in $RUST_TEST_EXCLUDE; do
            if cargo test --release --locked --no-fail-fast -p "$p"; then
              echo "::warning::$p passes now; remove it from scripts/rust-test-exclude.txt and close its issue"
              echo "- \`$p\`: **passes**; remove it from the exclusion list" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- \`$p\`: still failing (expected while its issue is open)" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

  # render-pipeline and flashtex-cli built and tested on their own. They are
  # ordinary workspace members since vendor/ was retired, so `rust-workspace`
  # already covers them; this job stays because the parity scoreboard below
  # needs a CLI of its own, and because a per-crate failure is easier to read
  # than one inside the 38-crate run. perf-bench is tested by perf.yml on
  # every pull request that touches crates/.
  rust-standalone:
    name: rust ${{ matrix.crate }} (${{ matrix.os }})
    needs: [plan]
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.full == 'true'
    runs-on: ${{ matrix.os == 'macos-15' && fromJSON(needs.plan.outputs.mac_rust_runner) || fromJSON(needs.plan.outputs.linux_runner) }}
    timeout-minutes: 40
    env:
      FLASHTEX_FONT_DIRS: ${{ github.workspace }}/apps/mac/Fonts
      FLASHTEX_TFM_DIRS: ${{ github.workspace }}/apps/mac/Fonts/texmf/fonts/tfm/public/lm:${{ github.workspace }}/apps/mac/Fonts/texmf/fonts/tfm/jknappen/ec:${{ github.workspace }}/apps/mac/Fonts/texmf/fonts/tfm/public/amsfonts/symbols
      FLASHTEX_LM_DIR: ${{ github.workspace }}/apps/mac/Fonts
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        crate:
          - render-pipeline
          - flashtex-cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # The root workspace: these crates have no lockfile or target/ of
          # their own any more.
          key: ${{ matrix.crate }}
      - name: cargo build --release
        working-directory: crates/${{ matrix.crate }}
        run: cargo build --release --locked
      - name: cargo test --release
        working-directory: crates/${{ matrix.crate }}
        run: cargo test --release --locked --no-fail-fast

  # Knuth's trip test for the tex.web translation in crates/flashtex-engine
  # (DESIGN.md §12, P1 exit gate). Self-contained: the fixtures, including
  # trip.tfm, are committed under third_party/knuth/trip/, so no TeX is
  # installed. The script generates the trip configuration into a scratch
  # package, never into the committed src/generated/, and fails unless
  # tripin.log, trip.log and tripos.tex are byte-identical to Knuth's masters
  # and the terminal transcripts differ only in the two accepted ways.
  trip:
    name: trip test (${{ matrix.os }})
    needs: plan
    # Linux on every run; macOS only in the full tier (merge queue), and never
    # on a push that duplicates a pull request's run.
    if: needs.plan.outputs.run == 'true'
    runs-on: ${{ matrix.os == 'macos-15' && fromJSON(needs.plan.outputs.mac_rust_runner) || fromJSON(needs.plan.outputs.linux_runner) }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.full == 'true' && '["ubuntu-latest","macos-15"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: trip
      - name: third_party/knuth checksums
        working-directory: third_party/knuth
        run: shasum -a 256 -c SHA256SUMS
      - name: scripts/flashtex-trip.sh
        run: TRIP_WORK="$RUNNER_TEMP/trip" scripts/flashtex-trip.sh

  # e-TeX's trip test (etrip) for the pdftex.web translation in
  # crates/flashtex-engine (DESIGN.md sections 8 and 12, P2). Self-contained:
  # the fixtures, etrip.tfm and TeX Live's own pdftex output for them are
  # committed under third_party/pdftex/, so no TeX is installed. The script
  # generates the etrip configuration into a scratch package, never into the
  # committed src/generated/, and fails unless every log, transcript, \write
  # file and DVI file matches pdfTeX's after the normalisations it lists.
  etrip:
    name: etrip test (${{ matrix.os }})
    needs: plan
    # Linux on every run; macOS only in the full tier (merge queue), and never
    # on a push that duplicates a pull request's run.
    if: needs.plan.outputs.run == 'true'
    runs-on: ${{ matrix.os == 'macos-15' && fromJSON(needs.plan.outputs.mac_rust_runner) || fromJSON(needs.plan.outputs.linux_runner) }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.full == 'true' && '["ubuntu-latest","macos-15"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: etrip
      - name: third_party/pdftex checksums
        working-directory: third_party/pdftex
        run: shasum -a 256 -c SHA256SUMS
      - name: scripts/flashtex-etrip.sh
        run: ETRIP_WORK="$RUNNER_TEMP/etrip" scripts/flashtex-etrip.sh

  # pdfTeX's own regression tests (DESIGN.md section 8, tier T0) for the
  # pdftex.web translation in crates/flashtex-engine: TeX Live 2026's
  # `pdftex_tests`, unmodified, with the files they read, pinned under
  # third_party/pdftex/regression/, so no TeX is installed. The script runs
  # each test as TeX Live's `make check` does and fails on any failure except
  # the expected ones it lists with their owning lane.
  pdftex-regression:
    name: pdfTeX regression tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: pdftex-regression
      - name: third_party/pdftex/regression checksums
        working-directory: third_party/pdftex/regression
        run: shasum -a 256 -c SHA256SUMS
      - name: scripts/pdftex-regression.sh
        run: REGRESSION_WORK="$RUNNER_TEMP/pdftex-regression" scripts/pdftex-regression.sh

  mac-app:
    name: mac app (swift build + test)
    needs: [plan]
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.full == 'true'
    # Xcode 26 / Swift 6.x. Either the team's self-hosted Apple Silicon Macs or
    # the macos-26 GitHub image, decided once in `plan`. This job is the reason
    # self-hosted runners exist: its 90-minute timeout was spent queueing.
    runs-on: ${{ fromJSON(needs.plan.outputs.mac_runner) }}
    timeout-minutes: 90
    env:
      CI: "1"
      FLASHTEX_NO_ACTIVATE: "1"
      FLASHTEX_KEYCHAIN_OFF: "1"
      FLASHTEX_REVIEW_HISTORY_DIR: "off"
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest stable Xcode
        # Only on GitHub images: a self-hosted Mac has one Xcode, chosen by
        # whoever provisioned it, and this action would rewrite its global
        # xcode-select.
        if: needs.plan.outputs.selfhosted != 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift --version && xcodebuild -version
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # One workspace holds every helper now that vendor/ is retired.
          key: helpers
      - name: Build every bundled helper (release)
        # Prints FLASHTEX_<NAME>=<path> lines; the app and its tests read them.
        # Without pipefail a failed helper build is hidden by `tee`, and the
        # missing FLASHTEX_* lines then make every integration test XCTSkip --
        # a green run that tested none of the Rust/Swift boundary.
        run: |
          set -o pipefail
          scripts/ci/build-helpers.sh | tee -a "$GITHUB_ENV"
      - name: Completion vocabulary is the compiler's inventory
        # apps/mac/Sources/FlashTeXMac/Resources/supported-latex.json must be
        # byte-identical to crates/compiler/supported/supported-latex.json.
        run: apps/mac/scripts/sync-supported-latex.sh --check
      - name: swift build
        working-directory: apps/mac
        run: swift build
      - name: swift test
        working-directory: apps/mac
        # Serial, as rehearsed locally (877 tests in ~5 min on an M1 Max):
        # the Nearby tests bind loopback ports and share fixtures.
        # `pipefail` is what makes a failing test fail the step: the default
        # shell is `bash -e`, and a pipeline's status is its LAST command's,
        # so without it `tail` returned 0 over any number of test failures.
        env:
          # swift-snapshot-testing writes the image it actually captured next
          # to a failure. It defaults to NSTemporaryDirectory(), which dies
          # with the runner -- so a snapshot mismatch in CI was reported as
          # "does not match reference" with no way to see WHAT it captured.
          # Point it somewhere the upload step below can reach.
          SNAPSHOT_ARTIFACTS: ${{ github.workspace }}/apps/mac/snapshot-artifacts
        run: |
          set -o pipefail
          mkdir -p "$SNAPSHOT_ARTIFACTS"
          swift test 2>&1 | tee swift-test.log | grep -vE '^\s*$' | tail -n 400
      - name: Upload swift test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-swift-test-log
          path: apps/mac/swift-test.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload the snapshots the run actually captured
        # Only on failure: on a green run these are not written at all.
        # Pair each file with its committed reference under
        # apps/mac/Tests/DesignSnapshots/__Snapshots__/ to see the difference.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mac-snapshot-artifacts
          path: apps/mac/snapshot-artifacts
          if-no-files-found: ignore
          retention-days: 7

  ipad:
    name: iPad companion (simulator build + tests)
    needs: [plan]
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.full == 'true'
    runs-on: ${{ fromJSON(needs.plan.outputs.mac_runner) }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest stable Xcode
        if: needs.plan.outputs.selfhosted != 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Pick an iPad simulator from the runner image
        id: sim
        run: |
          set -euo pipefail
          xcrun simctl list devices available iPad -j > sims.json
          name="$(python3 - <<'PY'
          import json
          data = json.load(open("sims.json"))
          ipads = [d["name"] for devs in data["devices"].values() for d in devs
                   if d.get("isAvailable") and d["name"].startswith("iPad")]
          # Prefer the 11-inch Air (what the README uses), else any iPad.
          pick = next((n for n in ipads if "Air 11-inch" in n), ipads[0] if ipads else "")
          print(pick)
          PY
          )"
          [ -n "$name" ] || { echo "no available iPad simulator on this image"; xcrun simctl list devices available; exit 1; }
          echo "iPad simulator: $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: xcodebuild build
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild -project FlashTeXPad.xcodeproj -scheme FlashTeXPad \
            -destination 'platform=iOS Simulator,name=${{ steps.sim.outputs.name }}' \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO build | tail -n 200
      - name: xcodebuild test (unit tests only; UI tests are skipped)
        working-directory: apps/ios
        timeout-minutes: 25
        run: |
          set -o pipefail
          xcodebuild -project FlashTeXPad.xcodeproj -scheme FlashTeXPad \
            -destination 'platform=iOS Simulator,name=${{ steps.sim.outputs.name }}' \
            -skipPackagePluginValidation -skipMacroValidation \
            -only-testing:FlashTeXPadTests \
            CODE_SIGNING_ALLOWED=NO test > "$RUNNER_TEMP/ipad-test.log" 2>&1 || status=$?
          tail -n 300 "$RUNNER_TEMP/ipad-test.log"
          # The tail alone cut off the first suites' assertion messages, so a
          # failure named its test but not why. Print every failure line.
          echo "--- failure lines ---"
          grep -E "error: -\[|: error: .*XCT|Test Case .* failed" "$RUNNER_TEMP/ipad-test.log" || echo "(none)"
          exit "${status:-0}"

  # ===========================================================================
  # One check to require in branch protection and in the merge queue.
  #
  # Requiring the individual job names would mean editing branch protection
  # every time a job is added, renamed or made conditional -- and a required
  # check that never runs blocks the queue forever. This job runs on every
  # event, so the name always reports, and it fails if anything it needed
  # failed or was cancelled. A `skipped` need is fine: that is how a tier says
  # "not for this event".
  # ===========================================================================
  ci-required:
    name: CI required
    if: always()
    needs:
      - plan
      - build
      - quick
      - boundary
      - inventory
      - gates
      - parity-fixtures
      - parity-fixtures-hosted
      - engine-parity
      - engine-parity-hosted
      - rust-workspace
      - rust-standalone
      - mac-app
      - ipad
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job that ran, passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          if needs["plan"].get("outputs", {}).get("run") == "false":
              print("duplicate run: this branch's pull_request run carries the checks")
          bad = {k: v["result"] for k, v in needs.items()
                 if v["result"] not in ("success", "skipped")}
          # The new engine's parity is required in the merge queue: one of its
          # two jobs must have run and passed, not merely been skipped.
          if os.environ["EVENT"] == "merge_group" and "success" not in (
                  needs["engine-parity"]["result"], needs["engine-parity-hosted"]["result"]):
              bad["engine-parity (either runner)"] = "did not run"
          rows = "\n".join("| `%s` | %s |" % (k, v["result"]) for k, v in sorted(needs.items()))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("### CI required\n\n| job | result |\n|---|---|\n%s\n" % rows)
          if bad:
              print("these jobs did not pass:")
              for k, v in sorted(bad.items()):
                  print("  %s: %s" % (k, v))
              sys.exit(1)
          print("all jobs that ran, passed")
          PY
