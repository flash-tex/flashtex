name: Publish website

# Re-renders the GitHub Pages site whenever a release is published, so the
# download page, DMG/CLI-tarball links, checksums, install.sh and
# install-cli.sh always point at the latest release. Also runs when the site
# source on main changes, and on demand.
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to link (leave empty for the latest release)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: publish-website
  cancel-in-progress: false

jobs:
  publish:
    # Prereleases never replace the stable download.
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - name: Check out site source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Check out gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: Render site for the release
        id: render
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          python3 source/site/render.py rendered ${TAG:+--tag "$TAG"} > values.json
          cat values.json
          sh -n rendered/install.sh
          sh -n rendered/install-cli.sh
          echo "tag=$(python3 -c 'import json; print(json.load(open("values.json"))["TAG"])')" >> "$GITHUB_OUTPUT"

      - name: Publish to gh-pages
        working-directory: pages
        env:
          TAG: ${{ steps.render.outputs.tag }}
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R ../rendered/. .
          git add -A
          if git diff --cached --quiet; then
            echo "Site already matches $TAG; nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "site: link $TAG"
          git push origin gh-pages
          echo "Published site for $TAG" >> "$GITHUB_STEP_SUMMARY"
