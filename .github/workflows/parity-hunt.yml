# A parity hunt on the owner's NixOS PC: any parity.py tier, of any ref,
# by hand (lane PARITY-HUNT, 2026-11-01; DESIGN §8 and §12).
#
# The board (p5-scoreboard.yml) and T4 (nightly.yml corpus-t4) measure fixed
# corpora on main. This job measures a corpus they don't hold yet, such as
# tools/parity/corpus/hunt-arxiv-2k.json, on the branch that is fixing what
# it finds, so a fix is measured on the same host and oracle as the board.
# It is a report, never a gate, and records no baseline.
#
# The oracle is the PC's own TeX Live 2026 (pdfTeX 1.40.29); nothing expected
# is committed. Fetched sources go to a cache of this lane's own
# (~/.cache/flashtex-agents/<lane>/), never the board's or T4's, and
# `cleanup: true` deletes it. The run takes flashtex-pc-heavy, the group of T4
# and the PC board, so it never runs beside them, and runs in a scope of its own
# inside flashtex.slice (MemoryMax 10G, nice 10). Never on a pull request.
name: parity hunt

on:
  workflow_dispatch:
    inputs:
      tiers:
        description: parity.py tiers (space separated)
        required: false
        default: 'hunt-arxiv'
      lane:
        description: the cache directory's name under ~/.cache/flashtex-agents/
        required: false
        default: 'parityhunt'
      args:
        description: more parity.py arguments, e.g. --shard 0/4 or --only ID
        required: false
        default: ''
      jobs:
        description: parity workers (-j), at most 4
        required: false
        default: '4'
      cleanup:
        description: delete the lane's cache after the run
        type: boolean
        required: false
        default: false
      host:
        description: "pc: the tiers above on the NixOS PC; hosted: the plan below on GitHub-hosted runners"
        type: choice
        options: [pc, hosted]
        required: false
        default: pc
      plan:
        description: 'hosted: a JSON list of units, each {"name": "...", "cmd": "<tools/parity/hunt/hunt.py arguments>"}'
        required: false
        default: '[]'

permissions:
  contents: read

jobs:
  hunt:
    name: parity hunt (${{ inputs.tiers }})
    if: inputs.host != 'hosted' && (vars.FLASHTEX_SELFHOSTED_LINUX || vars.FLASHTEX_SELFHOSTED_MAC) == '1'
    runs-on: [self-hosted, Linux, X64, flashtex-linux]
    timeout-minutes: 720
    concurrency:
      group: flashtex-pc-heavy
      cancel-in-progress: false
    env:
      TIERS: ${{ inputs.tiers }}
      LANE: ${{ inputs.lane }}
      ARGS: ${{ inputs.args }}
      JOBS: ${{ inputs.jobs }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: the oracle and the lane's cache
        run: |
          set -euo pipefail
          case "$LANE" in *[!a-z0-9-]*|'') echo "::error::lane must be [a-z0-9-]+"; exit 1 ;; esac
          case "$JOBS" in [1-4]) ;; *) echo "::error::jobs must be 1-4"; exit 1 ;; esac
          for t in pdflatex pdftex kpsewhich qpdf pdftoppm; do
            command -v "$t" >/dev/null || { echo "::error::no $t on this runner's PATH"; exit 1; }
          done
          pdftex --version | head -1 | grep -q '1\.40\.29' || { echo "::error::the oracle is not pdfTeX 1.40.29"; exit 1; }
          home="$HOME/.cache/flashtex-agents/$LANE"
          mkdir -p "$home/cache"
          {
            echo "HUNT_HOME=$home"
            echo "FLASHTEX_PARITY_CACHE=$home/cache"
            echo "CARGO_TARGET_DIR=$home/target"
            echo "PARITY_TEXBIN=$(dirname "$(command -v pdflatex)")"
            echo "PARITY_ORACLE=$(command -v pdftex)"
            echo "PARITY_TEXMF=$(kpsewhich -var-value TEXMFDIST)"
          } | tee -a "$GITHUB_ENV"
          awk '/^MemAvailable:/ { printf "MemAvailable %.1f GiB\n", $2 / 1048576 }' /proc/meminfo
      - name: build the engine and its formats
        run: CARGO_BUILD_JOBS=4 scripts/engine-parity.sh --work "$RUNNER_TEMP/engine-parity" build
      - name: run the tiers
        run: |
          set -euo pipefail
          # at least 8 GB left to the owner (the PC froze twice under agents' runs)
          avail="$(awk '/^MemAvailable:/ { print int($2 / 1048576) }' /proc/meminfo)"
          [ "$avail" -ge 18 ] || { echo "::error::only $avail GiB available: a 10G run would leave under 8"; exit 1; }
          scope=(systemd-run --user --scope --quiet --slice=flashtex.slice -p MemoryMax=10G -p MemoryHigh=9G -p MemorySwapMax=0 -p OOMPolicy=continue)
          "${scope[@]}" true 2>/dev/null || { echo "::error::systemd-run --user is unavailable: the hunt runs only in its own scope"; exit 1; }
          targs=()
          for t in $TIERS; do targs+=(--tier "$t"); done
          ew="$RUNNER_TEMP/engine-parity"
          # shellcheck disable=SC2086 # ARGS is a list of parity.py arguments
          "${scope[@]}" nice -n 10 python3 tools/parity/parity.py "${targs[@]}" -j "$JOBS" \
            --engine "$ew/eng/flashtex-initex" \
            --engine-env "FLASHTEX_FORMATS=$ew/fmt" --engine-env "FLASHTEX_POOL=$ew/eng/pdftex.pool" \
            --texbin "$PARITY_TEXBIN" --oracle-pdftex "$PARITY_ORACLE" --texmf "$PARITY_TEXMF" \
            --pt1-max-log-mb 64 --pt1-timeout 900 \
            --out "$RUNNER_TEMP/hunt" --work "$RUNNER_TEMP/hunt-work" $ARGS
      - name: report
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/hunt/report.md" ] || exit 0
          cat "$RUNNER_TEMP/hunt/report.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-hunt
          path: ${{ runner.temp }}/hunt
          if-no-files-found: ignore
          retention-days: 14
      - name: delete the lane's cache
        if: always() && inputs.cleanup
        run: rm -rf "$HUNT_HOME" "$RUNNER_TEMP/hunt-work"

  # ---- the hosted route (host: hosted) --------------------------------------------
  # The PC has four slots for every lane, so a hunt over hundreds of documents waits
  # for hours there. Here each unit of `plan` is one GitHub-hosted job: the engines are
  # built once from this ref, the oracle is TeX Live 2026 from the pinned scheme-full
  # image (nightly.yml's and unicode-m3.yml's digest: pdfTeX 1.40.29 and XeTeX), and a
  # unit is one tools/parity/hunt/hunt.py run (parity, sound or xelatex over a slice of
  # a corpus manifest). A report, never a gate.
  hosted-build:
    name: hunt engines (hosted)
    if: inputs.host == 'hosted'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: parity-hunt-hosted
          workspaces: |
            crates/flashtex-xetex -> target
            . -> target
      - name: the engine, its host and tools; the XeTeX port
        run: |
          set -euo pipefail
          cargo build --release --locked -p flashtex-engine -p flashtex-display-list
          (cd crates/flashtex-xetex && cargo build --release --locked --bins --example fonts_line)
          mkdir -p "$RUNNER_TEMP/bin"
          cp target/release/{flashtex-initex,flashtex-host,dl3-keys,dl3-client,dl3-dump,dl3-coldopen} \
             crates/flashtex-engine/pdftex.pool \
             crates/flashtex-xetex/target/release/{flashtex-xetex,flashtex-host-unicode} \
             crates/flashtex-xetex/target/release/examples/fonts_line "$RUNNER_TEMP/bin/"
          git rev-parse HEAD > "$RUNNER_TEMP/bin/HEAD"
          ls -l "$RUNNER_TEMP/bin"
      - uses: actions/upload-artifact@v4
        with:
          name: hunt-bin
          path: ${{ runner.temp }}/bin
          retention-days: 3

  hosted-unit:
    name: hunt ${{ matrix.unit.name }}
    needs: hosted-build
    if: inputs.host == 'hosted'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        unit: ${{ fromJSON(inputs.plan) }}
    env:
      UNIT_NAME: ${{ matrix.unit.name }}
      UNIT_CMD: ${{ matrix.unit.cmd }}
      RUST_BACKTRACE: "1"
      HUNT_TEXLIVE_IMAGE: texlive/texlive@sha256:a7ae4dfa9d521b5db14446872fa488b839021d1f604d0a3c74461784895f2a67
    steps:
      - name: free disk (the TeX Live image and its copy take ~12 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/texlive-2026
        id: tl
        with:
          image: ${{ env.HUNT_TEXLIVE_IMAGE }}
          cache: "false"
      - uses: actions/download-artifact@v4
        with:
          name: hunt-bin
          path: ${{ runner.temp }}/hunt/bin
      - name: tools; fonts by name for both XeTeX engines
        run: |
          set -euo pipefail
          case "$UNIT_NAME" in *[!a-zA-Z0-9._-]*|'') echo "::error::a unit's name must be [a-zA-Z0-9._-]+"; exit 1 ;; esac
          chmod +x "$RUNNER_TEMP"/hunt/bin/*
          sudo apt-get update -qq && sudo apt-get install -y -qq qpdf poppler-utils fontconfig
          tl="$(dirname "$(dirname "${{ steps.tl.outputs.bin }}")")"
          python3 tools/unicode-m3/fontconfig.py --texlive "$tl" --out "$RUNNER_TEMP" >> "$GITHUB_ENV"
          FONTCONFIG_FILE="$RUNNER_TEMP/fonts.conf" fc-cache -f >/dev/null 2>&1 || true
          pdftex --version | head -1; xetex --version | head -1
          # the work directory is not a dot directory: a snap-confined qpdf cannot read ~/.cache
          echo "HUNT_HOME=$RUNNER_TEMP/hunt" >> "$GITHUB_ENV"
          echo "HUNT_BIN=$RUNNER_TEMP/hunt/bin" >> "$GITHUB_ENV"
      - name: the unit
        run: |
          set -o pipefail
          mkdir -p "$HUNT_HOME/out/$UNIT_NAME"
          # shellcheck disable=SC2086 # UNIT_CMD is a list of hunt.py arguments
          python3 tools/parity/hunt/hunt.py $UNIT_CMD 2>&1 | tee "$HUNT_HOME/out/$UNIT_NAME/unit.txt" | cut -c1-2000
      - name: report
        if: always()
        run: |
          {
            echo "### hunt $UNIT_NAME: \`$UNIT_CMD\`"
            echo '```'
            tail -n 60 "$HUNT_HOME/out/$UNIT_NAME/unit.txt" | cut -c1-600 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hunt-${{ matrix.unit.name }}
          path: ${{ runner.temp }}/hunt/out
          if-no-files-found: ignore
          retention-days: 14
