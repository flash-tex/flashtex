# FlashTeX release: on a v* tag (or a manual run with a version) build the
# helpers, package FlashTeX.app into a DMG (Developer ID-signed and
# notarized when the secrets exist, ad-hoc otherwise), tar the command line
# (`flashtex`, crates/flashtex-build, with its engine hosts) for macOS arm64
# and Linux x86_64, archive the source of the release's commit, publish a
# GitHub release with SHA256SUMS, then point the website (gh-pages) at it.
# See docs/ci-cd.md. The engine host (flashtex-host, GPL-2.0-or-later, a
# separate program) and `flashtex` ship in the app and the macOS CLI tarball,
# and a release without them fails (app-parity row D5). The old engine's CLI
# and helpers are gone (retirement plan S7, RQ6).
#
# GPL source (retirement plan §6, RQ19): the notes carry the line the app's
# About panel shows, the CLI tarball carries it in SOURCE.md and `flashtex
# licenses`, and the release attaches flashtex-<version>-source.tar.gz, the
# source of the commit it was built from.
#
# Dry run: a manual run with dry_run=true builds, packages and smoke-tests
# everything, archives the source and writes the notes, but creates no
# release or tag and does not touch the website; the assets and notes are
# the run's artifacts. scripts/tests/package-cli.test.sh and
# packaging-full.yml check the packaging without a run. Release notes
# written ahead of the tag live in docs/release/<tag>-notes.md (checklist:
# docs/release/<tag>.md) and head the published notes.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.2.0 (the tag is created on the run's commit if it does not exist)"
        required: true
        type: string
      dry_run:
        description: "Build, package and smoke-test only: publish no release, tag or website"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  version:
    name: resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then tag="$INPUT_VERSION"; else tag="$GITHUB_REF_NAME"; fi
          tag="v${tag#v}"
          echo "$tag" | grep -Eq '^v[0-9]+(\.[0-9]+){0,2}([-.][0-9A-Za-z.]+)?$' || { echo "not a release version: $tag"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"

  macos:
    name: macOS arm64 (app DMG + CLI)
    needs: version
    # Xcode 26 / Swift 6.x, Apple Silicon. If the macos-26 label is
    # unavailable, use macos-15 with maxim-lobanov/setup-xcode.
    runs-on: macos-26
    timeout-minutes: 120
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      # Read by crates/flashtex-build/build.rs: the crate version is 0.1.0
      # and is not bumped per release, so without this `flashtex --version`
      # reports 0.1.0 out of a v0.1.4 tarball, and `flashtex licenses` would
      # not name the release's tag.
      FLASHTEX_VERSION: ${{ needs.version.outputs.version }}
    outputs:
      signing: ${{ steps.sign.outputs.signing }}
      notarized: ${{ steps.sign.outputs.notarize != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift --version && xcodebuild -version
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # One workspace holds every helper now that vendor/ is retired;
          # crates/flashtex-xetex (Unicode mode's host) is its own.
          key: helpers
          workspaces: |
            . -> target
            crates/flashtex-xetex -> target
      - name: Build every bundled helper (release)
        # pipefail: otherwise `tee` hides a failed helper build and the
        # release proceeds with FLASHTEX_* lines missing.
        run: |
          set -o pipefail
          scripts/ci/build-helpers.sh | tee -a "$GITHUB_ENV"
      - name: Build the engine host and the CLI (release)
        # Not in build-helpers.sh, which ci.yml's mac-app job also runs: the
        # app finds a built host by itself (target/release), and that job's
        # tests must not start finding one. make-app.sh bundles the host
        # (--require-engine-host below); package-cli.sh ships both.
        run: |
          set -euo pipefail
          cargo build --release --locked -p flashtex-engine --bin flashtex-host
          cargo build --release --locked -p flashtex-build --bin flashtex
          ls -l target/release/flashtex-host target/release/flashtex
      - name: Build Unicode mode's host (release), when the tree has it
        # crates/flashtex-xetex is its own workspace (own Cargo.lock and
        # target/). Once it has flashtex-host-unicode (#1732) the app ships
        # it: make-app.sh is given it, and the packaging step checks it.
        run: |
          set -euo pipefail
          if [ -f crates/flashtex-xetex/src/bin/flashtex-host-unicode.rs ]; then
            (cd crates/flashtex-xetex && cargo build --release --locked --bin flashtex-host-unicode)
            ls -l crates/flashtex-xetex/target/release/flashtex-host-unicode
            echo "ENGINE_HOST_UNICODE=$PWD/crates/flashtex-xetex/target/release/flashtex-host-unicode" >> "$GITHUB_ENV"
          fi

      - name: Import the Developer ID certificate into a temporary keychain (optional)
        id: sign
        # Secrets (all optional; see docs/ci-cd.md):
        #   MAC_CERT_P12       base64 of a .p12 holding "Developer ID Application: ..." + private key
        #   MAC_CERT_PASSWORD  the .p12 password
        #   NOTARY_APPLE_ID, NOTARY_TEAM_ID, NOTARY_PASSWORD  (app-specific password) for notarytool
        # Nothing here prints a secret; identities are matched by name only.
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MAC_CERT_P12:-}" ] || [ -z "${MAC_CERT_PASSWORD:-}" ]; then
            echo "MAC_CERT_P12/MAC_CERT_PASSWORD not set: the app will be ad-hoc signed (not notarized)."
            echo "signing=adhoc" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/flashtex-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -d user -s "$KEYCHAIN"
          identity="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.+)".*/\1/')"
          [ -n "$identity" ] || { echo "the .p12 holds no valid 'Developer ID Application' identity"; exit 1; }
          echo "Signing identity: $identity"
          { echo "identity=$identity"; echo "keychain=$KEYCHAIN"; echo "signing=developer-id"; } >> "$GITHUB_OUTPUT"
          if [ -n "${NOTARY_APPLE_ID:-}" ] && [ -n "${NOTARY_TEAM_ID:-}" ] && [ -n "${NOTARY_PASSWORD:-}" ]; then
            # Stored in the temporary keychain; make-app.sh looks the profile
            # up by name there (FLASHTEX_NOTARY_KEYCHAIN) and never reads it.
            xcrun notarytool store-credentials flashtex-ci --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" --keychain "$KEYCHAIN" >/dev/null
            echo "FLASHTEX_NOTARY_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
            echo "notarize=flashtex-ci" >> "$GITHUB_OUTPUT"
            echo "Notarization: enabled (profile flashtex-ci)"
          else
            echo "NOTARY_* secrets not all set: signed but not notarized."
          fi

      - name: Package FlashTeX.app and the DMG
        env:
          SIGN_IDENTITY: ${{ steps.sign.outputs.identity }}
          NOTARY_PROFILE: ${{ steps.sign.outputs.notarize }}
        run: |
          set -euo pipefail
          args=(--version "$VERSION" --dmg --require-engine-host)
          if [ -n "${ENGINE_HOST_UNICODE:-}" ]; then args+=(--engine-host-unicode "$ENGINE_HOST_UNICODE"); fi
          if [ -n "${SIGN_IDENTITY:-}" ]; then args+=(--sign "$SIGN_IDENTITY"); fi
          if [ -n "${NOTARY_PROFILE:-}" ]; then args+=(--notarize "$NOTARY_PROFILE"); fi
          echo "make-app.sh ${args[*]}"
          apps/mac/scripts/make-app.sh "${args[@]}"
          test -f apps/mac/build/FlashTeX.dmg
          test -x apps/mac/build/FlashTeX.app/Contents/Helpers/flashtex-host
          if [ -n "${ENGINE_HOST_UNICODE:-}" ]; then test -x apps/mac/build/FlashTeX.app/Contents/Helpers/flashtex-host-unicode; fi
          cat apps/mac/build/FlashTeX.app/Contents/Resources/components.json

      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          cp apps/mac/build/FlashTeX.dmg dist/FlashTeX.dmg
          cp apps/mac/build/FlashTeX.dmg "dist/FlashTeX-$VERSION-macos-arm64.dmg"
          # Unicode mode's host ships too when this tree builds it.
          bins=(--bin target/release/flashtex --bin target/release/flashtex-host)
          if [ -n "${ENGINE_HOST_UNICODE:-}" ]; then bins+=(--bin "$ENGINE_HOST_UNICODE"); fi
          scripts/ci/package-cli.sh "$VERSION" macos-arm64 dist "${bins[@]}" \
            --require flashtex,flashtex-host${ENGINE_HOST_UNICODE:+,flashtex-host-unicode}
          (cd dist && shasum -a 256 -- * | tee SHA256SUMS.macos)
      - name: Smoke-test the packaged CLI
        # This runner has no TeX Live, so `flashtex build` typesets from the
        # pinned bundle (bin/flashtex-bundle.lock, fetched with the consent
        # FLASHTEX_BUNDLE_ALLOW_FETCH=1 gives), the way a user without TeX
        # Live runs the tarball; crates/flashtex-build/tests/cli.rs compares
        # its PDFs with pdflatex's on the self-hosted Mac leg of ci.yml.
        timeout-minutes: 30
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cli" && tar -C "$RUNNER_TEMP/cli" -xzf "dist/flashtex-cli-$VERSION-macos-arm64.tar.gz"
          cli="$RUNNER_TEMP/cli/flashtex-cli-$VERSION-macos-arm64"
          # Output captured first: `| grep -q` may close the pipe before the
          # program has written everything, and under pipefail its EPIPE
          # (Rust's println! panics on it) failed the step at random.
          # Not just run --version: assert it reports the release. The old
          # CLI printed "flashtex 0.1.0" through v0.1.4 and nothing checked it.
          reported="$("$cli/bin/flashtex" --version)"
          echo "$reported"
          case "$reported" in
            "flashtex $VERSION ("*) ;;
            *) echo "--version reports '$reported', expected 'flashtex $VERSION (<sha>)'"; exit 1 ;;
          esac
          help="$("$cli/bin/flashtex" --help)"
          host_help="$("$cli/bin/flashtex-host" --help)"
          licenses="$("$cli/bin/flashtex" licenses)"
          grep -q 'usage: flashtex build' <<< "$help"
          grep -q 'usage: flashtex-host' <<< "$host_help"
          # The GPL source offer, in the About panel's words, at this tag.
          grep -qF 'Source code for the FlashTeX engine (GPL-2.0-or-later): https://github.com/flash-tex/flashtex' <<< "$licenses"
          grep -qF "https://github.com/flash-tex/flashtex/tree/$TAG" <<< "$licenses"
          test -f "$cli/bin/pdftex.pool" && test -f "$cli/bin/flashtex-bundle.lock"
          test -f "$cli/share/flashtex/engine/LICENSE" && test -f "$cli/share/flashtex/LICENSE" && test -f "$cli/SOURCE.md"
          if [ -n "${ENGINE_HOST_UNICODE:-}" ]; then
            test -x "$cli/bin/flashtex-host-unicode" && test -f "$cli/share/flashtex/engine/LICENSE-unicode"
          fi
          # A tiny document, typeset: the CLI starts the host beside it, which
          # finds its pool and the bundle lock beside itself.
          printf '\\documentclass{article}\n\\begin{document}\nHello $\\frac{1}{2}$ world.\n\\end{document}\n' > "$RUNNER_TEMP/smoke.tex"
          FLASHTEX_BUNDLE_ALLOW_FETCH=1 "$cli/bin/flashtex" build "$RUNNER_TEMP/smoke.tex" -o "$RUNNER_TEMP/smoke.pdf" --no-progress
          head -c 8 "$RUNNER_TEMP/smoke.pdf" | grep -q '%PDF-1.'
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Delete the temporary keychain
        if: always() && steps.sign.outputs.keychain != ''
        run: security delete-keychain "${{ steps.sign.outputs.keychain }}" || true

  linux:
    name: Linux x86_64 (CLI)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # See the macOS job: gives `flashtex --version` the release version.
      FLASHTEX_VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    outputs:
      built: ${{ steps.build.outputs.built }}
      skipped: ${{ steps.build.outputs.skipped }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # One workspace: the CLI and the engine are ordinary members.
          key: cli
      - name: Build the CLI and the engine host (each may fail independently)
        id: build
        run: |
          set -uo pipefail
          built=(); skipped=()
          # flashtex-build is the CLI (bin flashtex); flashtex-engine builds
          # only its host here (package-cli.sh ships both when they built).
          for c in flashtex-build flashtex-engine; do
            only=(--bin flashtex); [ "$c" = flashtex-engine ] && only=(--bin flashtex-host)
            if (cd "crates/$c" && cargo build --release --locked "${only[@]}"); then built+=("$c"); else skipped+=("$c"); fi
          done
          echo "built=${built[*]:-}" >> "$GITHUB_OUTPUT"
          echo "skipped=${skipped[*]:-}" >> "$GITHUB_OUTPUT"
          echo "built: ${built[*]:-none}; did not build on Linux: ${skipped[*]:-none}"
          [ ${#built[@]} -gt 0 ]
      - name: Package the CLI
        run: |
          set -euo pipefail
          mkdir -p dist
          scripts/ci/package-cli.sh "$VERSION" linux-x86_64 dist
          (cd dist && sha256sum -- * | tee SHA256SUMS.linux)
      - name: Smoke-test the CLI and its host
        # They start, report the release and carry the source offer; the
        # macOS job also typesets with them.
        if: contains(steps.build.outputs.built, 'flashtex-build') && contains(steps.build.outputs.built, 'flashtex-engine')
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cli" && tar -C "$RUNNER_TEMP/cli" -xzf "dist/flashtex-cli-$VERSION-linux-x86_64.tar.gz"
          cli="$RUNNER_TEMP/cli/flashtex-cli-$VERSION-linux-x86_64"
          # Output captured first: `| grep -q` may close the pipe before the
          # program has written everything, and under pipefail its EPIPE
          # (Rust's println! panics on it) failed the step at random.
          reported="$("$cli/bin/flashtex" --version)"
          echo "$reported"
          case "$reported" in
            "flashtex $VERSION ("*) ;;
            *) echo "--version reports '$reported', expected 'flashtex $VERSION (<sha>)'"; exit 1 ;;
          esac
          help="$("$cli/bin/flashtex" --help)"
          host_help="$("$cli/bin/flashtex-host" --help)"
          licenses="$("$cli/bin/flashtex" licenses)"
          grep -q 'usage: flashtex build' <<< "$help"
          grep -q 'usage: flashtex-host' <<< "$host_help"
          grep -qF "https://github.com/flash-tex/flashtex/tree/$TAG" <<< "$licenses"
          test -f "$cli/bin/pdftex.pool" && test -f "$cli/share/flashtex/engine/LICENSE" && test -f "$cli/SOURCE.md"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/
          if-no-files-found: error
          retention-days: 7

  source:
    name: source archive
    needs: version
    # The complete source of the commit the release is built from (the tag
    # points at it): the GPL hosts' corresponding source, with everything
    # else, as a release asset (retirement plan §6 item 3).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Archive the release's commit
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar.gz --prefix="flashtex-$VERSION/" -o "dist/flashtex-$VERSION-source.tar.gz" HEAD
          tar -tzf "dist/flashtex-$VERSION-source.tar.gz" "flashtex-$VERSION/crates/flashtex-engine/LICENSE" "flashtex-$VERSION/third_party/xpdf/README.md" >/dev/null
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-source
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: GitHub release + website
    needs: [version, macos, linux, source]
    # `if: always()` means a failed `linux` job never blocks this: the release and
    # site publish as long as `macos` (the app + its own CLI tarball) succeeded.
    # The assets step below only includes the Linux CLI tarball when that job
    # actually produced one (see "Write release notes header").
    # The source archive is the GPL offer's asset: no release without it.
    # A dry run gets here too, writes the notes and stops before publishing.
    if: always() && needs.macos.result == 'success' && needs.source.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: incoming
          merge-multiple: true
      - name: Assemble assets and SHA256SUMS
        id: assets
        run: |
          set -euo pipefail
          mkdir -p dist
          find incoming -type f ! -name 'SHA256SUMS.*' -exec cp {} dist/ \;
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          dmg_sha="$(sha256sum dist/FlashTeX.dmg | cut -d' ' -f1)"
          echo "dmg_sha=$dmg_sha" >> "$GITHUB_OUTPUT"
      - name: Write release notes header
        env:
          SIGNING: ${{ needs.macos.outputs.signing }}
          NOTARIZED: ${{ needs.macos.outputs.notarized }}
          LINUX_RESULT: ${{ needs.linux.result }}
          LINUX_BUILT: ${{ needs.linux.outputs.built }}
          LINUX_SKIPPED: ${{ needs.linux.outputs.skipped }}
        run: |
          set -euo pipefail
          {
            echo "## Downloads"
            echo
            echo "| Asset | What |"
            echo "|---|---|"
            echo "| \`FlashTeX.dmg\` / \`FlashTeX-$VERSION-macos-arm64.dmg\` | The Mac app (macOS 14+, Apple Silicon). Same file under both names; \`install.sh\` on the website fetches \`FlashTeX.dmg\`. |"
            echo "| \`flashtex-cli-$VERSION-macos-arm64.tar.gz\` | The \`flashtex\` command line (MIT): \`flashtex build main.tex\`, check and watch on the pdfLaTeX-compatible engine (\`--mode unicode\`: XeLaTeX-compatible), with its engine hosts \`flashtex-host\` and \`flashtex-host-unicode\` (GPL-2.0-or-later). Needs TeX Live, or downloads the pinned TeX bundle with \`FLASHTEX_BUNDLE_ALLOW_FETCH=1\`. \`flashtex licenses\` prints the licences and the source offer. |"
            if [ "$LINUX_RESULT" = "success" ]; then
              echo "| \`flashtex-cli-$VERSION-linux-x86_64.tar.gz\` | Command-line tools for Linux x86_64 (built: ${LINUX_BUILT:-none}${LINUX_SKIPPED:+; not built on Linux: $LINUX_SKIPPED}). |"
            else
              echo "| _(no Linux CLI)_ | The Linux build job did not succeed for this release (result: $LINUX_RESULT). |"
            fi
            echo "| \`flashtex-$VERSION-source.tar.gz\` | The complete source of this release's commit, including the GPL engine hosts and the libraries they link (\`third_party/\`). |"
            echo "| \`SHA256SUMS\` | \`sha256sum -c SHA256SUMS\` after downloading. |"
            echo
            echo "## Signing"
            echo
            if [ "$SIGNING" = "developer-id" ] && [ "$NOTARIZED" = "true" ]; then
              echo "The app and DMG are signed with a Developer ID certificate and notarized by Apple; Gatekeeper opens them directly."
            elif [ "$SIGNING" = "developer-id" ]; then
              echo "The app and DMG are signed with a Developer ID certificate but **not notarized** (notarization secrets were not configured); macOS may ask you to confirm the first launch."
            else
              echo "This build is **ad-hoc signed** (no Developer ID certificate configured in CI). macOS Gatekeeper will refuse the first launch from a browser download: right-click FlashTeX.app > Open, or install with the website's \`install.sh\` which strips the quarantine attribute after verifying the checksum."
            fi
            echo
            echo "FlashTeX.dmg sha256: \`${{ steps.assets.outputs.dmg_sha }}\`"
            echo
            # GPL source offer (#1806); the app's About panel shows the same line (AboutPanel.swift).
            echo "## Source"
            echo
            echo "Source code for the FlashTeX engine (GPL-2.0-or-later): https://github.com/flash-tex/flashtex (this release: https://github.com/flash-tex/flashtex/tree/$TAG)"
            echo
          } > notes.md
          # The release's own notes, written before the tag (docs/release/),
          # go first; GitHub's generated PR list (--generate-notes) follows.
          if [ -f "docs/release/$TAG-notes.md" ]; then
            { cat "docs/release/$TAG-notes.md"; echo; cat notes.md; } > notes.full.md
            mv notes.full.md notes.md
          fi
          cat notes.md
      - name: Dry run (nothing is published)
        if: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          cp notes.md dist/notes.md
          echo "dry run: release $TAG would carry:"; ls -l dist
          {
            echo "### Release dry run: $TAG (nothing published)"
            echo
            echo '```'
            (cd dist && ls -l)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.dry_run }}
        with:
          name: dry-run-release
          path: dist/
          retention-days: 7
      - name: Create or update the GitHub release
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists; replacing assets"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "FlashTeX $TAG" --notes-file notes.md --generate-notes --target "$GITHUB_SHA"
          fi
          gh release view "$TAG" --json url --jq .url
      - name: Point the website (gh-pages) at this release
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          # A fresh clone in a temp dir does not inherit actions/checkout's
          # credential; route github.com pushes through the job token.
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          scripts/ci/update-site.sh "$TAG" "${{ steps.assets.outputs.dmg_sha }}" --remote "https://github.com/${GITHUB_REPOSITORY}.git"
