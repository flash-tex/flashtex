# Cold command-line compiles of the arXiv set, ref against ref and against TeX Live's pdftex, in
# user-space instructions and cycles (`perf stat`), on the NixOS PC's runner (lane THROUGHPUT;
# adapted from lane L6's l6-ab.yml). Measurement only, by hand: a push to an
# `agent/kabir-claude-throughput/ab/**` branch, whose tools/incr-bench/tpab.request (shell
# assignments of REFS, TPAB_DOCS, TPAB_REPS, TPAB_PERF) says what to run. No pull request runs
# here. Builds and compiles run in flashtex.slice (MemoryMax=10G) under nice; scratch lives in
# ~/.cache/flashtex-agents/throughput and the runner's temp directory.
name: throughput-ab

on:
  push:
    branches: ["agent/kabir-claude-throughput/ab/**"]

permissions:
  contents: read

concurrency:
  group: throughput-ab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ab:
    name: "cold arXiv compiles on the PC, ref against ref and pdftex"
    if: vars.FLASHTEX_SELFHOSTED_LINUX == '1'
    runs-on: [self-hosted, Linux, X64, flashtex-linux]
    timeout-minutes: 240
    env:
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: the request
        run: |
          set -euo pipefail
          f=tools/incr-bench/tpab.request
          [ -f "$f" ] || { echo "::error::no $f"; exit 1; }
          grep -E '^(REFS|TPAB_DOCS|TPAB_REPS|TPAB_PERF)=' "$f" \
            | sed -E "s/^([A-Z0-9_]+)='?([^']*)'?$/\1=\2/" >> "$GITHUB_ENV"
          cat "$f"
      - name: perf, pdftex, the build directories
        run: |
          set -euo pipefail
          if ! command -v perf >/dev/null; then
            p=$(nix build --no-link --print-out-paths nixpkgs#perf 2>/dev/null | head -1)
            echo "$p/bin" >> "$GITHUB_PATH"
          fi
          command -v pdftex && pdftex --version | head -1
          cat /proc/sys/kernel/perf_event_paranoid || true
          nproc; uptime; free -g | head -2
          echo "CARGO_TARGET_DIR_BASE=$HOME/.cache/flashtex-agents/throughput/target" >> "$GITHUB_ENV"
      - name: build each ref, then the compiles
        run: |
          set -o pipefail
          refs=()
          for r in $REFS; do
            if git rev-parse -q --verify "origin/$r^{commit}" >/dev/null; then refs+=("origin/$r"); else refs+=("$r"); fi
          done
          wrap=()
          scope=(systemd-run --user --scope --quiet --slice=flashtex.slice -p MemoryMax=10G -p MemorySwapMax=0)
          if "${scope[@]}" true 2>/dev/null; then wrap=("${scope[@]}")
          else echo "::error::systemd-run --user is unavailable; no unbounded runs on the PC"; exit 1; fi
          "${wrap[@]}" nice -n 5 tools/incr-bench/tpab.sh "$RUNNER_TEMP/tpab" "${refs[@]}" 2>&1 | tee "$RUNNER_TEMP/tpab.log"
      - name: summary
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/tpab/r/summary.md" ] || exit 0
          { echo '### throughput A/B (PC)'; cat "$RUNNER_TEMP/tpab/r/engines.txt"; echo; cat "$RUNNER_TEMP/tpab/r/summary.md"; } >> "$GITHUB_STEP_SUMMARY"
      - name: keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: throughput-ab
          path: |
            ${{ runner.temp }}/tpab/r/
            ${{ runner.temp }}/tpab.log
          if-no-files-found: ignore
          retention-days: 30
      - name: clean up
        if: always()
        run: |
          git worktree prune || true
          rm -rf "$RUNNER_TEMP/tpab"
