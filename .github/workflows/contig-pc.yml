# Lane CONTIG-TOKENS (DESIGN.md §12 P6; here the always-on LAZY-FLUSH of PR #2016 against its
# base): cold-compile instructions and cycles (`perf stat`) of the bench.json builds on the NixOS PC's runner, where the PMU is visible (GitHub's runners show none).
# The PC's ssh needs a Tailscale re-auth (2026-11-01), so, as lane L6's l6-ab.yml does, this runs
# by a push to agent/kabir-claude-contig/pc-* (in-repo code only; no pull request runs here,
# DESIGN §9.3). One job, compiles one at a time under nice; scratch only in
# ~/.cache/flashtex-agents/contig/, removed at the end. Measurement only, never merged.
name: contig-pc

on:
  push:
    branches: ["agent/kabir-claude-contig/pc-*"]

permissions:
  contents: read

concurrency:
  group: contig-pc
  cancel-in-progress: false

jobs:
  pc:
    if: (vars.FLASHTEX_SELFHOSTED_LINUX || vars.FLASHTEX_SELFHOSTED_MAC) == '1'
    runs-on: [self-hosted, Linux, X64, flashtex-linux]
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: "4"
      CFG: docs/evidence/contig-tokens-2026-11-01/bench.json
      S: docs/evidence/contig-tokens-2026-11-01/scripts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: scratch, perf
        run: |
          set -euo pipefail
          W="$HOME/.cache/flashtex-agents/contig/run-$GITHUB_RUN_ID"
          mkdir -p "$W"
          echo "W=$W" >> "$GITHUB_ENV"
          if ! command -v perf >/dev/null; then
            p=$(nix build --no-link --print-out-paths nixpkgs#perf 2>/dev/null | head -1)
            echo "$p/bin" >> "$GITHUB_PATH"
          fi
          { uname -a; nproc; grep -m1 'model name' /proc/cpuinfo; uptime; command -v pdftex kpsewhich; pdftex --version | head -1; } | tee "$W/machine.txt"
      - name: build each ref (regenerated first), its format
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH=0 FORCE_SOURCE_DATE=1
          python3 -c "import json,os; [print(k, v) for k, v in json.load(open(os.environ['CFG']))['builds'].items()]" > "$W/builds.txt"
          while read -r name ref; do
            src="$W/src-$name"
            git worktree add --detach "$src" "$ref" >/dev/null
            (cd "$src" && nice -n 5 cargo run --release --locked -q -p web2rust -- third_party/pdftex/pdftex.web \
               @crates/flashtex-engine/web2rust-default.args \
               --out-dir crates/flashtex-engine/src/generated --pool crates/flashtex-engine/pdftex.pool &&
             git diff --stat | tail -1 &&
             mkdir -p "$W/out" && git diff --binary > "$W/out/regen-$name.patch" &&
             CARGO_TARGET_DIR="$W/target-$name" nice -n 5 cargo build --release --locked -q -p flashtex-engine --bin flashtex-initex)
            d="$W/bin-$name"; mkdir -p "$d/fmt"
            cp "$W/target-$name/release/flashtex-initex" "$src/crates/flashtex-engine/pdftex.pool" "$d/"
            ln -sf "$d/flashtex-initex" "$d/pdftex"
            (cd "$src" && git rev-parse HEAD) > "$d/BUILD"
            (cd "$d/fmt" && FLASHTEX_POOL="$d/pdftex.pool" "$d/pdftex" -ini -jobname=pdflatex -progname=pdflatex \
               -etex -translate-file=cp227.tcx pdflatex.ini </dev/null >/dev/null 2>&1) || { tail -20 "$d/fmt/pdflatex.log"; exit 1; }
            echo "$name $ref: $(sha256sum "$d/fmt/pdflatex.fmt" | cut -c1-16)"
            git worktree remove --force "$src"
            rm -rf "$W/target-$name"
          done < "$W/builds.txt"
      - name: documents
        env:
          INCR_BENCH_DIR: ${{ env.W }}/ib
        run: |
          set -euo pipefail
          python3 tools/incr-bench/mkbook.py infdesc-x2 >/dev/null
          echo "$INCR_BENCH_DIR/docs/infdesc-x2:main.tex" > "$W/docs.txt"
          python3 "$S/fetchdocs.py" "$W/corpus" >> "$W/docs.txt"
          cat "$W/docs.txt"
      - name: compiles (perf stat)
        run: |
          set -uo pipefail
          OUT="$W/out/pc"; mkdir -p "$OUT"; cp "$W/machine.txt" "$OUT/"
          args=()
          while read -r spec; do args+=("$spec"); done < <(python3 -c "
          import json, os
          c = json.load(open(os.environ['CFG']))
          for k, e in c['engines'].items():
              print('--engine')
              print(k + '=' + os.environ['W'] + '/bin-' + e['build'] + ''.join(',%s=%s' % kv for kv in e['env'].items()))
          ")
          mapfile -t docs < "$W/docs.txt"
          nice -n 5 python3 "$S/bench.py" "$OUT" "${args[@]}" --reps "${REPS:-5}" --cg none "${docs[@]}" 2> >(tee "$OUT/bench.err" >&2)
          rm -rf "$OUT/work"
          python3 "$S/summary.py" "$W/out" | tee "$OUT/summary.md"
          cat "$OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contig-pc
          path: ${{ env.W }}/out
          retention-days: 30
      - name: clean up
        if: always()
        run: |
          git worktree prune || true
          rm -rf "$W"
