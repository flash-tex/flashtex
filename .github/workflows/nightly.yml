# The heavy suites, on a schedule instead of on every pull request
# (docs/design/engine-v2/DESIGN.md §8 and §9.2). See docs/ci-cd.md.
#
# WHAT IS HERE. Everything below exists today and runs:
#   * the parity scoreboard's arxiv (149 pinned e-prints) and templates (20 TeX
#     Live samples) tiers, which need a real pdflatex and ~450 MB of fetched
#     sources, so they can only run on self-hosted runners with TeX Live 2026:
#     arxiv on the owner's NixOS PC, templates on a Mac (see the job);
#   * the whole workspace in the DEBUG profile on both OSes. `ci.yml` tests
#     release, so `debug_assert!` and overflow checks are only ever exercised
#     here;
#   * the tests of every crate in scripts/rust-test-exclude.txt, without gating,
#     so a crate that has quietly started passing is noticed;
#   * the new engine's T2 (the LaTeX team's suites) and its fixture-wide
#     incremental soundness test, on the NixOS PC. Lockstep and P-T1/P-T2 run
#     in ci.yml's `engine parity` job, with trip, etrip and pdfTeX's
#     regression tests beside it;
#   * the macOS legs that left the merge queue (release workspace, standalone
#     crates, trip, etrip); a failed macOS or debug-workspace job opens or
#     updates the issue labelled `main-red` (ci.yml's post-merge issue).
#
# WHERE. Every Linux job runs on the owner's NixOS PC (labels flashtex-linux;
# three instances, scripts/ci/install-selfhosted-runner-nixos.sh) when
# FLASHTEX_SELFHOSTED_LINUX is 1 -- the same switch ci.yml's `plan` reads; while
# it is unset, FLASHTEX_SELFHOSTED_MAC stands in for it -- and the event is
# schedule or workflow_dispatch, the only two this file has; else on
# ubuntu-latest. The one self-hosted Mac leg (parity-corpus, templates) reads
# FLASHTEX_SELFHOSTED_MAC. Owner, 2026-09-29: "any tests that can be run on
# the nixos pc should be run there, as all other machines are laptops".
# While the NixOS switch is off, the new engine's T2, soundness and memory
# gates run on GitHub-hosted Ubuntu instead (engine-*-hosted, with a pinned
# TeX Live 2026 image); T4 and the arxiv leg stay PC-only (see their jobs).
# The heavy self-hosted Mac (flashtex-heavy) carries only the templates leg
# here, beside p5-scoreboard.
#
# T4, the ~5,000-document corpus (DESIGN §8), is the `corpus-t4` job below:
# sharded, resumable and ratcheted against a baseline recorded on the NixOS PC
# itself (tools/parity/nightly.py).
#
# WHAT IS NOT HERE YET. DESIGN §8 also specifies T5 (30,000+ documents, weekly,
# kept out of the repository) and T6 (differential fuzzing, continuous).
# Neither has an implementation in this repository yet, so this workflow does
# not pretend to run them. Add each one to this file in the lane that builds it.
name: nightly

on:
  schedule:
    # 04:17 America/New_York-ish, i.e. after the day's merges and before the
    # team's morning. A minute that is not :00 keeps it out of the hour's spike.
    - cron: '17 8 * * *'
  workflow_dispatch:
    inputs:
      parity_tiers:
        description: parity tiers to run (space separated)
        required: false
        default: 'arxiv templates'
      engine_hosted:
        description: >-
          also run the GitHub-hosted T2, soundness and memory jobs (otherwise
          only the fallback while the NixOS switch is off)
        type: boolean
        required: false
        default: false
      corpus_record_baseline:
        description: >-
          T4: record the ratchet baseline from this run (NixOS PC, main only).
          Manual only; a scheduled run never records one.
        type: boolean
        required: false
        default: false
      corpus_shards:
        description: T4 shard count (a changed count starts a new run key)
        required: false
        default: '50'
      corpus_shard_range:
        description: T4 shards to run now, e.g. 0-9 (empty = every unfinished shard)
        required: false
        default: ''

concurrency:
  # A nightly run may take hours. If one is still going when the next fires,
  # the newer one waits rather than doubling the load on the same Mac. Per
  # ref: a dispatch of a branch (to prove a change to this file) does not
  # queue behind main's night; the self-hosted jobs keep their own groups.
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The oracle of the GitHub-hosted engine jobs (engine-*-hosted): the
  # official texlive/texlive:latest image (scheme-full, TeX Live 2026, pdfTeX
  # 1.40.29) of 2026-10-04, pinned by its digest, so a night never changes
  # oracle under the engine. A new pin is a reviewed change of this line.
  NIGHTLY_TEXLIVE_IMAGE: texlive/texlive@sha256:a7ae4dfa9d521b5db14446872fa488b839021d1f604d0a3c74461784895f2a67

jobs:
  # The wide parity tiers. pdflatex is the oracle and never runs in the product
  # path (tools/parity/README.md), but it does have to exist here, and no
  # GitHub-hosted image ships TeX Live -- installing it per run costs more than
  # the measurement. So this job is self-hosted only, and says so instead of
  # failing, when self-hosted runners are switched off.
  #
  # One leg per tier, each on the host its inputs belong to (2026-09-29):
  #
  #   arxiv      the NixOS PC. DESIGN §8 forbids recording host-dependent
  #              expected data on a different host, and this tier records none:
  #              no committed baseline (unlike the fixtures tier in ci.yml,
  #              whose macOS-recorded baseline-fixtures.json keeps it on
  #              macOS). The e-prints are pinned by SHA-256 and fetched; the
  #              reference PDFs are made in the run by the runner's own
  #              pdflatex (TeX Live 2026, pdfTeX 1.40.29), and the scoreboard
  #              is a report, not a gate. The PC has qpdf (P-T2) and pdftoppm
  #              (L4) on PATH.
  #   templates  the NixOS PC too, since 2026-10-06 (P5-BOARD-T4). Its manifest
  #              pins 20 files of the Mac's MacTeX 2026 tree by path and
  #              SHA-256; the PC's TeX Live 2026 has no doc files, so the PC
  #              keeps a copy of exactly those files in
  #              ~/.cache/flashtex-corpus-texmf/texlive-2026 (parity.py
  #              --corpus-texmf; tools/parity/README.md, "The board's host").
  #              The oracle stays the PC's own pdflatex. On the heavy Mac it
  #              lost its runner mid-build on 10-06 (37423737667: "lost
  #              communication", the laptop's runner), so the Mac now runs it
  #              only while the PC's switch is off.
  #
  # Scores are per host (a document that paints from system fonts differs), so
  # compare each leg's nightly scoreboards with each other only.
  #
  # Switches: with FLASHTEX_SELFHOSTED_LINUX on (unset: the Mac switch stands
  # in) both legs run on the PC; otherwise templates alone runs on the heavy Mac
  # (FLASHTEX_SELFHOSTED_MAC, main only). A job's `if` cannot see the matrix,
  # so the tier list itself is built from the switches, and the job runs when
  # at least one leg is on.
  #
  # DESIGN §9.3: never on a pull_request from a fork. This workflow has no
  # pull_request trigger, and the guard is here anyway so that adding one later
  # cannot quietly hand a fork a machine on the team's network.
  parity-corpus:
    name: parity scoreboard (${{ matrix.tier }})
    if: >-
      ((vars.FLASHTEX_SELFHOSTED_LINUX || vars.FLASHTEX_SELFHOSTED_MAC) == '1' || (vars.FLASHTEX_SELFHOSTED_MAC == '1' && github.ref == 'refs/heads/main')) &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ (vars.FLASHTEX_SELFHOSTED_LINUX || vars.FLASHTEX_SELFHOSTED_MAC) == '1' && fromJSON('["self-hosted","Linux","X64","flashtex-linux"]') || fromJSON('["self-hosted","macOS","ARM64","flashtex","flashtex-heavy"]') }}
    # On the heavy Mac (the PC off) templates joins the group of the heavy Mac
    # jobs (p5-scoreboard's Mac route); on the PC each leg has a group of its own.
    concurrency:
      group: ${{ (vars.FLASHTEX_SELFHOSTED_LINUX || vars.FLASHTEX_SELFHOSTED_MAC) != '1' && 'flashtex-mac-heavy' || format('nightly-{0}-{1}', matrix.tier, github.run_id) }}
      cancel-in-progress: false
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        # both on the NixOS PC; with the PC off, templates alone on the Mac.
        # Never empty: the job's `if` needs one of them.
        tier: ${{ fromJSON((vars.FLASHTEX_SELFHOSTED_LINUX || vars.FLASHTEX_SELFHOSTED_MAC) == '1' && '["arxiv","templates"]' || '["templates"]') }}
    env:
      # 'true' when the dispatch input (default: both tiers) names this leg's tier.
      WANT: ${{ contains(format(' {0} ', github.event.inputs.parity_tiers || 'arxiv templates'), format(' {0} ', matrix.tier)) }}
    steps:
      - name: tier selected?
        run: echo "tier ${{ matrix.tier }} selected = $WANT"
      - uses: actions/checkout@v4
        if: env.WANT == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: env.WANT == 'true'
      - uses: Swatinem/rust-cache@v2
        if: env.WANT == 'true'
        with:
          workspaces: crates/flashtex-cli
          key: parity-cli
      - name: pdflatex is the oracle and must be installed
        if: env.WANT == 'true'
        run: |
          set -euo pipefail
          command -v pdflatex >/dev/null || {
            echo "::error::no pdflatex on this runner; put TeX Live 2026 on its PATH -- see tools/parity/README.md"
            exit 1
          }
          pdflatex --version | head -1
          command -v qpdf >/dev/null || echo "::warning::no qpdf on this runner: P-T2 will read n/a"
          # The harness defaults to MacTeX's paths (/Library/TeX/texbin,
          # /usr/local/texlive/2026/texmf-dist). Point it at this runner's own
          # TeX Live instead: the oracle, its bin directory and its texmf tree.
          {
            echo "PARITY_TEXBIN=$(dirname "$(command -v pdflatex)")"
            echo "PARITY_ORACLE=$(command -v pdftex)"
            echo "PARITY_TEXMF=$(kpsewhich -var-value TEXMFDIST)"
            # the templates documents' pinned copy, where this TeX Live has no doc files (the PC)
            docs="$HOME/.cache/flashtex-corpus-texmf/texlive-2026"
            if [ -d "$docs" ]; then echo "PARITY_CORPUS_TEXMF=$docs"
            else echo "PARITY_CORPUS_TEXMF=$(kpsewhich -var-value TEXMFDIST)"; fi
          } | tee -a "$GITHUB_ENV"
      - name: build the flashtex CLI (release)
        if: env.WANT == 'true'
        run: |
          set -o pipefail
          cargo build --release --locked \
            --manifest-path crates/flashtex-cli/Cargo.toml --bin flashtex
      - name: fetch and verify the pinned corpus
        if: env.WANT == 'true'
        # corpus.py verifies every SHA-256 and sends at most one arXiv request
        # every 3 s. Third-party sources are never committed. Only this leg's
        # tier's manifests.
        env:
          TIER: ${{ matrix.tier }}
        run: |
          set -euo pipefail
          margs=()
          for m in tools/parity/corpus/"$TIER"-*.json; do margs+=(--manifest "$m"); done
          python3 tools/parity/corpus.py --texmf "$PARITY_CORPUS_TEXMF" fetch "${margs[@]}"
      - name: run the tier
        if: env.WANT == 'true'
        env:
          TIER: ${{ matrix.tier }}
        run: |
          set -euo pipefail
          python3 tools/parity/parity.py --tier "$TIER" -j 6 \
            --texbin "$PARITY_TEXBIN" --oracle-pdftex "$PARITY_ORACLE" --texmf "$PARITY_TEXMF" \
            --corpus-texmf "$PARITY_CORPUS_TEXMF" \
            --out "$RUNNER_TEMP/parity" --work "$RUNNER_TEMP/parity-work"
      - name: report
        if: always() && env.WANT == 'true'
        run: |
          set -o pipefail
          [ -f "$RUNNER_TEMP/parity/report.md" ] || exit 0
          { echo "### Parity scoreboard (nightly, ${{ matrix.tier }}, $RUNNER_NAME)"; cat "$RUNNER_TEMP/parity/report.md"; } \
            >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && env.WANT == 'true'
        with:
          name: parity-nightly-${{ matrix.tier }}
          path: ${{ runner.temp }}/parity
          if-no-files-found: ignore
          retention-days: 30

  # Say why, rather than leaving an empty run, when a leg's runners are off.
  parity-corpus-unavailable:
    name: parity scoreboard (arxiv + templates)
    if: ${{ !((vars.FLASHTEX_SELFHOSTED_LINUX || vars.FLASHTEX_SELFHOSTED_MAC) == '1') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LINUX_ON: ${{ (vars.FLASHTEX_SELFHOSTED_LINUX || vars.FLASHTEX_SELFHOSTED_MAC) == '1' }}
      MAC_ON: ${{ (vars.FLASHTEX_SELFHOSTED_MAC == '1' && github.ref == 'refs/heads/main') }}
    steps:
      - run: |
          if [ "$LINUX_ON" != "true" ]; then
            echo "::notice::skipped: the arxiv tier needs the NixOS PC's self-hosted runners (TeX Live 2026)."
            echo "arxiv: register the NixOS runners (scripts/ci/install-selfhosted-runner-nixos.sh) and set \`gh variable set FLASHTEX_SELFHOSTED_LINUX --body 1\`." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$LINUX_ON" != "true" ] && [ "$MAC_ON" != "true" ]; then
            echo "::notice::skipped: the templates tier needs the NixOS PC, or (the PC off) a self-hosted Mac with MacTeX 2026."
            echo "templates: register a Mac runner (scripts/ci/install-selfhosted-runner.sh) and set \`gh variable set FLASHTEX_SELFHOSTED_MAC --body 1\`." >> "$GITHUB_STEP_SUMMARY"
          fi

  # DESIGN §8 T4: ~5,000 version-pinned arXiv e-prints (tools/parity/corpus/
  # nightly-5k.json) plus the arxiv, templates and packages tiers, the new
  # engine (crates/flashtex-engine) against the pinned pdflatex OF THIS HOST.
  # tools/parity/nightly.py drives parity.py shard by shard; see
  # tools/parity/README.md "Nightly corpus (T4)".
  #
  # Host rules (DESIGN §8): expected data comes only from this runner's own
  # pdfTeX/pdflatex (TeX Live 2026), cached by source hash; nothing expected
  # is committed. The ratchet baseline lives on the runner and carries the
  # host's identity, which nightly.py derives from /etc/machine-id and the TeX
  # Live installation (no label is passed in). It is refused on any other
  # host, so it can never be seeded from a Mac, and nightly.py itself records
  # one only in a workflow_dispatch of main. The first run must be such a
  # dispatch with corpus_record_baseline; until then the ratchet step fails
  # and says so.
  #
  # State survives the per-job wipe of the work directory: sources, oracle
  # references and finished shards live under $HOME/.cache on the runner. A
  # run that stops (timeout, reboot) resumes at its first unfinished shard
  # when started again with the same engine, formats, harness, oracle and
  # manifests.
  #
  # DESIGN §9.3: schedule and workflow_dispatch only (this file has no
  # pull_request trigger), and the guard below repeats it. No GitHub-hosted
  # fallback: with the NixOS switch (FLASHTEX_SELFHOSTED_LINUX; unset: the
  # Mac switch) off the job is skipped; with it on and the PC
  # offline, the job waits in the queue.
  #
  # No self-hosted Mac fallback either (2026-10-03, lane P5-BOARD-MAC): the
  # run takes most of a day with 8 workers on the PC's 16 threads, which on a
  # Mac would hold a runner the merge queue needs for that whole day, and its
  # ratchet baseline is bound to the PC's machine id and TeX Live, so a Mac
  # would need its own baseline recorded by hand first (an owner decision).
  # The Mac board's T4 (its own oracle, no ratchet) is corpus-t4-mac.yml: on
  # the heavy runner, dispatched by hand, one pinned commit resumed over
  # several runs (lane P5-T4-MAC).
  corpus-t4:
    name: T4 nightly corpus (NixOS PC)
    # main only: the P5 board builds the commit a corpus-t4 artifact names
    # (scripts/ci/p5-pick-t4.sh accepts only commits of main as well)
    if: >-
      (vars.FLASHTEX_SELFHOSTED_LINUX || vars.FLASHTEX_SELFHOSTED_MAC) == '1' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, flashtex-linux]
    timeout-minutes: 1440
    # One heavy job at a time on the PC: T4 and the P5 board (p5-scoreboard.yml's PC
    # route) share this group. On 10-06 the board (a 10G scope) and a T4 night (5
    # workers, 8.7G) ran together beside the agents' runs; flashtex.slice (MemoryHigh
    # 18G) went to 86 % full memory pressure, the runners' listeners stalled, and
    # GitHub dropped the board after 52 min ("lost communication", 37525986631).
    concurrency:
      group: flashtex-pc-heavy
      cancel-in-progress: false
    env:
      # a baseline is recorded only by hand, and only from main's engine
      RECORD: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.corpus_record_baseline && '1' || '0' }}
      SHARDS: ${{ inputs.corpus_shards || '50' }}
      SHARD_RANGE: ${{ inputs.corpus_shard_range || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Pinned, not @stable: the board compares its engine binary's sha256 with the
      # T4 run's, so p5-scoreboard.yml and both T4 jobs (nightly.yml corpus-t4,
      # corpus-t4-mac.yml) build with one rustc. Change all three together.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - name: the oracle (this host's TeX Live 2026) and the persistent state
        run: |
          set -euo pipefail
          for t in pdflatex pdftex kpsewhich qpdf pdftoppm; do
            command -v "$t" >/dev/null || { echo "::error::no $t on this runner's PATH (TeX Live 2026 and the Nix profile)"; exit 1; }
          done
          pdftex --version | head -1 | grep -q '1\.40\.29' || { echo "::error::the oracle is not pdfTeX 1.40.29: $(pdftex --version | head -1)"; exit 1; }
          state="$HOME/.cache/flashtex-nightly"
          mkdir -p "$state"
          {
            echo "FLASHTEX_NIGHTLY_HOME=$state"
            echo "FLASHTEX_PARITY_CACHE=$HOME/.cache/flashtex-parity"
            echo "CARGO_TARGET_DIR=$state/target"
            echo "PARITY_TEXBIN=$(dirname "$(command -v pdflatex)")"
            echo "PARITY_ORACLE=$(command -v pdftex)"
            echo "PARITY_TEXMF=$(kpsewhich -var-value TEXMFDIST)"
            echo "PARITY_TLPDB=$(kpsewhich -var-value SELFAUTOPARENT)/tlpkg/texlive.tlpdb"
          } | tee -a "$GITHUB_ENV"
          df -h "$HOME" | tail -1
      - name: build the new engine and its formats
        run: |
          set -euo pipefail
          cargo build --release --locked -p flashtex-engine --bin flashtex-initex
          bin="$CARGO_TARGET_DIR/release/flashtex-initex"
          # Formats and pool at a path that does not depend on the runner
          # instance, named by what they are built from: the engine, the pool
          # and this TeX Live (its package database). A new engine, pool or
          # tlmgr update builds new formats; the same inputs reuse them, so a
          # resumed run keeps its key. nightly.py hashes their contents too.
          sum="$(cat "$bin" crates/flashtex-engine/pdftex.pool "$PARITY_TLPDB" | sha256sum | cut -c1-16)"
          fmt="$FLASHTEX_NIGHTLY_HOME/engines/$sum"
          if [ ! -f "$fmt/done" ]; then
            rm -rf "$fmt" && mkdir -p "$fmt"
            cp "$bin" "$fmt/flashtex-initex"
            cp crates/flashtex-engine/pdftex.pool "$fmt/pdftex.pool"
            python3 tools/parity/nightly.py make-formats \
              --engine "$fmt/flashtex-initex" --pool "$fmt/pdftex.pool" --out "$fmt"
            touch "$fmt/done"
          fi
          echo "ENGINE_DIR=$fmt" >> "$GITHUB_ENV"
      - name: score every unfinished shard
        # exit 4: some shards unfinished (the deadline, or a harness failure);
        # the artifact still says how far it got, and the next run resumes.
        #
        # Memory is bounded, not hoped for. A traced log is held in memory only
        # up to 64 MiB; a larger one (e-prints trace to 25 GB) is compared as a
        # stream in constant memory (tools/parity/pt1stream.py), so P-T1 is
        # still evaluated. The bound is 8 workers x (1 GiB + 9 x 64 MiB) =
        # 12.5 GiB, where 9 is parity.PT1_MEMORY_FACTOR, measured. nightly.py
        # refuses to start when that bound is over 70% of the memory this PC
        # has available at the start of the job (other runner instances share it).
        #
        # The workers run in a scope of their own inside flashtex.slice, capped
        # at 8G (MemoryHigh 7G), and their count is fitted to a 6.5 GiB budget (at
        # most 8, 1.5625 GiB each: 4), so T4 leaves room in the 18G slice for the
        # agents' runs (10-06: 5 workers peaked at 8.7G). On 10-06 (37423737667) the 8 workers ran in the
        # runner's own service cgroup, whose MemoryHigh is 9G: reclaim stalled
        # the whole cgroup, the runner's listener with it, its job renewals
        # timed out (11:27Z on), and GitHub dropped the job after 46 of 50
        # shards ("lost communication"). In a scope, a stall stops the workers,
        # not the listener.
        #
        # The templates and packages documents come from the PC's pinned copy
        # (tools/parity/README.md, "The board's host"): its TeX Live has no doc
        # files, so without it those documents are unmeasured, and every shard
        # holding one is scored again on each resume (P5-BOARD-T4, 2026-10-06:
        # a resume of 4 missing shards started over at shard 0).
        run: |
          set -euo pipefail
          budget="$(awk '/^MemAvailable:/ { b = $2 * 0.7 / 1048576; if (b > 6.5) b = 6.5; printf "%.1f", b }' /proc/meminfo)"
          jobs="$(awk -v b="$budget" 'BEGIN { j = int(b / 1.5625); if (j > 8) j = 8; if (j < 1) j = 1; print j }')"
          wrap=()
          # OOMPolicy=continue: an OOM kill takes its victim only (parity.py records a
          # worker_died document), not the whole scope (systemd's default is stop).
          # No scope, no run: never unbounded in the runner's own cgroup.
          scope=(systemd-run --user --scope --quiet --slice=flashtex.slice -p MemoryMax=8G -p MemoryHigh=7G -p MemorySwapMax=0 -p OOMPolicy=continue)
          if "${scope[@]}" true 2>/dev/null; then wrap=("${scope[@]}" nice -n 10)
          else echo "::error::systemd-run --user is unavailable: T4's workers run only in their own scope, never in the runner's cgroup (37423737667)"; exit 1; fi
          echo "T4: $jobs workers, memory budget $budget GiB"
          docs="$HOME/.cache/flashtex-corpus-texmf/texlive-2026"
          corpus=()
          if [ -d "$docs" ]; then corpus=(--corpus-texmf "$docs")
          else echo "::warning::no $docs: the templates and packages documents are unmeasured"; fi
          ${wrap[@]+"${wrap[@]}"} python3 tools/parity/nightly.py run --shards "$SHARDS" \
            ${SHARD_RANGE:+--shard-range "$SHARD_RANGE"} \
            --tier nightly-5k --tier arxiv --tier templates --tier packages \
            --pt1-sample nightly-5k=0.05 --pt1-max-log-mb 64 --memory-budget-gib "$budget" \
            --engine "$ENGINE_DIR/flashtex-initex" \
            --engine-env "FLASHTEX_FORMATS=$ENGINE_DIR" --engine-env "FLASHTEX_POOL=$ENGINE_DIR/pdftex.pool" \
            --texbin "$PARITY_TEXBIN" --oracle-pdftex "$PARITY_ORACLE" \
            -j "$jobs" --deadline-minutes 1320 --out "$RUNNER_TEMP/corpus-t4" \
            -- --texmf "$PARITY_TEXMF" ${corpus[@]+"${corpus[@]}"}
      - name: ratchet against this host's baseline
        # also after an unfinished run: the documents it did score are held
        if: always()
        run: |
          set -euo pipefail
          # no summary: an earlier step failed, and the job has failed with it
          [ -f "$RUNNER_TEMP/corpus-t4/summary.json" ] || exit 0
          if [ "$RECORD" = 1 ]; then
            python3 tools/parity/nightly.py ratchet --results "$RUNNER_TEMP/corpus-t4" || true
            python3 tools/parity/nightly.py ratchet --results "$RUNNER_TEMP/corpus-t4" --record
          else
            python3 tools/parity/nightly.py ratchet --results "$RUNNER_TEMP/corpus-t4"
          fi
      - name: report
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/corpus-t4/summary.md" ] || exit 0
          cat "$RUNNER_TEMP/corpus-t4/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-t4
          # summary.md/json, documents.json (one small record per document),
          # ratchet.json, baseline.json when recorded; never logs
          path: ${{ runner.temp }}/corpus-t4
          if-no-files-found: ignore
          retention-days: 30

  # The new engine's nightly gates, on the owner's NixOS PC (TeX Live 2026 is
  # first on its runners' PATH), through scripts/engine-parity.sh like CI's
  # `engine parity` job:
  #
  #   T2         the LaTeX team's latex2e (base + required) and l3kernel
  #              suites against the engine, through l3build, versus their
  #              committed .tlg files (tools/latex-suites); the baseline is
  #              TeX Live's pdftex on the same runner, run first (the PC's
  #              TeX Live is newer than the suites' pins);
  #   soundness  the fixture-wide incremental soundness test, which every
  #              `cargo test` skips (#[ignore], it takes minutes).
  #
  # Both run with FLASHTEX_REQUIRE_TEXLIVE=1, so a runner that has lost its
  # TeX Live fails instead of passing on skips. Same switch as the other
  # self-hosted jobs. With the PC switched off, the GitHub-hosted jobs
  # engine-*-hosted below run T2, soundness and memory instead.
  engine-latex-suites:
    name: "engine: LaTeX suites (T2)"
    if: (vars.FLASHTEX_SELFHOSTED_LINUX || vars.FLASHTEX_SELFHOSTED_MAC) == '1'
    runs-on: [self-hosted, Linux, X64, flashtex-linux]
    timeout-minutes: 240
    env:
      FLASHTEX_REQUIRE_TEXLIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: this runner's build directory
        run: echo "CARGO_TARGET_DIR=$HOME/.cache/flashtex-ci/$RUNNER_NAME/target-engine-parity" >> "$GITHUB_ENV"
      - name: build the engine and its formats, then run the suites
        run: scripts/engine-parity.sh build t2

  engine-soundness:
    name: "engine: incremental soundness (every fixture)"
    if: (vars.FLASHTEX_SELFHOSTED_LINUX || vars.FLASHTEX_SELFHOSTED_MAC) == '1'
    runs-on: [self-hosted, Linux, X64, flashtex-linux]
    timeout-minutes: 180
    env:
      FLASHTEX_REQUIRE_TEXLIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: this runner's build directory
        run: echo "CARGO_TARGET_DIR=$HOME/.cache/flashtex-ci/$RUNNER_NAME/target-engine-parity" >> "$GITHUB_ENV"
      - name: cargo test --ignored every_fixture_edits_equal_scratch_compiles
        run: scripts/engine-parity.sh soundness

  # The resident host's memory (DESIGN.md §5.2's retention budget, §7): typing
  # through the socket on 120- and 1,000-page documents, the host's peak
  # resident memory against a limit per size (tools/incr-bench/mem_gate.sh;
  # docs/evidence/p4-memory-2026-09-30/). A host above 6 GB is killed at
  # once, so a regression cannot starve the other runners on the PC.
  # It runs on the NixOS runners, so it follows their switch,
  # FLASHTEX_SELFHOSTED_LINUX (unset: the Mac switch, as #1349 does elsewhere).
  engine-memory:
    name: "engine: host memory (peak RSS per document size)"
    if: (vars.FLASHTEX_SELFHOSTED_LINUX || vars.FLASHTEX_SELFHOSTED_MAC) == '1'
    runs-on: [self-hosted, Linux, X64, flashtex-linux]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: this runner's build directory
        run: echo "CARGO_TARGET_DIR=$HOME/.cache/flashtex-ci/$RUNNER_NAME/target-engine-parity" >> "$GITHUB_ENV"
      - name: build, then type on each document and gate its peak RSS
        run: |
          set -o pipefail
          INCR_BENCH_DIR="$RUNNER_TEMP/incr-bench-mem" tools/incr-bench/mem_gate.sh --build \
            | tee "$RUNNER_TEMP/mem-gate.txt"
      - name: report
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/mem-gate.txt" ] || exit 0
          { echo "### Host memory gate"; grep -E '^\||mem gate' "$RUNNER_TEMP/mem-gate.txt"; } >> "$GITHUB_STEP_SUMMARY"

  # The PC switched off: T2, soundness and the memory gate on GitHub-hosted
  # Ubuntu instead (DESIGN §9.2: "a night without the PC is not a night
  # without gates"; review 2026-10-05, lane NIGHTLY-GREEN). Until 2026-10-05
  # they ran one after the other in one job on the heavy self-hosted Mac
  # (#1413), which also carries p5-scoreboard: T2 alone held it for about
  # two hours a night beside the board's own T2 on the same oracle, and that
  # Mac ran out of disk twice (10-03). The heavy Mac now carries the board and
  # the templates leg only.
  #
  # The oracle is TeX Live 2026 from the official texlive/texlive image pulled
  # by digest (.github/actions/texlive-2026), scheme-full: the suites load
  # packages scheme-medium lacks (l3build itself, blindtext, cleveref,
  # multirow, tugboat, ...). The full tree is ~2.6 GB compressed, too large to
  # keep in the Actions cache beside the rest, so each job pulls it. T2's
  # baseline is still the reference run on that same tree, first, in the same
  # job (engine-parity.sh t2), so this snapshot's own failures never count
  # against the engine. A GitHub-hosted runner sees only this repository's
  # code and no secrets, so these jobs need no fork guard (§9.3) and may run
  # on a dispatch of any branch.
  engine-latex-suites-hosted:
    name: "engine: LaTeX suites (T2, GitHub-hosted)"
    if: ${{ !((vars.FLASHTEX_SELFHOSTED_LINUX || vars.FLASHTEX_SELFHOSTED_MAC) == '1') || inputs.engine_hosted }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      FLASHTEX_REQUIRE_TEXLIVE: "1"
    steps:
      - name: free disk (the TeX Live image and its copy take ~12 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/texlive-2026
        with:
          image: ${{ env.NIGHTLY_TEXLIVE_IMAGE }}
          cache: "false"
      - name: qpdf (engine-parity.sh's preflight requires it)
        run: command -v qpdf || { sudo apt-get update -qq && sudo apt-get install -y -qq qpdf; }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: engine-parity
      - name: build the engine and its formats, then run the suites
        run: scripts/engine-parity.sh --jobs 4 build t2
      - name: report
        if: always()
        run: |
          w="$RUNNER_TEMP/engine-parity"
          [ -f "$w/t2-engine.txt" ] || exit 0
          {
            echo "### T2 ($(pdftex --version | head -1); $NIGHTLY_TEXLIVE_IMAGE)"
            echo '```'
            grep -E ': PASS [0-9]+ / FAIL' "$w/t2-reference.txt" | sed 's/^/reference: /'
            grep -E ': PASS [0-9]+ / FAIL' "$w/t2-engine.txt" | sed 's/^/engine:    /'
            python3 tools/latex-suites/compare_failures.py "$w/t2-reference.txt" "$w/t2-engine.txt" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-t2-hosted
          path: |
            ${{ runner.temp }}/engine-parity/t2-reference.txt
            ${{ runner.temp }}/engine-parity/t2-engine.txt
          if-no-files-found: ignore
          retention-days: 30

  engine-soundness-hosted:
    name: "engine: incremental soundness (every fixture, GitHub-hosted)"
    if: ${{ !((vars.FLASHTEX_SELFHOSTED_LINUX || vars.FLASHTEX_SELFHOSTED_MAC) == '1') || inputs.engine_hosted }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FLASHTEX_REQUIRE_TEXLIVE: "1"
    steps:
      - name: free disk (the TeX Live image and its copy take ~12 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/texlive-2026
        with:
          image: ${{ env.NIGHTLY_TEXLIVE_IMAGE }}
          cache: "false"
      - name: qpdf (engine-parity.sh's preflight requires it)
        run: command -v qpdf || { sudo apt-get update -qq && sudo apt-get install -y -qq qpdf; }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: engine-soundness
      - name: cargo test --ignored every_fixture_edits_equal_scratch_compiles
        run: scripts/engine-parity.sh soundness

  engine-memory-hosted:
    name: "engine: host memory (peak RSS per document size, GitHub-hosted)"
    if: ${{ !((vars.FLASHTEX_SELFHOSTED_LINUX || vars.FLASHTEX_SELFHOSTED_MAC) == '1') || inputs.engine_hosted }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: free disk (the TeX Live image and its copy take ~12 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/texlive-2026
        with:
          image: ${{ env.NIGHTLY_TEXLIVE_IMAGE }}
          cache: "false"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: engine-memory
      - name: build, then type on each document and gate its peak RSS
        run: |
          set -o pipefail
          INCR_BENCH_DIR="$RUNNER_TEMP/incr-bench-mem" tools/incr-bench/mem_gate.sh --build \
            | tee "$RUNNER_TEMP/mem-gate.txt"
      - name: report
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/mem-gate.txt" ] || exit 0
          { echo "### Host memory gate ($(nproc) CPUs, $(free -g | awk '/^Mem:/ { print $2 }') GB; GitHub-hosted)"; grep -E '^\||mem gate' "$RUNNER_TEMP/mem-gate.txt"; } >> "$GITHUB_STEP_SUMMARY"

  # ci.yml tests the release profile. Nothing tests debug, which is the profile
  # with `debug_assert!` and integer-overflow checks turned on -- so an
  # overflow the release build wraps silently is only caught here.
  workspace-debug:
    name: workspace, debug profile (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'ubuntu-latest' && (vars.FLASHTEX_SELFHOSTED_LINUX || vars.FLASHTEX_SELFHOSTED_MAC) == '1' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('["self-hosted","Linux","X64","flashtex-linux"]') || matrix.os }}
    timeout-minutes: 120
    env:
      # Full DWARF for the workspace plus ~220 render-pipeline test binaries
      # fills a hosted runner's disk (ld bus error 10-01, ENOSPC 10-02). Line
      # tables keep backtraces; debug-assertions and overflow-checks unchanged.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      FLASHTEX_FONT_DIRS: ${{ github.workspace }}/apps/mac/Fonts
      FLASHTEX_TFM_DIRS: ${{ github.workspace }}/apps/mac/Fonts/texmf/fonts/tfm/public/lm:${{ github.workspace }}/apps/mac/Fonts/texmf/fonts/tfm/jknappen/ec:${{ github.workspace }}/apps/mac/Fonts/texmf/fonts/tfm/public/amsfonts/symbols
      FLASHTEX_LM_DIR: ${{ github.workspace }}/apps/mac/Fonts
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - name: free disk (GitHub-hosted Linux only)
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: workspace-debug
      - name: Read the test-exclusion list
        run: |
          set -euo pipefail
          list="$(sed -e 's/#.*//' scripts/rust-test-exclude.txt | tr '[:space:]' ' ' | tr -s ' ')"
          echo "RUST_TEST_EXCLUDE=$list" >> "$GITHUB_ENV"
      - run: cargo build --workspace --all-targets --locked
      - name: cargo test --workspace (debug)
        run: |
          set -euo pipefail
          excludes=()
          for p in $RUST_TEST_EXCLUDE; do excludes+=(--exclude "$p"); done
          cargo test --workspace --locked --no-fail-fast ${excludes[@]+"${excludes[@]}"}
      - name: the two standalone crates (debug)
        run: |
          set -euo pipefail
          for c in render-pipeline flashtex-cli; do
            ( cd "crates/$c" && cargo build --locked && cargo test --locked --no-fail-fast )
          done

  # The crates whose tests are temporarily not gating. ci.yml runs these too,
  # but only inside the full tier; here they get a run of their own every night,
  # so "it passes again, delete its line" is noticed within a day.
  excluded-crates:
    name: excluded crates (not gating)
    runs-on: ${{ (vars.FLASHTEX_SELFHOSTED_LINUX || vars.FLASHTEX_SELFHOSTED_MAC) == '1' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('["self-hosted","Linux","X64","flashtex-linux"]') || 'ubuntu-latest' }}
    timeout-minutes: 90
    env:
      FLASHTEX_FONT_DIRS: ${{ github.workspace }}/apps/mac/Fonts
      FLASHTEX_TFM_DIRS: ${{ github.workspace }}/apps/mac/Fonts/texmf/fonts/tfm/public/lm:${{ github.workspace }}/apps/mac/Fonts/texmf/fonts/tfm/jknappen/ec:${{ github.workspace }}/apps/mac/Fonts/texmf/fonts/tfm/public/amsfonts/symbols
      FLASHTEX_LM_DIR: ${{ github.workspace }}/apps/mac/Fonts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: workspace
      - name: run them anyway and report
        run: |
          set -uo pipefail
          list="$(sed -e 's/#.*//' scripts/rust-test-exclude.txt | tr '[:space:]' ' ' | tr -s ' ')"
          echo "### Excluded crates" >> "$GITHUB_STEP_SUMMARY"
          [ -n "${list// /}" ] || { echo "the exclusion list is empty" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          for p in $list; do
            if cargo test --release --locked --no-fail-fast -p "$p"; then
              echo "::warning::$p passes now; remove it from scripts/rust-test-exclude.txt and close its issue"
              echo "- \`$p\`: **passes**; remove its line" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- \`$p\`: still failing (expected while its issue is open)" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

  # The clippy debt list, same idea: every night, so the list shrinking is a
  # visible fact rather than something someone has to go and measure.
  clippy-debt:
    name: clippy debt (not gating)
    runs-on: ${{ (vars.FLASHTEX_SELFHOSTED_LINUX || vars.FLASHTEX_SELFHOSTED_MAC) == '1' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('["self-hosted","Linux","X64","flashtex-linux"]') || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: workspace-debug
      - name: which listed crates pass now
        run: |
          set -uo pipefail
          list="$(sed -e 's/#.*//' scripts/clippy-debt.txt | tr '[:space:]' ' ' | tr -s ' ')"
          {
            echo "### clippy debt (scripts/clippy-debt.txt)"
            echo "| crate | \`-D warnings\` |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for p in $list; do
            case "$p" in
              flashtex-render-pipeline) dir=crates/render-pipeline ;;
              flashtex-cli) dir=crates/flashtex-cli ;;
              flashtex-perf-bench) dir=crates/perf-bench ;;
              *) dir="" ;;
            esac
            if [ -n "$dir" ]; then
              ( cd "$dir" && cargo clippy --all-targets --no-deps --locked -- -D warnings ) >/dev/null 2>&1 && r=pass || r=fail
            else
              cargo clippy -p "$p" --all-targets --no-deps --locked -- -D warnings >/dev/null 2>&1 && r=pass || r=fail
            fi
            if [ "$r" = pass ]; then
              echo "::warning::clippy now passes for $p; delete its line from scripts/clippy-debt.txt"
              echo "| \`$p\` | **passes -- delete its line** |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| \`$p\` | still failing |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

  # The macOS legs that left the merge queue (ci.yml header, docs/ci-cd.md
  # "Post-merge macOS legs"): the release workspace, the two standalone crates,
  # trip and etrip on macOS. They also run on every push to main; here they run
  # against the night's main even when nothing merged, on a GitHub-hosted Mac.
  macos-legs:
    name: macOS legs (release workspace, standalone crates, trip, etrip)
    runs-on: macos-15
    timeout-minutes: 180
    env:
      FLASHTEX_FONT_DIRS: ${{ github.workspace }}/apps/mac/Fonts
      FLASHTEX_TFM_DIRS: ${{ github.workspace }}/apps/mac/Fonts/texmf/fonts/tfm/public/lm:${{ github.workspace }}/apps/mac/Fonts/texmf/fonts/tfm/jknappen/ec:${{ github.workspace }}/apps/mac/Fonts/texmf/fonts/tfm/public/amsfonts/symbols
      FLASHTEX_LM_DIR: ${{ github.workspace }}/apps/mac/Fonts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: workspace
      - name: cargo test --workspace --release
        run: |
          set -euo pipefail
          list="$(sed -e 's/#.*//' scripts/rust-test-exclude.txt | tr '[:space:]' ' ' | tr -s ' ')"
          excludes=()
          for p in $list; do excludes+=(--exclude "$p"); done
          cargo build --workspace --all-targets --release --locked
          cargo test --workspace --release --locked --no-fail-fast ${excludes[@]+"${excludes[@]}"}
      - name: render-pipeline and flashtex-cli on their own
        if: always()
        run: |
          set -euo pipefail
          for c in render-pipeline flashtex-cli; do
            ( cd "crates/$c" && cargo build --release --locked && cargo test --release --locked --no-fail-fast )
          done
      - name: trip
        if: always()
        run: TRIP_WORK="$RUNNER_TEMP/trip" scripts/flashtex-trip.sh
      - name: etrip
        if: always()
        run: ETRIP_WORK="$RUNNER_TEMP/etrip" scripts/flashtex-etrip.sh

  # A failed macOS leg or debug-profile workspace job tonight opens or
  # updates `main-red` (scripts/ci/main-red.sh, the issue ci.yml's post-merge
  # jobs file). A green night does not close it: these legs are a few of the
  # post-merge jobs, and only a green ci.yml run on main's tip covers them all.
  main-red:
    name: main-red issue
    needs: [macos-legs, workspace-debug]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/main-red.sh "${{ github.run_id }}" --only 'macos|debug profile' --no-close
