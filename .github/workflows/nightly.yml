# The heavy suites, on a schedule instead of on every pull request
# (docs/design/engine-v2/DESIGN.md §8 and §9.2). See docs/ci-cd.md.
#
# WHAT IS HERE. Everything below exists today and runs:
#   * the parity scoreboard's arxiv (149 pinned e-prints) and templates (20 TeX
#     Live samples) tiers, which need a real pdflatex and ~450 MB of fetched
#     sources, so they can only run on a Mac with TeX Live -- that is, on a
#     self-hosted runner;
#   * the whole workspace in the DEBUG profile on both OSes. `ci.yml` tests
#     release, so `debug_assert!` and overflow checks are only ever exercised
#     here;
#   * the tests of every crate in scripts/rust-test-exclude.txt, without gating,
#     so a crate that has quietly started passing is noticed.
#
# T4, the ~5,000-document corpus (DESIGN §8), is the `corpus-t4` job below:
# sharded, resumable and ratcheted against a baseline recorded on the NixOS PC
# itself (tools/parity/nightly.py).
#
# WHAT IS NOT HERE YET. DESIGN §8 also specifies T5 (30,000+ documents, weekly,
# kept out of the repository) and T6 (differential fuzzing, continuous).
# Neither has an implementation in this repository yet, so this workflow does
# not pretend to run them. Add each one to this file in the lane that builds it.
name: nightly

on:
  schedule:
    # 04:17 America/New_York-ish, i.e. after the day's merges and before the
    # team's morning. A minute that is not :00 keeps it out of the hour's spike.
    - cron: '17 8 * * *'
  workflow_dispatch:
    inputs:
      parity_tiers:
        description: parity tiers to run (space separated)
        required: false
        default: 'arxiv templates'
      corpus_record_baseline:
        description: >-
          T4: record the ratchet baseline from this run (NixOS PC, main only).
          Manual only; a scheduled run never records one.
        type: boolean
        required: false
        default: false
      corpus_shards:
        description: T4 shard count (a changed count starts a new run key)
        required: false
        default: '50'
      corpus_shard_range:
        description: T4 shards to run now, e.g. 0-9 (empty = every unfinished shard)
        required: false
        default: ''

concurrency:
  # A nightly run may take hours. If one is still going when the next fires,
  # the newer one waits rather than doubling the load on the same Mac.
  group: nightly-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # The wide parity tiers. pdflatex is the oracle and never runs in the product
  # path (tools/parity/README.md), but it does have to exist here, and no
  # GitHub-hosted image ships TeX Live -- installing it per run costs more than
  # the measurement. So this job is self-hosted only, and says so instead of
  # failing, when no self-hosted Mac is registered.
  #
  # DESIGN §9.3: never on a pull_request from a fork. This workflow has no
  # pull_request trigger, and the guard is here anyway so that adding one later
  # cannot quietly hand a fork a machine on the team's network.
  parity-corpus:
    name: parity scoreboard (arxiv + templates)
    if: >-
      vars.FLASHTEX_SELFHOSTED_MAC == '1' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64, flashtex]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/flashtex-cli
          key: parity-cli
      - name: pdflatex is the oracle and must be installed
        run: |
          set -euo pipefail
          command -v pdflatex >/dev/null || {
            echo "::error::no pdflatex on this runner; install TeX Live (MacTeX) -- see tools/parity/README.md"
            exit 1
          }
          pdflatex --version | head -1
      - name: build the flashtex CLI (release)
        run: |
          set -o pipefail
          cargo build --release --locked \
            --manifest-path crates/flashtex-cli/Cargo.toml --bin flashtex
      - name: fetch and verify the pinned corpora
        # corpus.py verifies every SHA-256 and sends at most one arXiv request
        # every 3 s. Third-party sources are never committed.
        run: |
          set -o pipefail
          python3 tools/parity/corpus.py fetch
      - name: run the tiers
        env:
          TIERS: ${{ github.event.inputs.parity_tiers || 'arxiv templates' }}
        run: |
          set -euo pipefail
          args=()
          for t in $TIERS; do args+=(--tier "$t"); done
          python3 tools/parity/parity.py "${args[@]}" -j 6 \
            --out "$RUNNER_TEMP/parity" --work "$RUNNER_TEMP/parity-work"
      - name: report
        if: always()
        run: |
          set -o pipefail
          [ -f "$RUNNER_TEMP/parity/report.md" ] || exit 0
          { echo "### Parity scoreboard (nightly)"; cat "$RUNNER_TEMP/parity/report.md"; } \
            >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-nightly
          path: ${{ runner.temp }}/parity
          if-no-files-found: ignore
          retention-days: 30

  # Say why, rather than leaving an empty run, when there is no self-hosted Mac.
  parity-corpus-unavailable:
    name: parity scoreboard (arxiv + templates)
    if: vars.FLASHTEX_SELFHOSTED_MAC != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "::notice::skipped: the wide parity tiers need a Mac with TeX Live."
          echo "Register a self-hosted runner (scripts/ci/install-selfhosted-runner.sh)" >> "$GITHUB_STEP_SUMMARY"
          echo "and set \`gh variable set FLASHTEX_SELFHOSTED_MAC --body 1\`." >> "$GITHUB_STEP_SUMMARY"

  # DESIGN §8 T4: ~5,000 version-pinned arXiv e-prints (tools/parity/corpus/
  # nightly-5k.json) plus the arxiv, templates and packages tiers, the new
  # engine (crates/flashtex-engine) against the pinned pdflatex OF THIS HOST.
  # tools/parity/nightly.py drives parity.py shard by shard; see
  # tools/parity/README.md "Nightly corpus (T4)".
  #
  # Host rules (DESIGN §8): expected data comes only from this runner's own
  # pdfTeX/pdflatex (TeX Live 2026), cached by source hash; nothing expected
  # is committed. The ratchet baseline lives on the runner and carries the
  # host's identity, which nightly.py derives from /etc/machine-id and the TeX
  # Live installation (no label is passed in). It is refused on any other
  # host, so it can never be seeded from a Mac, and nightly.py itself records
  # one only in a workflow_dispatch of main. The first run must be such a
  # dispatch with corpus_record_baseline; until then the ratchet step fails
  # and says so.
  #
  # State survives the per-job wipe of the work directory: sources, oracle
  # references and finished shards live under $HOME/.cache on the runner. A
  # run that stops (timeout, reboot) resumes at its first unfinished shard
  # when started again with the same engine, formats, harness, oracle and
  # manifests.
  #
  # DESIGN §9.3: schedule and workflow_dispatch only (this file has no
  # pull_request trigger), and the guard below repeats it. No GitHub-hosted
  # fallback: with the switch off the job is skipped; with it on and the PC
  # offline, the job waits in the queue.
  corpus-t4:
    name: T4 nightly corpus (NixOS PC)
    if: >-
      vars.FLASHTEX_SELFHOSTED_MAC == '1' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Linux, X64, flashtex-linux]
    timeout-minutes: 1440
    concurrency:
      group: nightly-corpus-t4
      cancel-in-progress: false
    env:
      # a baseline is recorded only by hand, and only from main's engine
      RECORD: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.corpus_record_baseline && '1' || '0' }}
      SHARDS: ${{ inputs.corpus_shards || '50' }}
      SHARD_RANGE: ${{ inputs.corpus_shard_range || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: the oracle (this host's TeX Live 2026) and the persistent state
        run: |
          set -euo pipefail
          for t in pdflatex pdftex kpsewhich qpdf pdftoppm; do
            command -v "$t" >/dev/null || { echo "::error::no $t on this runner's PATH (TeX Live 2026 and the Nix profile)"; exit 1; }
          done
          pdftex --version | head -1 | grep -q '1\.40\.29' || { echo "::error::the oracle is not pdfTeX 1.40.29: $(pdftex --version | head -1)"; exit 1; }
          state="$HOME/.cache/flashtex-nightly"
          mkdir -p "$state"
          {
            echo "FLASHTEX_NIGHTLY_HOME=$state"
            echo "FLASHTEX_PARITY_CACHE=$HOME/.cache/flashtex-parity"
            echo "CARGO_TARGET_DIR=$state/target"
            echo "PARITY_TEXBIN=$(dirname "$(command -v pdflatex)")"
            echo "PARITY_ORACLE=$(command -v pdftex)"
            echo "PARITY_TEXMF=$(kpsewhich -var-value TEXMFDIST)"
            echo "PARITY_TLPDB=$(kpsewhich -var-value SELFAUTOPARENT)/tlpkg/texlive.tlpdb"
          } | tee -a "$GITHUB_ENV"
          df -h "$HOME" | tail -1
      - name: build the new engine and its formats
        run: |
          set -euo pipefail
          cargo build --release --locked -p flashtex-engine --bin flashtex-initex
          bin="$CARGO_TARGET_DIR/release/flashtex-initex"
          # Formats and pool at a path that does not depend on the runner
          # instance, named by what they are built from: the engine, the pool
          # and this TeX Live (its package database). A new engine, pool or
          # tlmgr update builds new formats; the same inputs reuse them, so a
          # resumed run keeps its key. nightly.py hashes their contents too.
          sum="$(cat "$bin" crates/flashtex-engine/pdftex.pool "$PARITY_TLPDB" | sha256sum | cut -c1-16)"
          fmt="$FLASHTEX_NIGHTLY_HOME/engines/$sum"
          if [ ! -f "$fmt/done" ]; then
            rm -rf "$fmt" && mkdir -p "$fmt"
            cp "$bin" "$fmt/flashtex-initex"
            cp crates/flashtex-engine/pdftex.pool "$fmt/pdftex.pool"
            python3 tools/parity/nightly.py make-formats \
              --engine "$fmt/flashtex-initex" --pool "$fmt/pdftex.pool" --out "$fmt"
            touch "$fmt/done"
          fi
          echo "ENGINE_DIR=$fmt" >> "$GITHUB_ENV"
      - name: score every unfinished shard
        # exit 4: some shards unfinished (the deadline, or a harness failure);
        # the artifact still says how far it got, and the next run resumes.
        #
        # Memory is bounded, not hoped for. A traced log is stopped at 512 MiB
        # and never read over it (P-T1 then reads "not evaluated"; e-prints
        # trace to 25 GB). At most 2 documents are traced at once, whatever
        # -j is. The bound is 8 workers x 1 GiB + 2 traced x 9 x 0.5 GiB =
        # 17 GiB, where 9 is parity.PT1_MEMORY_FACTOR, measured. nightly.py
        # refuses to start when that bound is over 70% of the memory this PC
        # has available at the start of the job (other runner instances share it).
        run: |
          set -euo pipefail
          budget="$(awk '/^MemAvailable:/ { printf "%.1f", $2 * 0.7 / 1048576 }' /proc/meminfo)"
          python3 tools/parity/nightly.py run --shards "$SHARDS" \
            ${SHARD_RANGE:+--shard-range "$SHARD_RANGE"} \
            --tier nightly-5k --tier arxiv --tier templates --tier packages \
            --pt1-sample nightly-5k=0.05 --pt1-max-log-mb 512 --pt1-jobs 2 --memory-budget-gib "$budget" \
            --engine "$ENGINE_DIR/flashtex-initex" \
            --engine-env "FLASHTEX_FORMATS=$ENGINE_DIR" --engine-env "FLASHTEX_POOL=$ENGINE_DIR/pdftex.pool" \
            --texbin "$PARITY_TEXBIN" --oracle-pdftex "$PARITY_ORACLE" \
            -j 8 --deadline-minutes 1320 --out "$RUNNER_TEMP/corpus-t4" \
            -- --texmf "$PARITY_TEXMF"
      - name: ratchet against this host's baseline
        # also after an unfinished run: the documents it did score are held
        if: always()
        run: |
          set -euo pipefail
          # no summary: an earlier step failed, and the job has failed with it
          [ -f "$RUNNER_TEMP/corpus-t4/summary.json" ] || exit 0
          if [ "$RECORD" = 1 ]; then
            python3 tools/parity/nightly.py ratchet --results "$RUNNER_TEMP/corpus-t4" || true
            python3 tools/parity/nightly.py ratchet --results "$RUNNER_TEMP/corpus-t4" --record
          else
            python3 tools/parity/nightly.py ratchet --results "$RUNNER_TEMP/corpus-t4"
          fi
      - name: report
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/corpus-t4/summary.md" ] || exit 0
          cat "$RUNNER_TEMP/corpus-t4/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-t4
          # summary.md/json, documents.json (one small record per document),
          # ratchet.json, baseline.json when recorded; never logs
          path: ${{ runner.temp }}/corpus-t4
          if-no-files-found: ignore
          retention-days: 30

  # ci.yml tests the release profile. Nothing tests debug, which is the profile
  # with `debug_assert!` and integer-overflow checks turned on -- so an
  # overflow the release build wraps silently is only caught here.
  workspace-debug:
    name: workspace, debug profile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      FLASHTEX_FONT_DIRS: ${{ github.workspace }}/apps/mac/Fonts
      FLASHTEX_TFM_DIRS: ${{ github.workspace }}/apps/mac/Fonts/texmf/fonts/tfm/public/lm:${{ github.workspace }}/apps/mac/Fonts/texmf/fonts/tfm/jknappen/ec:${{ github.workspace }}/apps/mac/Fonts/texmf/fonts/tfm/public/amsfonts/symbols
      FLASHTEX_LM_DIR: ${{ github.workspace }}/apps/mac/Fonts
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: workspace-debug
      - name: Read the test-exclusion list
        run: |
          set -euo pipefail
          list="$(sed -e 's/#.*//' scripts/rust-test-exclude.txt | tr '[:space:]' ' ' | tr -s ' ')"
          echo "RUST_TEST_EXCLUDE=$list" >> "$GITHUB_ENV"
      - run: cargo build --workspace --all-targets --locked
      - name: cargo test --workspace (debug)
        run: |
          set -euo pipefail
          excludes=()
          for p in $RUST_TEST_EXCLUDE; do excludes+=(--exclude "$p"); done
          cargo test --workspace --locked --no-fail-fast ${excludes[@]+"${excludes[@]}"}
      - name: the two standalone crates (debug)
        run: |
          set -euo pipefail
          for c in render-pipeline flashtex-cli; do
            ( cd "crates/$c" && cargo build --locked && cargo test --locked --no-fail-fast )
          done

  # The crates whose tests are temporarily not gating. ci.yml runs these too,
  # but only inside the full tier; here they get a run of their own every night,
  # so "it passes again, delete its line" is noticed within a day.
  excluded-crates:
    name: excluded crates (not gating)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FLASHTEX_FONT_DIRS: ${{ github.workspace }}/apps/mac/Fonts
      FLASHTEX_TFM_DIRS: ${{ github.workspace }}/apps/mac/Fonts/texmf/fonts/tfm/public/lm:${{ github.workspace }}/apps/mac/Fonts/texmf/fonts/tfm/jknappen/ec:${{ github.workspace }}/apps/mac/Fonts/texmf/fonts/tfm/public/amsfonts/symbols
      FLASHTEX_LM_DIR: ${{ github.workspace }}/apps/mac/Fonts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: workspace
      - name: run them anyway and report
        run: |
          set -uo pipefail
          list="$(sed -e 's/#.*//' scripts/rust-test-exclude.txt | tr '[:space:]' ' ' | tr -s ' ')"
          echo "### Excluded crates" >> "$GITHUB_STEP_SUMMARY"
          [ -n "${list// /}" ] || { echo "the exclusion list is empty" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          for p in $list; do
            if cargo test --release --locked --no-fail-fast -p "$p"; then
              echo "::warning::$p passes now; remove it from scripts/rust-test-exclude.txt and close its issue"
              echo "- \`$p\`: **passes**; remove its line" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- \`$p\`: still failing (expected while its issue is open)" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

  # The clippy debt list, same idea: every night, so the list shrinking is a
  # visible fact rather than something someone has to go and measure.
  clippy-debt:
    name: clippy debt (not gating)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: workspace-debug
      - name: which listed crates pass now
        run: |
          set -uo pipefail
          list="$(sed -e 's/#.*//' scripts/clippy-debt.txt | tr '[:space:]' ' ' | tr -s ' ')"
          {
            echo "### clippy debt (scripts/clippy-debt.txt)"
            echo "| crate | \`-D warnings\` |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for p in $list; do
            case "$p" in
              flashtex-render-pipeline) dir=crates/render-pipeline ;;
              flashtex-cli) dir=crates/flashtex-cli ;;
              flashtex-perf-bench) dir=crates/perf-bench ;;
              *) dir="" ;;
            esac
            if [ -n "$dir" ]; then
              ( cd "$dir" && cargo clippy --all-targets --no-deps --locked -- -D warnings ) >/dev/null 2>&1 && r=pass || r=fail
            else
              cargo clippy -p "$p" --all-targets --no-deps --locked -- -D warnings >/dev/null 2>&1 && r=pass || r=fail
            fi
            if [ "$r" = pass ]; then
              echo "::warning::clippy now passes for $p; delete its line from scripts/clippy-debt.txt"
              echo "| \`$p\` | **passes -- delete its line** |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| \`$p\` | still failing |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
