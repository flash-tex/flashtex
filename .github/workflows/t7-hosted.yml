# THROWAWAY (lane FANCYHDR, #1927): letter@x2-late on a hosted M1, engines built from the SHAs
# below on the same VM in the same job, one after the other. Not for main; this branch carries no
# other workflow so that its push runs nothing else.
name: t7-hosted

on:
  push:
    branches: ["t7-hosted/**"]

permissions:
  contents: read

concurrency:
  group: t7-hosted-x2late-${{ github.sha }}
  cancel-in-progress: false

env:
  # NAME=SHA pairs, measured in this order
  ENGINES: "main=ba71bf940ab307b9be515514c4fd0f4cfdb1f631 pr1927=1f3f3b1180add3997ba0503f26ab0b108bc8a2b7"
  INCR_BENCH_DIR: /tmp/ib
  CARGO_TARGET_DIR: /tmp/tgt
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  CARGO_TERM_COLOR: never

jobs:
  x2late:
    name: letter@x2-late (hosted M1, relative)
    runs-on: macos-15
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: TeX Live 2026 (MacTeX 2026, mactex-no-gui)
        run: |
          set -euo pipefail
          brew install --cask mactex-no-gui >/dev/null
          echo /Library/TeX/texbin >> "$GITHUB_PATH"
          export PATH=/Library/TeX/texbin:$PATH
          pdftex --version | head -1
          kpsewhich pdflatex.ini
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: /tmp/ib/cache
          key: t7-hosted-books-${{ hashFiles('tools/parity/corpus/books.json') }}
      - name: build each engine (one target dir, one after the other)
        run: |
          set -euo pipefail
          for pair in $ENGINES; do
            name=${pair%%=*}; sha=${pair#*=}
            git worktree add --detach "/tmp/w-$name" "$sha"
            (cd "/tmp/w-$name" && cargo build --release -p flashtex-engine -p flashtex-display-list 2>&1 | tail -3)
            "/tmp/w-$name/tools/incr-bench/mkeng.sh" "$name"
            cat "$INCR_BENCH_DIR/$name/HEAD"
          done
      - name: the book
        run: python3 tools/incr-bench/mkbook.py infdesc-x2
      - name: letter@x2-late on each engine
        env:
          X2_OUT: ${{ runner.temp }}/x2-out
        run: |
          set -euo pipefail
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          names=""
          for pair in $ENGINES; do names="$names ${pair%%=*}"; done
          python3 tools/incr-bench/x2late.py $names | tee "$RUNNER_TEMP/x2-table.md"
          { echo "### letter@x2-late, hosted M1 (same VM, same job)"; echo; cat "$RUNNER_TEMP/x2-table.md"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x2late-${{ github.run_id }}
          path: ${{ runner.temp }}/x2-out
          if-no-files-found: ignore
          retention-days: 14
