# MEASUREMENT ONLY (lane TYPING-50MS, not for merge): T7's x2-late rows (PR #1889's harness) on a
# GitHub-hosted Apple-Silicon VM (Apple M1 (Virtual), 3 vCPU), for this branch's host ("change") and
# for main's incr.rs at the branch's base ("main"), one VM each.
#
#   gh workflow run t7-hosted.yml --ref agent/kabir-claude-typing50/m1-measure -f ref=agent/kabir-claude-typing50/m1-measure
name: t7-hosted

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "branch, tag or SHA to measure"
        required: true
        default: main
      docs:
        description: "unused here"
        required: false
        default: ""
      quick:
        description: "unused here"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  REF: ${{ inputs.ref }}
  INCR_BENCH_DIR: /tmp/fth-realdoc
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  CARGO_TERM_COLOR: never

jobs:
  t7:
    name: x2-late rows (hosted M1, ${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        host: [change, main]
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
          fetch-depth: 0
          persist-credentials: false
      - name: main's host (the branch's base)
        if: matrix.host == 'main'
        run: git checkout df75c3a20 -- crates/flashtex-engine/src/incr.rs crates/flashtex-engine/src/host/resident.rs crates/flashtex-engine/src/host/tools.rs crates/flashtex-engine/tests/host_incremental.rs
      - name: Install BasicTeX and the packages Infinite Descent loads
        run: |
          set -euo pipefail
          brew install --cask basictex
          echo /Library/TeX/texbin >> "$GITHUB_PATH"
          export PATH="/Library/TeX/texbin:$PATH"
          want=()
          while read -r p; do [[ -n "$p" && "$p" != \#* ]] && want+=("$p"); done < scripts/ci/realdoc-texlive-packages.txt
          for attempt in 1 2 3 4; do
            sudo tlmgr update --self || { sleep 5; continue; }
            have="$(tlmgr info --only-installed --data name 2>/dev/null)"
            pkgs=()
            for p in "${want[@]}"; do grep -qx "$p" <<<"$have" || pkgs+=("$p"); done
            echo "installing ${#pkgs[@]} of ${#want[@]} packages"
            [ ${#pkgs[@]} = 0 ] && break
            sudo tlmgr install "${pkgs[@]}" && break
            [ "$attempt" = 4 ] && exit 1
            sleep 5
          done
          kpsewhich pdflatex.ini
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: /tmp/fth-realdoc/cache
          key: realdoc-books-${{ hashFiles('tools/parity/corpus/books.json') }}
      - name: build
        run: |
          set -euo pipefail
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.perflevel0.physicalcpu hw.perflevel1.physicalcpu || true
          cargo build --release -p flashtex-engine -p flashtex-display-list
          tools/incr-bench/mkeng.sh m1
          python3 tools/incr-bench/mkbook.py infdesc-x2 >/dev/null
      - name: t7 x2-late rows
        run: |
          set +e
          for i in 1; do
            python3 tools/incr-bench/t7.py --engine m1 --docs infdesc-x2 --sites x2-late --gate hosted --keys 8 \
              --typing-keys 16 --phases letter@site,typing@50ms@site,typing@100ms@site,typing@150ms@site \
              --out /tmp/fth-realdoc/t7-out-$i 2>&1 | tee /tmp/fth-realdoc/t7-$i.log
            cat /tmp/fth-realdoc/t7-out-$i/table.md >> "$GITHUB_STEP_SUMMARY" || true
          done
          exit 0
      - name: profile the host while it types (sample)
        run: |
          set +e
          python3 tools/incr-bench/t7.py --engine m1 --docs infdesc-x2 --sites x2-late --gate hosted \
            --typing-keys 40 --phases typing@100ms@site,typing@150ms@site \
            --out /tmp/fth-realdoc/t7-prof > /tmp/fth-realdoc/t7-prof.log 2>&1 &
          until pgrep -f "fth-realdoc/m1/dl3-keys" >/dev/null; do sleep 1; done
          pid=$(pgrep -f "fth-realdoc/m1/flashtex-host" | head -1)
          /usr/bin/sample "$pid" 600 1 -file /tmp/fth-realdoc/host.sample >/dev/null 2>&1
          wait
          ls -la /tmp/fth-realdoc/host.sample
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t7-x2late-${{ matrix.host }}
          path: |
            /tmp/fth-realdoc/t7-out-*
            /tmp/fth-realdoc/t7-*.log
            /tmp/fth-realdoc/t7-prof
            /tmp/fth-realdoc/host.sample
