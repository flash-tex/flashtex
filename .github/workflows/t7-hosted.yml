# MEASUREMENT ONLY (lane TYPING-50MS, not for merge): T7's x2-late rows (PR #1889's harness) on ONE
# GitHub-hosted Apple-Silicon VM (Apple M1 (Virtual), 3 vCPU), three hosts built on it and run
# interleaved, so that the VM's speed is the same for all (see ENGINES below).
# branch. The typist (dl3-keys) is this branch's for all three.
#
#   gh workflow run t7-hosted.yml --ref agent/kabir-claude-typing50/m1-measure -f ref=agent/kabir-claude-typing50/m1-measure
name: t7-hosted

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "branch, tag or SHA to measure"
        required: true
        default: main
      docs:
        description: "unused here"
        required: false
        default: ""
      quick:
        description: "unused here"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  REF: ${{ inputs.ref }}
  INCR_BENCH_DIR: /tmp/fth-realdoc
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  CARGO_TERM_COLOR: never

jobs:
  t7:
    name: x2-late rows, three hosts on one hosted M1
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install BasicTeX and the packages Infinite Descent loads
        run: |
          set -euo pipefail
          brew install --cask basictex
          echo /Library/TeX/texbin >> "$GITHUB_PATH"
          export PATH="/Library/TeX/texbin:$PATH"
          want=()
          while read -r p; do [[ -n "$p" && "$p" != \#* ]] && want+=("$p"); done < scripts/ci/realdoc-texlive-packages.txt
          for attempt in 1 2 3 4; do
            sudo tlmgr update --self || { sleep 5; continue; }
            have="$(tlmgr info --only-installed --data name 2>/dev/null)"
            pkgs=()
            for p in "${want[@]}"; do grep -qx "$p" <<<"$have" || pkgs+=("$p"); done
            echo "installing ${#pkgs[@]} of ${#want[@]} packages"
            [ ${#pkgs[@]} = 0 ] && break
            sudo tlmgr install "${pkgs[@]}" && break
            [ "$attempt" = 4 ] && exit 1
            sleep 5
          done
          kpsewhich pdflatex.ini
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: /tmp/fth-realdoc/cache
          key: realdoc-books-${{ hashFiles('tools/parity/corpus/books.json') }}
      - name: build the hosts (engine and runtime sources of each SHA in ENGINES)
        env:
          ENGINES: "inst=9b8d93e921ae68195a266d7c2e4f3bd68aa69e99 move=bc9be1d6343828344da8fb415ef038ba7b7e2d6f"
        run: |
          set -euo pipefail
          sysctl -n machdep.cpu.brand_string hw.ncpu || true
          for e in $ENGINES; do
            git checkout "${e#*=}" -- crates/flashtex-engine/src crates/flashtex-runtime/src
            cargo build --release -p flashtex-engine -p flashtex-display-list
            tools/incr-bench/mkeng.sh "${e%%=*}"
          done
          git checkout HEAD -- crates/flashtex-engine/src crates/flashtex-runtime/src
          python3 tools/incr-bench/mkbook.py infdesc-x2 >/dev/null
      - name: t7 x2-late rows, interleaved (inst = #1959 with every restore in DONE; move = the lazy moves)
        run: |
          set +e
          for i in 1 2; do
            for e in inst move; do
              python3 tools/incr-bench/t7.py --engine $e --docs infdesc-x2 --sites x2-late --gate hosted --keys 8 \
                --typing-keys 16 --phases letter@site,typing@50ms@site,typing@100ms@site,typing@150ms@site \
                --out /tmp/fth-realdoc/t7-$e-$i 2>&1 | tee /tmp/fth-realdoc/t7-$e-$i.log
              { echo "### $e round $i"; cat /tmp/fth-realdoc/t7-$e-$i/table.md; } >> "$GITHUB_STEP_SUMMARY" || true
            done
          done
          exit 0
      - name: t7 typing@50ms with the engine's debug log (move)
        run: |
          set +e
          FLASHTEX_INCR_DEBUG=1 python3 tools/incr-bench/t7.py --engine move --docs infdesc-x2 --sites x2-late --gate hosted \
            --typing-keys 16 --phases typing@50ms@site --out /tmp/fth-realdoc/t7-dbg 2>&1 | tail -5
          ls -la /tmp/fth-realdoc/t7-dbg/raw/
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t7-x2late-restores
          path: |
            /tmp/fth-realdoc/t7-*
