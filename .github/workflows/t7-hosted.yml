# MEASUREMENT ONLY (lane TYPING-50MS, 2026-11-08, not for merge): how far main is from DESIGN.md
# §1.2's typing target (keys 50 ms apart, every key painted by its own compile, <= 20 ms), on ONE
# GitHub-hosted Apple-Silicon VM (Apple M1 (Virtual), 3 vCPU). Two hosts are built on it and run
# interleaved, so the VM's speed is the same for both: main (6e66beddf) and all = main plus #1959,
# #2042 and #2001 (this branch's head). The typist (dl3-keys) is this branch's for both.
#
#   gh workflow run t7-hosted.yml --ref agent/kabir-claude-typing50/m1-measure-1108 -f ref=agent/kabir-claude-typing50/m1-measure-1108
name: t7-hosted

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "branch, tag or SHA to measure"
        required: true
        default: main
      docs:
        description: "unused here"
        required: false
        default: ""
      quick:
        description: "unused here"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  REF: ${{ inputs.ref }}
  INCR_BENCH_DIR: /tmp/ib
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  CARGO_TERM_COLOR: never

jobs:
  t7:
    name: typing@50ms rows under each process policy, one hosted M1
    runs-on: macos-15
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install BasicTeX and the packages Infinite Descent loads
        run: |
          set -euo pipefail
          brew install --cask basictex
          echo /Library/TeX/texbin >> "$GITHUB_PATH"
          export PATH="/Library/TeX/texbin:$PATH"
          want=()
          while read -r p; do [[ -n "$p" && "$p" != \#* ]] && want+=("$p"); done < scripts/ci/realdoc-texlive-packages.txt
          for attempt in 1 2 3 4; do
            sudo tlmgr update --self || { sleep 5; continue; }
            have="$(tlmgr info --only-installed --data name 2>/dev/null)"
            pkgs=()
            for p in "${want[@]}"; do grep -qx "$p" <<<"$have" || pkgs+=("$p"); done
            echo "installing ${#pkgs[@]} of ${#want[@]} packages"
            [ ${#pkgs[@]} = 0 ] && break
            sudo tlmgr install "${pkgs[@]}" && break
            [ "$attempt" = 4 ] && exit 1
            sleep 5
          done
          kpsewhich pdflatex.ini
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: /tmp/ib/cache
          key: realdoc-books-${{ hashFiles('tools/parity/corpus/books.json') }}
      - name: build the hosts (engine and runtime sources of each SHA in ENGINES)
        env:
          ENGINES: "all=HEAD"
        run: |
          set -euo pipefail
          sysctl -n machdep.cpu.brand_string hw.ncpu || true
          head=$(git rev-parse HEAD)
          for e in $ENGINES; do
            sha="${e#*=}"; [ "$sha" = HEAD ] && sha=$head
            git checkout "$sha" -- crates/flashtex-engine/src crates/flashtex-runtime/src
            cargo build --release -p flashtex-engine -p flashtex-display-list
            tools/incr-bench/mkeng.sh "${e%%=*}"
          done
          git checkout HEAD -- crates/flashtex-engine/src crates/flashtex-runtime/src
          python3 tools/incr-bench/mkbook.py infdesc-x2 >/dev/null
      - name: the runner's process policy, and how late a 50 ms sleep wakes under each
        run: |
          set +e
          ps -o pid,ppid,pri,nice,command -p $$ -p $PPID
          python3 tools/incr-bench/timerprobe.py 40 plain
          taskpolicy -l 0 -t 0 python3 tools/incr-bench/timerprobe.py 40 "latency tier 0"
          taskpolicy -a python3 tools/incr-bench/timerprobe.py 40 "app policy (-a)"
          taskpolicy -B -p $$; python3 tools/incr-bench/timerprobe.py 40 "after -B on the shell"
          exit 0
      - name: t7 typing@50ms rows (all) under each process policy, interleaved
        run: |
          set +e
          for i in 1 2; do
            for pol in plain lat0 app; do
              case $pol in plain) pre=() ;; lat0) pre=(taskpolicy -l 0 -t 0) ;; app) pre=(taskpolicy -a) ;; esac
              "${pre[@]}" python3 tools/incr-bench/t7.py --engine all --docs infdesc-x2 --sites x1-early,x2-late --gate hosted \
                --typing-keys 24 --phases typing@50ms@site \
                --out /tmp/ib/t7-$pol-$i-book 2>&1 | tee /tmp/ib/t7-$pol-$i-book.log
              { echo "### all, $pol, round $i, infdesc-x2"; cat /tmp/ib/t7-$pol-$i-book/table.md; } >> "$GITHUB_STEP_SUMMARY" || true
              "${pre[@]}" python3 tools/incr-bench/t7.py --engine all --docs plain-1000,beamer-30 --gate hosted \
                --typing-keys 24 --phases typing@50ms \
                --out /tmp/ib/t7-$pol-$i-gen 2>&1 | tee /tmp/ib/t7-$pol-$i-gen.log
              { echo "### all, $pol, round $i, generated"; cat /tmp/ib/t7-$pol-$i-gen/table.md; } >> "$GITHUB_STEP_SUMMARY" || true
            done
          done
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t7-typing50-1108-policy
          path: |
            /tmp/ib/t7-*
