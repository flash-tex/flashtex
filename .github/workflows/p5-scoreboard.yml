# The P5 scoreboard (docs/design/engine-v2/DESIGN.md §12 P5 and §8): the new
# engine against v1 on every tier, pdflatex as the oracle, nightly on ONE
# official host, the owner's NixOS PC (see WHERE below).
# tools/parity/scoreboard-run.sh does the work; this file only schedules it,
# publishes what it writes, and gates on it:
#
#   * the one table (scoreboard.md + scoreboard.json) and every harness log as
#     the artifact `p5-scoreboard`, and the table in the run summary;
#   * a short summary committed to the branch `p5-scoreboard-summary`
#     (SUMMARY.md, plus reports/<date>.{md,json}); main is never written;
#   * THE GATE (P5-BOARD-T4): one issue per red tier, labelled `p5-red`, opened
#     or updated by the run and closed by it once the tier recovers (marker
#     `p5-scoreboard:tier=` in the body; tools/parity/scoreboard.py --issues). A
#     tier is red when the new engine is behind v1, or below a target or the
#     owner's bar (DESIGN §13 2026-10-05: P-T2 >= 99 % and P-T1 >= 98 % on
#     arXiv and T4, zero crashes on T4; scoreboard.py OWNER_BAR). Then the run
#     itself fails unless the whole board is green (complete, every row green):
#     a missing or partial tier fails the run without an issue;
#
# THREE JOBS, so no write token is ever near third-party sources. pdflatex and
# both engines run arXiv e-prints and TeX Live documents, and a TeX document
# can read any file the process can (\openin; TeX Live's openin_any is `a`).
#   pick        (ubuntu-latest, actions: read) chooses the route (WHERE below)
#               and the T4 run of that route's oracle the board uses;
#   scoreboard  (the NixOS PC or a Mac, contents: read + actions: read) builds
#               and measures. Its checkout keeps no credentials, and the token is
#               only in the environment of the one step that downloads the
#               T4 artifacts, which runs before any TeX does;
#   publish     (ubuntu-latest, contents: write + issues: write) runs no TeX: it
#               takes the artifact, files the issues and pushes the summary,
#               with the token scoped to those two steps.
#
# T4 (the 5k corpus) is not re-run here: it takes most of a night on its own.
# ONE ORACLE PER BOARD (DESIGN §8): its rows come from a T4 run measured on the
# board's own host, against the same TeX Live:
#   route pc   the artifacts `corpus-t4` (new engine) and `corpus-t4-v1` (v1)
#              of nightly.yml's corpus-t4 job (#1276), uploaded in the last 36 h;
#   route mac  the artifact `corpus-t4-mac` of corpus-t4-mac.yml (P5-T4-MAC),
#              uploaded in the last 7 days. That workflow uploads it under this
#              name only once all 50 shards are done (a cycle takes more than
#              one night on the Mac, at one pinned commit), so the board picks
#              the newest COMPLETE Mac T4.
# The newest such artifact of this repository's own schedule or dispatch run
# of that workflow on main is used (never a pull request's or a fork's: the
# board builds its commit on a self-hosted runner, DESIGN §9.3; the rules are
# in scripts/ci/p5-pick-t4.sh), and the WHOLE board is then measured at the
# commit its summary records, which must be a commit of main (checked even
# when it is the run's own), so every tier is at one SHA. (The engine is that
# commit's; the harness and the board, tools/, are this workflow's own commit.) scoreboard.py
# checks the commit, the engine binary sha256 and the oracle each T4 summary
# records against the board's own (the oracle down to its texlive.tlpdb and
# pdftex sha256, from oracle_provenance.py: the version string is the same on
# both hosts) and marks any mismatch INVALID, and a run with missing shards or
# documents partial. With no such artifact the board is measured at this
# workflow's commit and the T4 rows read "missing" (stale): never green.
#
# WHERE (the `route`, chosen by the pick job and read by every other job).
# The official board is the NixOS PC's (P5-BOARD-T4, 2026-10-05: one host, one
# oracle, so boards compare night to night; a heavy hosted Mac carried it for
# three days and ran out of disk). `auto` (every scheduled run) is the PC when
# its switch is on, and nothing otherwise: never a silent Mac stand-in.
#   pc: FLASHTEX_SELFHOSTED_LINUX = 1 (unset: FLASHTEX_SELFHOSTED_MAC stands in)
#     the NixOS PC, [self-hosted, Linux, X64, flashtex-linux]. Its runners are
#     user services in `flashtex.slice` (MemoryMax 20G, no swap, CPUQuota 800 %,
#     shared with agents' runs, DESIGN §13 2026-10-05), and the board runs in a
#     scope of its own inside that slice (MemoryMax 8G, nice 10), and never
#     beside a T4 night: both take the concurrency group `flashtex-pc-heavy`.
#     Its TeX Live has no doc files, so the templates and packages tiers read
#     their pinned documents from ~/.cache/flashtex-corpus-texmf/texlive-2026
#     (tools/parity/README.md, "The board's host"); a forced `pc` while the PC
#     is off waits in the queue;
#   mac: only when a manual run names it, on main: NOT OFFICIAL. It files no
#     issue, does not gate, and writes reports/<date>-mac.* but not SUMMARY.md;
#     the heavy self-hosted Mac, [self-hosted, macOS, ARM64, flashtex,
#     flashtex-heavy] (mac-m1max-a-2; mac-m1max-a-1 stays general and serves
#     the merge queue), with MacTeX 2026 as the oracle. Its T4 is the Mac's
#     own (corpus-t4-mac.yml, above); the PC's would mix two oracles. The
#     Mac job also takes the cross-workflow group
#     `flashtex-mac-heavy` (shared with nightly.yml's templates leg and
#     engine-nightly-mac, which nightly chains so it adds one pending job at a
#     time): one heavy job at a time on the heavy runner. A manual run entering
#     that group while one is pending cancels the pending one (GitHub keeps
#     one);
#   else the `unavailable` job below, which fails: not measured is not green.
# The publish job names its reports from the route the board ran on, not from
# the switches when it starts (a switch flipped during a 5 h board would have
# filed a Mac board under the PC's names).
# Both trees call themselves "pdfTeX 1.40.29 (TeX Live 2026)" but they are
# different snapshots, so every board names its oracle down to texlive.tlpdb
# (tools/parity/oracle_provenance.py: in the host label, the run summary and
# ORACLE.md), and a Mac board's reports carry a `-mac` suffix on the summary
# branch. Compare boards only across the same oracle (DESIGN §8).
# T4 runs the new engine only. Its old column is the committed one-off v1
# measurement, tools/parity/baselines/t4-v1-oneoff.json (decision 1, ruled
# 2026-10-02: v1 is frozen by D13), which scoreboard.py reads by default; a
# `corpus-t4-v1` artifact, if a nightly ever uploads one, takes precedence.
name: p5-scoreboard

on:
  schedule:
    # After nightly.yml's corpus-t4 deadline (it starts 08:17 UTC and starts
    # no shard after 22 h), so the T4 artifacts are the newest ones.
    - cron: '47 6 * * *'
  workflow_dispatch:
    inputs:
      issues:
        description: 'tier issues: off, dry-run or apply'
        required: false
        default: apply
      limit:
        description: 'first N documents per parity tier (0 = every document; N > 0 is a sample, never green)'
        required: false
        default: '0'
      route:
        description: 'where the board runs: auto (the PC if its switch is on), pc (the NixOS PC, official) or mac (the heavy Mac, main only, unofficial)'
        type: choice
        options: [auto, pc, mac]
        required: false
        default: auto

concurrency:
  group: p5-scoreboard
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # the same build settings as nightly.yml's corpus-t4 job, so the engine
  # binary (and its sha256, which scoreboard.py compares) can be the same
  CARGO_INCREMENTAL: "0"

jobs:
  pick:
    name: pick the route and its T4 run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read    # the checkout of scripts/ci/p5-pick-t4.sh
      actions: read
    outputs:
      route: ${{ steps.pick.outputs.route }}
      id: ${{ steps.pick.outputs.id }}
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      # the workflow's own commit of main (trusted), for scripts/ci/p5-pick-t4.sh
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # the pick's own rules, against a fake gh, before they are trusted (seconds, no network)
      - name: the T4 pick's self-test
        run: scripts/tests/p5-pick-t4.test.sh
      - name: the route (see WHERE), then the T4 run of its oracle
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.route || 'auto' }}
          # the NixOS switch (ci.yml `plan`, selfhosted_linux; unset: the Mac switch stands in)
          LINUX_ON: ${{ (vars.FLASHTEX_SELFHOSTED_LINUX || vars.FLASHTEX_SELFHOSTED_MAC) == '1' }}
          MAC_ON: ${{ vars.FLASHTEX_SELFHOSTED_MAC == '1' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          case "$WANT" in
            pc) route=pc ;;
            mac)
              [ "$MAC_ON" = true ] || { echo "::error::route mac needs FLASHTEX_SELFHOSTED_MAC=1 and a run of main"; exit 1; }
              route=mac ;;
            auto)
              # the official host only (see WHERE): a Mac board is asked for by name
              if [ "$LINUX_ON" = true ]; then route=pc; else route=""; fi ;;
            *) echo "::error::route $WANT: expected auto, pc or mac"; exit 1 ;;
          esac
          echo "route=$route" >> "$GITHUB_OUTPUT"
          [ -n "$route" ] || exit 0  # scoreboard-unavailable says why
          # The board checks out and builds the commit this picks, on a self-hosted
          # runner: only this repository's own schedule/dispatch run of the route's
          # workflow on main qualifies, at a commit of main (always checked), never a
          # pull request's or a fork's (DESIGN §9.3). The rules and their tests:
          # scripts/ci/p5-pick-t4.sh, scripts/tests/p5-pick-t4.test.sh.
          scripts/ci/p5-pick-t4.sh "$route" "$GITHUB_OUTPUT"

  scoreboard:
    name: P5 scoreboard (new vs v1, every tier)
    needs: pick
    if: needs.pick.outputs.route != ''
    # the route pick chose (see WHERE)
    runs-on: ${{ needs.pick.outputs.route == 'pc' && fromJSON('["self-hosted","Linux","X64","flashtex-linux"]') || fromJSON('["self-hosted","macOS","ARM64","flashtex","flashtex-heavy"]') }}
    # One heavy job at a time per host: on the PC the board and nightly.yml's T4
    # share `flashtex-pc-heavy` (10-06: together beside the agents' runs they
    # pushed flashtex.slice to 86 % full memory pressure and GitHub dropped the
    # board, 37525986631); on a Mac, `flashtex-mac-heavy` across p5-scoreboard and
    # nightly on the flashtex-heavy runner (the general Mac serves the merge queue).
    concurrency:
      group: ${{ needs.pick.outputs.route == 'pc' && 'flashtex-pc-heavy' || 'flashtex-mac-heavy' }}
      cancel-in-progress: false
    # A Mac has fewer cores to spare (-j 2 beside the agents and the other
    # runner): the local subset on 2026-10-03 took up to 434 s per arXiv
    # document at load ~200, so the Mac gets 15 h; the PC keeps its 10 h.
    timeout-minutes: ${{ needs.pick.outputs.route == 'pc' && 600 || 900 }}
    permissions:
      contents: read
      actions: read     # the T4 artifacts (nightly.yml or corpus-t4-mac.yml)
    env:
      FLASHTEX_REQUIRE_TEXLIVE: "1"
      CARGO_BUILD_JOBS: "3"
      LIMIT: ${{ github.event.inputs.limit || '0' }}
      ROUTE: ${{ needs.pick.outputs.route == 'pc' && 'flashtex-linux' || 'mac' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # the T4 run's commit, so T4 and every tier measured here are one SHA
          ref: ${{ needs.pick.outputs.sha || github.sha }}
          persist-credentials: false
      # The ENGINE is the measured commit's (crates/, above); the HARNESS and the board
      # (tools/: the board driver, scoreboard.py, parity.py, ...) are this workflow's
      # own commit, so the board's rules are the ones this file was written for. With
      # the measured commit's tools, a board whose T4 run is a day older than the
      # workflow ran yesterday's board script (P5-BOARD-T4: its options, the owner's
      # bar and the T4 crash row did not exist there).
      - uses: actions/checkout@v4
        if: needs.pick.outputs.sha != '' && needs.pick.outputs.sha != github.sha
        with:
          ref: ${{ github.sha }}
          path: .board-tools
          sparse-checkout: tools
          persist-credentials: false
      - name: this workflow's tools over the measured commit's
        if: needs.pick.outputs.sha != '' && needs.pick.outputs.sha != github.sha
        run: |
          set -euo pipefail
          rm -rf tools && mv .board-tools/tools tools && rm -rf .board-tools
          echo "engine at ${{ needs.pick.outputs.sha }}; tools at $GITHUB_SHA"
      # Pinned, not @stable: the board compares its engine binary's sha256 with the
      # T4 run's, so p5-scoreboard.yml and both T4 jobs (nightly.yml corpus-t4,
      # corpus-t4-mac.yml) build with one rustc. Change all three together.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - name: this runner's build directory
        run: |
          set -euo pipefail
          if [ "$ROUTE" = mac ]; then
            # One directory for both Mac instances (the group above never runs
            # two heavy jobs at once), size-capped: the Macs are short of disk.
            scripts/ci/mac-heavy-target.sh >> "$GITHUB_ENV"
          else
            echo "CARGO_TARGET_DIR=$HOME/.cache/flashtex-ci/$RUNNER_NAME/target-p5-scoreboard" >> "$GITHUB_ENV"
          fi
      - name: pdflatex is the oracle and must be installed
        run: |
          set -euo pipefail
          command -v pdflatex >/dev/null || { echo "::error::no pdflatex on this runner (TeX Live 2026)"; exit 1; }
          pdftex --version | sed -n 1p
          command -v qpdf >/dev/null || { echo "::error::no qpdf: P-T2 cannot be measured"; exit 1; }
      - name: which oracle (DESIGN §8 provenance)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p5"
          id=$(python3 tools/parity/oracle_provenance.py \
                 --markdown "$RUNNER_TEMP/p5/ORACLE.md" --json "$RUNNER_TEMP/p5/oracle.json")
          echo "$id"
          echo "ORACLE_ID=$id" >> "$GITHUB_ENV"
      - name: T4 results of that run (before any TeX runs)
        if: needs.pick.outputs.id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          id: ${{ needs.pick.outputs.id }}
        run: |
          set -uo pipefail
          if [ "$ROUTE" = mac ]; then new=corpus-t4-mac old=""; else new=corpus-t4 old=corpus-t4-v1; fi
          gh run download "$id" --repo "$GITHUB_REPOSITORY" -n "$new" -D "$RUNNER_TEMP/t4-new" ||
            echo "::notice::run $id has no $new artifact: T4 (new) reads missing"
          if [ -n "$old" ]; then
            gh run download "$id" --repo "$GITHUB_REPOSITORY" -n "$old" -D "$RUNNER_TEMP/t4-old" ||
              echo "::notice::run $id has no $old artifact: T4 (old) is the v1 one-off baseline (decision 1)"
          fi
      - name: every tier, both engines, then the board (no token in this step)
        # scoreboard-run.sh passes the oracle.json written above to scoreboard.py
        # --oracle: a T4 run measured against any other oracle reads INVALID
        run: |
          set -euo pipefail
          extra=()
          wrap=()
          if [ "$LIMIT" != "0" ]; then extra+=(--limit "$LIMIT" --sample-note "workflow_dispatch limit=$LIMIT"); fi
          if [ "$ROUTE" != mac ]; then
            # the TeX Live tiers' pinned documents: this PC's TeX Live has no doc files
            docs="$HOME/.cache/flashtex-corpus-texmf/texlive-2026"
            if [ -d "$docs" ]; then extra+=(--corpus-texmf "$docs")
            else echo "::warning::no $docs on this PC: the templates and packages tiers read partial (tools/parity/README.md)"; fi
            # a scope of its own inside flashtex.slice (see WHERE)
            # OOMPolicy=continue: an OOM kill takes its victim only (parity.py records a
            # worker_died document), not the whole scope (systemd's default is stop).
            # No scope, no run: never unbounded in the runner's own cgroup.
            scope=(systemd-run --user --scope --quiet --slice=flashtex.slice -p MemoryMax=8G -p MemoryHigh=7G -p MemorySwapMax=0 -p OOMPolicy=continue)
            if "${scope[@]}" true 2>/dev/null; then wrap=("${scope[@]}" nice -n 10)
            else echo "::error::systemd-run --user is unavailable: the official board runs only in its own scope (see WHERE)"; exit 1; fi
          fi
          ${wrap[@]+"${wrap[@]}"} tools/parity/scoreboard-run.sh --out "$RUNNER_TEMP/p5" --jobs 2 \
            --t4-new "$RUNNER_TEMP/t4-new" --t4-old "$RUNNER_TEMP/t4-old" ${extra[@]+"${extra[@]}"} -- \
            --host-label "$RUNNER_NAME ($ROUTE; $ORACLE_ID; tools ${GITHUB_SHA::9})" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --summary "$RUNNER_TEMP/p5/SUMMARY.md" --issues off
      - name: report
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/p5/ORACLE.md" ] && cat "$RUNNER_TEMP/p5/ORACLE.md" >> "$GITHUB_STEP_SUMMARY"
          [ -f "$RUNNER_TEMP/p5/board/scoreboard.md" ] || exit 0
          cat "$RUNNER_TEMP/p5/board/scoreboard.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p5-scoreboard
          path: |
            ${{ runner.temp }}/p5
            !${{ runner.temp }}/p5/work
          if-no-files-found: ignore
          retention-days: 30
      # The runner empties _temp only when its next job starts; the artifact
      # holds what the board keeps, so free the disk now (scoreboard-run.sh
      # has already removed its work directory).
      - name: free this runner's disk
        if: always()
        run: rm -rf "$RUNNER_TEMP/p5" "$RUNNER_TEMP/t4-new" "$RUNNER_TEMP/t4-old"

  publish:
    name: P5 scoreboard issues and summary
    needs: [pick, scoreboard]
    # a harness that failed still leaves a board (its rows read invalid or missing)
    if: always() && (needs.scoreboard.result == 'success' || needs.scoreboard.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # the p5-scoreboard-summary branch only
      issues: write     # one p5-red issue per red tier
    env:
      # only the official board (the PC) files issues and gates; from the route the board
      # ran on, not the switches now
      OFFICIAL: ${{ needs.pick.outputs.route == 'pc' }}
      ISSUES: ${{ needs.pick.outputs.route == 'pc' && (github.event.inputs.issues || 'apply') || 'off' }}
      LIMIT: ${{ github.event.inputs.limit || '0' }}
      # the PC's reports keep their names; a Mac's carry -mac (another oracle)
      SUFFIX: ${{ needs.pick.outputs.route == 'pc' && '' || '-mac' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: p5-scoreboard
          path: ${{ runner.temp }}/p5
      - name: one p5-red issue per red tier (behind v1, or below a target or the owner's bar)
        if: env.ISSUES != 'off'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -f "$RUNNER_TEMP/p5/board/scoreboard.json" ] || { echo "::warning::no board: no issues filed"; exit 0; }
          python3 tools/parity/scoreboard.py --from-board "$RUNNER_TEMP/p5/board/scoreboard.json" \
            --issues "$ISSUES" --repo "$GITHUB_REPOSITORY" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: commit the summary to p5-scoreboard-summary
        if: github.ref == 'refs/heads/main' && env.LIMIT == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -f "$RUNNER_TEMP/p5/SUMMARY.md" ] || exit 0
          b=p5-scoreboard-summary d="$RUNNER_TEMP/summary-wt" day=$(date -u +%F)
          # the token lives in this step's remote URL only; checkout persisted none
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch --depth 1 "$url" "$b"; then git worktree add -B "$b" "$d" FETCH_HEAD
          else git worktree add --detach "$d" && git -C "$d" checkout --orphan "$b" && git -C "$d" rm -rfq .; fi
          mkdir -p "$d/reports"
          # SUMMARY.md is the official board's (the PC); an unofficial Mac board adds its report only
          if [ "$OFFICIAL" = true ]; then
            cp "$RUNNER_TEMP/p5/SUMMARY.md" "$d/SUMMARY.md"
            if [ -f "$RUNNER_TEMP/p5/ORACLE.md" ]; then { echo; cat "$RUNNER_TEMP/p5/ORACLE.md"; } >> "$d/SUMMARY.md"; fi
          fi
          cp "$RUNNER_TEMP/p5/board/scoreboard.md" "$d/reports/$day$SUFFIX.md"
          cp "$RUNNER_TEMP/p5/board/scoreboard.json" "$d/reports/$day$SUFFIX.json"
          if [ -f "$RUNNER_TEMP/p5/ORACLE.md" ]; then
            { echo; cat "$RUNNER_TEMP/p5/ORACLE.md"; } >> "$d/reports/$day$SUFFIX.md"
          fi
          git -C "$d" add -A
          git -C "$d" -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -qm "P5 scoreboard $day (workflow at ${GITHUB_SHA::9}; the board records the measured commit)" || exit 0
          git -C "$d" push "$url" "$b"
      # The gate, last, so the issues and the summary are written first: the run fails
      # unless the official board is all green (every row green, every run complete).
      - name: the gate (the official board is all green)
        if: env.OFFICIAL == 'true'
        run: |
          set -euo pipefail
          [ -f "$RUNNER_TEMP/p5/board/scoreboard.json" ] || { echo "::error::P5 scoreboard gate: no board was written"; exit 1; }
          python3 tools/parity/scoreboard.py --from-board "$RUNNER_TEMP/p5/board/scoreboard.json" \
            --issues off --require-green

  scoreboard-unavailable:
    name: P5 scoreboard (new vs v1, every tier)
    needs: pick
    if: needs.pick.outputs.route == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Not measured is not green: the gate fails while its host is off.
      - run: |
          echo "::error::not measured: the official P5 scoreboard runs on the NixOS PC (TeX Live 2026), whose switch FLASHTEX_SELFHOSTED_LINUX is off. A Mac board (unofficial) is a manual run with route mac."
          echo "Set \`gh variable set FLASHTEX_SELFHOSTED_LINUX --body 1\` once the PC's runners are registered." >> "$GITHUB_STEP_SUMMARY"
          exit 1
