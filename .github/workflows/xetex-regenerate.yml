# The XeTeX port's translation regenerated on a hosted runner
# (scripts/xetex-regenerate.sh: web2rust over third_party/xetex/xetex.web and
# crates/flashtex-xetex/changes/), for a change-file edit made on a machine
# that does not build. The fresh crates/flashtex-xetex/src/generated/ and
# xetex.pool are the `xetex-generated` artifact. They are committed by hand
# after review; the drift test (quick gate) then checks them.
#
#   gh workflow run xetex-regenerate.yml --ref <branch>
#
# It also runs, when a change file or the translator's arguments change, on
# a pull request, on a push to main, and on a push to the XeTeX lanes'
# branches (`on:` below).
name: xetex-regenerate

on:
  workflow_dispatch:
  # Push runs only on main and on the lanes that measure with this workflow;
  # any other branch gets it through its pull request (same paths) or by
  # `gh workflow run <file> --ref <branch>`. Push runs on every feature
  # branch were most of a 396-run queue on 2026-11-08.
  push:
    branches:
      - main
      - "agent/*unicode*"
      - "agent/*unicode*/**"
      - "agent/daniel-parent/xetex-intr*"
    paths:
      - "crates/flashtex-xetex/changes/**"
      - "crates/flashtex-xetex/web2rust-default.args"
      - ".github/workflows/xetex-regenerate.yml"
  pull_request:
    paths:
      - "crates/flashtex-xetex/changes/**"
      - "crates/flashtex-xetex/web2rust-default.args"
      - ".github/workflows/xetex-regenerate.yml"

permissions:
  contents: read

concurrency:
  # One group per branch, whichever event started the run: a unicode lane's
  # branch push and its pull request's run test the same head, and each
  # cancelled the other's queue position only by luck before (the push ran
  # in refs/heads/<b>, the pull request in refs/pull/<n>/merge). Keyed on
  # the head repository too, so a fork's branch never shares a group with
  # ours. Main is never cancelled (one runs, the newest waits); a manual run
  # gets a group of its own.
  group: xetex-regenerate-${{ github.event_name == 'workflow_dispatch' && github.run_id || format('{0}:{1}', github.event.pull_request.head.repo.full_name || github.repository, github.head_ref || github.ref_name) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main' }}

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: xetex-regenerate
      - name: web2rust over xetex.web and the change files
        run: |
          set -euo pipefail
          sh scripts/xetex-regenerate.sh
          git status --short crates/flashtex-xetex
          git diff --stat crates/flashtex-xetex | tail -5
      - uses: actions/upload-artifact@v4
        with:
          name: xetex-generated
          path: |
            crates/flashtex-xetex/src/generated
            crates/flashtex-xetex/xetex.pool
          retention-days: 7
