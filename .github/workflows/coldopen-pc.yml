# The first open of Infinite Descent x2 (1,152 pages) on the NixOS PC, against pdflatex: first
# page, each pass, DONE, pages per second, the engine thread's instructions and cycles, and
# optionally a `perf` profile (lane COLD-FIRST-2; DESIGN.md §1.2 "Opening"). Measurement only, by
# hand: workflow_dispatch, or a push to an `agent/kabir-claude-coldfirst2/pc/**` branch whose
# tools/incr-bench/coldopen-pc.request (shell assignments of REFS, REPS, PERF) says what to run
# (DESIGN §9.3: no pull request ever runs on a self-hosted runner). The script says what it runs:
# tools/incr-bench/coldopen-pc.sh. Its wall times are a reference only when the PC is otherwise
# quiet: the summary has each open's load1.
name: coldopen-pc

on:
  push:
    branches: ["agent/kabir-claude-coldfirst2/pc/**"]
  workflow_dispatch:
    inputs:
      refs:
        description: "git refs to build and open, space-separated (A/B: interleaved)"
        default: "main"
      reps:
        description: "cold opens per ref"
        default: "2"
      perf:
        description: "1: also a perf record of the first ref's open (its top symbols); 2: of every ref's"
        default: "0"

permissions:
  contents: read

jobs:
  coldopen:
    name: "infdesc-x2 cold open on the PC, against pdflatex"
    if: (vars.FLASHTEX_SELFHOSTED_LINUX || vars.FLASHTEX_SELFHOSTED_MAC) == '1'
    runs-on: [self-hosted, Linux, X64, flashtex-linux]
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: "4"
      IN_REFS: ${{ github.event.inputs.refs || 'main' }}
      IN_REPS: ${{ github.event.inputs.reps || '2' }}
      IN_PERF: ${{ github.event.inputs.perf || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: this runner's build directory; a pushed request
        run: |
          set -euo pipefail
          echo "CARGO_TARGET_DIR=$HOME/.cache/flashtex-ci/$RUNNER_NAME/target-coldopen" >> "$GITHUB_ENV"
          f=tools/incr-bench/coldopen-pc.request
          if [ "$GITHUB_EVENT_NAME" = push ] && [ -f "$f" ]; then
            grep -E '^(REFS|REPS|PERF)=' "$f" | sed -E "s/^([A-Z]+)='?([^']*)'?$/\1=\2/" >> "$GITHUB_ENV"
            cat "$f"
          else
            { echo "REFS=$IN_REFS"; echo "REPS=$IN_REPS"; echo "PERF=$IN_PERF"; } >> "$GITHUB_ENV"
          fi
      - name: build each ref, then pdflatex's passes and the cold opens
        run: |
          set -o pipefail
          refs=()
          for r in $REFS; do
            # a branch name is origin's (the checkout has no local branches but its own)
            if git rev-parse -q --verify "origin/$r^{commit}" >/dev/null; then refs+=("origin/$r"); else refs+=("$r"); fi
          done
          tools/incr-bench/coldopen-pc.sh "$RUNNER_TEMP/coldopen" "$REPS" "$PERF" "${refs[@]}" \
            2>&1 | tee "$RUNNER_TEMP/coldopen.log"
      - name: summary
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/coldopen/r/summary.md" ] || exit 0
          { echo '### infdesc-x2 cold open (PC)'; cat "$RUNNER_TEMP/coldopen/r/summary.md"; } >> "$GITHUB_STEP_SUMMARY"
      - name: keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coldopen-pc
          path: |
            ${{ runner.temp }}/coldopen/r/
            ${{ runner.temp }}/coldopen.log
          if-no-files-found: ignore
          retention-days: 30
      - name: clean up
        if: always()
        run: rm -rf "$RUNNER_TEMP/coldopen"
