# The first open of Infinite Descent x2 (1,152 pages) on the NixOS PC, against pdflatex: first
# page, each pass, DONE, pages per second, the engine thread's instructions and cycles, and
# optionally a `perf` profile (lane COLD-FIRST-2; DESIGN.md §1.2 "Opening"). Measurement only, by
# hand: workflow_dispatch, nothing else (DESIGN §9.3: no pull request ever runs on a self-hosted
# runner). The script says what it runs: tools/incr-bench/coldopen-pc.sh. Its wall times are a
# reference only when the PC is otherwise quiet: the summary has each open's load1.
name: coldopen-pc

on:
  workflow_dispatch:
    inputs:
      refs:
        description: "git refs to build and open, space-separated (A/B: interleaved)"
        default: "main"
      reps:
        description: "cold opens per ref"
        default: "2"
      perf:
        description: "1: also a perf record of the first ref's open (its top symbols)"
        default: "0"

permissions:
  contents: read

jobs:
  coldopen:
    name: "infdesc-x2 cold open on the PC, against pdflatex"
    if: (vars.FLASHTEX_SELFHOSTED_LINUX || vars.FLASHTEX_SELFHOSTED_MAC) == '1'
    runs-on: [self-hosted, Linux, X64, flashtex-linux]
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: "4"
      REFS: ${{ github.event.inputs.refs || 'main' }}
      REPS: ${{ github.event.inputs.reps || '2' }}
      PERF: ${{ github.event.inputs.perf || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: this runner's build directory
        run: echo "CARGO_TARGET_DIR=$HOME/.cache/flashtex-ci/$RUNNER_NAME/target-coldopen" >> "$GITHUB_ENV"
      # SCRATCH BRANCH ONLY (agent/kabir-claude-unicode/profile-pc, never merged): this
      # dispatch runs tools/unicode-m3/restart_profile.sh instead of the cold opens.
      - name: Unicode vs Classic keystroke profile
        run: |
          set -o pipefail
          chmod +x tools/unicode-m3/restart_profile.sh
          GAP=0 tools/unicode-m3/restart_profile.sh "$RUNNER_TEMP/uprof" 60 2>&1 | tee "$RUNNER_TEMP/uprof.log"
      - name: keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unicode-restart-profile
          path: |
            ${{ runner.temp }}/uprof/r/
            ${{ runner.temp }}/uprof.log
          if-no-files-found: ignore
          retention-days: 30
      - name: clean up
        if: always()
        run: rm -rf "$RUNNER_TEMP/uprof"
