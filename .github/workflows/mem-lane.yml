# Lane MEMORY's measurement (2026-11-01; never merged to main): pushes to
# agent/kabir-claude-memory/measure* run docs/evidence/mem-lane-2026-11-01/scripts/run.sh on a NixOS
# runner, inside flashtex.slice with MemoryMax=10G, and upload its results.
name: mem-lane

on:
  push:
    branches: ["agent/kabir-claude-memory/measure*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: [self-hosted, Linux, X64, flashtex-linux]
    timeout-minutes: 300
    env:
      CARGO_BUILD_JOBS: "4"
      FLASHTEX_REQUIRE_TEXLIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: this runner's build directory
        run: |
          echo "CARGO_TARGET_DIR=$HOME/.cache/flashtex-ci/$RUNNER_NAME/target-mem-lane" >> "$GITHUB_ENV"
          echo "HT_TARGET=$HOME/.cache/flashtex-ci/$RUNNER_NAME/target-mem-lane-ht" >> "$GITHUB_ENV"
      - name: measure
        run: |
          set -o pipefail
          cfg=$(cat docs/evidence/mem-lane-2026-11-01/scripts/ci.env 2>/dev/null || true)
          echo "config: $cfg"
          HT=$(nix build --no-link --print-out-paths nixpkgs#heaptrack 2>/dev/null || true)
          [ -n "$HT" ] && export PATH="$HT/bin:$PATH"
          env $cfg systemd-run --user --scope --quiet --slice=flashtex.slice -p MemoryMax=10G -p MemoryHigh=9G \
            -p MemorySwapMax=0 nice -n 10 bash docs/evidence/mem-lane-2026-11-01/scripts/run.sh "$RUNNER_TEMP/ml" \
            2>&1 | tee "$RUNNER_TEMP/ml.log"
      - name: summary
        if: always()
        run: |
          { echo '```'; tail -40 "$RUNNER_TEMP/ml.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mem-lane
          path: |
            ${{ runner.temp }}/ml/*.jsonl
            ${{ runner.temp }}/ml/*.json
            ${{ runner.temp }}/ml/*.txt
            ${{ runner.temp }}/ml/*.tsv
            ${{ runner.temp }}/ml/*.err
            ${{ runner.temp }}/ml/HEAD
            ${{ runner.temp }}/ml.log
          if-no-files-found: ignore
