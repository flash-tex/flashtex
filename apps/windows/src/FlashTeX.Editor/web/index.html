<!doctype html>
<!--
  name: index.html
  purpose: Host page for the FlashTeX Windows editor pane's WebView2 control.
    Loaded via CoreWebView2.SetVirtualHostNameToFolderMapping (never a real
    HTTP server, never a network request) pointed at this package's `dist/`
    build output; `npm run build` bundles main.ts + CodeMirror + the LaTeX
    grammar into dist/assets/*.js referenced below by Vite's rewritten script
    tag.
  author: Claude Sonnet 5
  date: 2026-09-14
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>FlashTeX Editor</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #editor,
      .cm-editor {
        width: 100%;
        height: 100%;
      }

      .cm-editor {
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="editor"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
