# FlashTeX Cargo workspace (docs/proposals/generated-data-and-maintainability.md
# §3.2, slice 2 complete).
#
# Every crate under crates/ is a member, except crates/flashtex-xetex (exclude below): one Cargo.lock (this directory's), one target
# directory (./target), and `cargo test --workspace` tests them all.
# Binaries of member crates are therefore built into ./target/<profile>/, NOT
# crates/<name>/target/<profile>/ -- scripts that need a helper binary resolve
# the directory with scripts/crate-target-dir.sh instead of hard-coding it.
[workspace]
# Resolver 2 is what every 2021-edition member used on its own; the 2024-edition
# members' implicit resolver 3 differs only in MSRV-aware version selection,
# and the lockfile was seeded from the members' former lockfiles, so no member
# resolves a crates.io version it did not already lock.
resolver = "2"
members = ["crates/*", "tools/web2rust"]
# The XeTeX port (docs/design/xetex/PLAN.md) is built on its own, with its own
# lockfile and target directory (scripts/xetex-lockstep.sh), so that its 70k
# generated lines do not slow every workspace build and gate.
exclude = ["crates/flashtex-xetex"]

# The T7 interactive-performance gate (tools/incr-bench/t7.py, run on the
# reference Mac by scripts/t7-reference.sh, DESIGN.md §8 T7) builds the
# engine with `cargo build --release` in this workspace, and its committed
# reference runs (docs/evidence/t7-reference-*) record the commit they were
# built from. Two runs' timings are only comparable when they were built with
# the same profile, so the `release` values are pinned here rather than left
# implicit -- they are cargo's stock ones. Changing anything here makes every
# committed T7 reference run incomparable with the next, so it needs a new
# reference run (retirement plan §4.5). cargo ignores `[profile]` in a
# non-root member, so this is the only place they can live.
[profile.release]
opt-level = 3
lto = false
codegen-units = 16
panic = "unwind"
debug = false

# `--profile perf` for flamegraphs: identical codegen, line tables kept so
# symbols resolve. Never record a committed T7 reference run with it: T7
# builds `--release`, and a run from another profile is not comparable.
[profile.perf]
inherits = "release"
debug = 1
strip = "none"
