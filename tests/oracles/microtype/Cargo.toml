[package]
name = "flashtex-microtype"
version = "0.1.0"
edition = "2024"
# FlashTeX's own code is MIT (LICENSE at the repository root). data/*.cfg are
# unmodified TeX Live 2026 copies of microtype's configuration files and keep
# their own terms (LPPL 1.3c; see src/config.rs).
license = "MIT"
description = "Original FlashTeX model of pdfTeX character protrusion and font expansion as configured by the LaTeX microtype package: config parsing/resolution, pdfTeX integer arithmetic, and line-breaking/packing hooks. No external crates, no TeX engine involved."
publish = false

[lib]
name = "flashtex_microtype"
path = "src/lib.rs"

[dependencies]
